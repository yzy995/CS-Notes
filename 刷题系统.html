am": true}, {"id": 12, "type": "选择题", "question": "12. 以下哪个命令可以查看ROS 2中某个话题的发布频率？（ ）\nA. `ros2 topic list`\nB. `ros2 topic echo`\nC. `ros2 topic hz`\nD. `ros2 node info`\n知识点：ROS 2通信机制", "answer": "C", "exam": true}, {"id": 13, "type": "选择题", "question": "13. 在机器人操作系统中，用于节点之间异步通信的最基本方式是？（ ）\nA. 服务（Service）\nB. 动作（Action）\nC. 话题（Topic）\nD. 参数（Parameter）", "answer": "C", "exam": true}, {"id": 14, "type": "选择题", "question": "14. 在ROS 2中，用于远程过程调用并支持返回值的通信机制是？（ ）\nA. 话题\nB. 服务\nC. 动作\nD. 参数", "answer": "B", "exam": true}, {"id": 15, "type": "选择题", "question": "15. 动作（Action）通信机制相比于服务（Service），最主要的优势在于？（ ）\nA. 通信速度更快\nB. 不需要编写服务器端代码\nC. 通信数据量更小\nD. 能够处理长时间运行的任务，并提供实时反馈，且支持任务取消", "answer": "D", "exam": true}, {"id": 16, "type": "选择题", "question": "16. 同步性高、实时性强、有反馈的通信方式为？（ ）\nA. 服务\nB. 话题\nC. 节点\nD. 动作\n知识点：机器人基础概念", "answer": "A", "exam": true}, {"id": 17, "type": "选择题", "question": "17. 人形机器人中，用于实现关节运动的核心组件是？（ ）\nA. 舵机\nB. 摄像头\nC. 激光雷达\nD. 温湿度传感器", "answer": "A", "exam": true}, {"id": 18, "type": "选择题", "question": "18. 机器人可以独立运动的关节称为机器人的（ ）\nA. 功能度\nB. 运动自由度\nC. 灵活度\nD. 节点", "answer": "B", "exam": true}, {"id": 19, "type": "选择题", "question": "19. 机器人三大定律中，优先级最高的是？（ ）\nA. 机器人不得伤害人类\nB. 机器人必须服从人类命令\nC. 机器人必须保护自身安全\nD. 三者优先级相同", "answer": "A", "exam": true}, {"id": 20, "type": "选择题", "question": "20. 根据艾萨克·阿西莫夫提出的“机器人三大定律”，当机器人同时面临以下情况时，其行为优先级最高的是：（ ）\n① 人类命令机器人伤害另一个人类\n② 机器人发现自身故障可能导致人类受伤\n③ 机器人被人类要求违反第一定律\nA. ① > ② > ③\nB. ② > ③ > ①\nC. ② > ① > ③\nD. ③ > ② > ①\n知识点：SLAM与定位", "answer": "B", "exam": true}, {"id": 21, "type": "选择题", "question": "21. SLAM技术的全称是什么？（ ）\nA. Simultaneous Localization and Mapping\nB. Sequential Localization and Motion\nC. Systematic Learning and Modeling\nD. Sensor-based Localization and Movement", "answer": "A", "exam": true}, {"id": 22, "type": "选择题", "question": "22. SLAM技术的主要目标是？（ ）\nA. 路径规划\nB. 地图构建与定位\nC. 避障控制\nD. 机械臂逆解\n知识点：仿真与URDF", "answer": "B", "exam": true}, {"id": 23, "type": "选择题", "question": "23. 在机器人仿真中，URDF文件主要用于描述什么？（ ）\nA. 机器人操作系统版本\nB. 机器人模型的结构与属性\nC. 传感器数据格式\nD. 控制算法流程", "answer": "B", "exam": true}, {"id": 24, "type": "选择题", "question": "24. URDF文件中，`<link>`标签用于描述什么？（ ）\nA. 机器人的关节\nB. 机器人的连杆（刚体部分）\nC. 机器人的传感器\nD. 机器人的控制器", "answer": "B", "exam": true}, {"id": 25, "type": "选择题", "question": "25. 若要进行三维物理仿真，不可使用以下哪个应用？（ ）\nA. Rviz\nB. Gazebo\nC. Rqt\nD. Webots", "answer": "C", "exam": true}, {"id": 26, "type": "选择题", "question": "26. 以下哪个仿真平台适合多机器人协同仿真？（ ）\nA. Gazebo\nB. MATLAB\nC. PyBullet\nD. Webots", "answer": "A", "exam": true}, {"id": 27, "type": "选择题", "question": "27. 在V-REP (CoppeliaSim) 中，要实现与外部ROS 2节点的双向通信，最关键的操作步骤是？（ ）\nA. 在V-REP中编写Lua脚本定义通信接口\nB. 在ROS 2节点中安装V-REP软件\nC. 将ROS 2的功能包改名为V-REP\nD. 在Ubuntu中配置双系统启动\n知识点：图像识别与传感器", "answer": "A", "exam": true}, {"id": 28, "type": "选择题", "question": "28. 机器人使用摄像头识别红色物体，通常先将图像从RGB转换到哪种颜色空间？（ ）\nA. CMYK\nB. Gray\nC. YUV\nD. HSV", "answer": "D", "exam": true}, {"id": 29, "type": "选择题", "question": "29. 机器人图像识别中，将ROS图像消息转换为OpenCV图像格式，需要使用哪个库？（ ）\nA. `cv_bridge`\nB. `image_transport`\nC. `rclpy`\nD. `tf2`", "answer": "A", "exam": true}, {"id": 30, "type": "选择题", "question": "30. 超声波传感器的主要作用是？（ ）\nA. 视觉成像\nB. 距离测量\nC. 颜色识别\nD. 力反馈", "answer": "B", "exam": true}, {"id": 31, "type": "判断题", "question": "1. 在ROS 2中，一个节点只能发布一个话题，也只能订阅一个话题。（ ）", "answer": "×", "exam": true}, {"id": 32, "type": "判断题", "question": "2. ROS 2支持多机器人在同一网络下通信。（ ）", "answer": "√", "exam": true}, {"id": 33, "type": "判断题", "question": "3. ROS 2节点可以用C++和Python混合编写。（ ）", "answer": "√", "exam": true}, {"id": 34, "type": "判断题", "question": "4. ROS 2可以跨平台使用，Linux、Windows等系统都可以使用。（ ）", "answer": "√", "exam": true}, {"id": 35, "type": "判断题", "question": "5. 工作空间中的`install`目录用于存放源代码。（ ）", "answer": "×", "exam": true}, {"id": 36, "type": "判断题", "question": "6. `ros2 launch`命令不仅可以启动多个节点，还可以为节点设置参数和定义启动顺序依赖。（ ）", "answer": "√", "exam": true}, {"id": 37, "type": "判断题", "question": "7. 在ROS 2中，自定义消息类型（.msg）定义后，无需重新编译工作空间即可在代码中直接使用。（ ）", "answer": "×", "exam": true}, {"id": 38, "type": "判断题", "question": "8. `ros2 topic echo`命令用于查看话题发布的消息内容。（ ）", "answer": "√", "exam": true}, {"id": 39, "type": "判断题", "question": "9. 使用`rqt_graph`工具可以可视化当前系统中所有节点、话题、服务之间的实时通信拓扑关系。（ ）", "answer": "√", "exam": true}, {"id": 40, "type": "判断题", "question": "10. ROS 2的参数服务器可以在节点运行时动态修改参数。（ ）\n通信机制", "answer": "√", "exam": true}, {"id": 41, "type": "判断题", "question": "11. 服务通信是一种有请求-响应机制的同步通信方式。（ ）", "answer": "√", "exam": true}, {"id": 42, "type": "判断题", "question": "12. 在ROS 2中，服务（Service）通信是单向的，不支持返回值。（ ）\nSLAM与地图", "answer": "×", "exam": true}, {"id": 43, "type": "判断题", "question": "13. 在SLAM中，机器人必须预先知道环境地图才能进行定位。（ ）", "answer": "×", "exam": true}, {"id": 44, "type": "判断题", "question": "14. SLAM过程不需要任何先验地图信息，但需要已知机器人的精确初始位置。（ ）", "answer": "×", "exam": true}, {"id": 45, "type": "判断题", "question": "15. SLAM算法通常将未知区域标记为-1。（ ）", "answer": "√", "exam": true}, {"id": 46, "type": "判断题", "question": "16. 栅格地图中，通常用0表示障碍物，1表示可通行区域。（ ）", "answer": "×", "exam": true}, {"id": 47, "type": "判断题", "question": "17. 在TF坐标系树中，`/map`坐标系与`/odom`坐标系之间的变换通常是静态固定不变的。（ ）\n仿真与URDF", "answer": "×", "exam": true}, {"id": 48, "type": "判断题", "question": "18. URDF文件中可以同时描述机器人的几何形状和关节类型。（ ）", "answer": "√", "exam": true}, {"id": 49, "type": "判断题", "question": "19. Gazebo仿真器无法模拟激光雷达，只能模拟视觉传感器。（ ）", "answer": "×", "exam": true}, {"id": 50, "type": "判断题", "question": "20. 仿真环境中调试成功的机器人算法，可以直接迁移到真实机器人，无需任何调整。（ ）", "answer": "×", "exam": true}, {"id": 51, "type": "论述题", "question": "1. 简述ROS 2中话题、服务和动作三种通信机制的区别及适用场景。", "answer": "话题、服务、动作的区别及适用场景\n话题：异步，发布-订阅，一对多，无返回值。适用传感器数据流。\n服务：同步请求-响应，一对一，有返回值。适用一次性请求（如参数设置）。\n动作：异步，支持反馈和取消，适用长时间任务（如导航、抓取）。", "exam": true}, {"id": 52, "type": "论述题", "question": "2. ROS 2中的节点是什么？如何启动一个节点？", "answer": "节点及启动\n节点是ROS 2中执行具体功能的进程。启动命令：`ros2 run <package_name> <node_name>`", "exam": true}, {"id": 53, "type": "论述题", "question": "3. 简述ROS 2中功能包（package）的概念及其核心组成。", "answer": "功能包（package）\n功能包是ROS 2软件组织的基本单元，包含`package.xml`（元信息）、源代码、消息/服务定义、构建配置等。", "exam": true}, {"id": 54, "type": "论述题", "question": "4. 工作空间的作用是什么？ROS 2中的工作空间通常包含哪些目录？请分别简述它们的作用。", "answer": "工作空间目录作用\nsrc：存放功能包源代码。\nbuild：存放编译中间文件。\ninstall：存放编译后的可执行文件、库、环境脚本等。\nlog：存放编译和运行日志。", "exam": true}, {"id": 55, "type": "论述题", "question": "5. 什么是SLAM？它在机器人领域中的作用是什么？", "answer": "SLAM定义与作用\nSLAM：同步定位与地图构建。使机器人在未知环境中同时估计自身位置和构建环境地图，是实现自主移动的核心技术。", "exam": true}, {"id": 56, "type": "论述题", "question": "6. 分析人工智能领域中，机器人难以取代人类的工作类型，并说明原因。", "answer": "机器人难以取代的工作\n需要创造力、情感交互、应对非结构化环境、伦理判断等工作。原因：缺乏真正意识、共情能力、常识推理及法律主体资格。", "exam": true}, {"id": 57, "type": "论述题", "question": "7. 机器人是一个多学科融合的学科，请简述涉及哪些学科的内容。", "answer": "机器人涉及学科\n数学、物理学、计算机科学、机械工程、电子工程、控制工程、人工智能、仿生学、生物医学、航天工程、经济学、伦理学等。", "exam": true}, {"id": 58, "type": "论述题", "question": "8. 一个完整的机器人系统架构包括感知-决策-控制-仿真四个模块，请简要说明每个模块的职责。", "answer": "机器人系统四个模块\n感知：通过传感器获取环境信息（SLAM、视觉）。\n决策：任务规划、路径规划、逻辑判断。\n控制：执行运动控制（底盘、机械臂）。\n仿真：算法验证、调试、测试（Gazebo、Rviz）。", "exam": true}, {"id": 59, "type": "论述题", "question": "9. 有人认为“扫地机器人不属于机器人”，你是否同意？请说明理由。", "answer": "扫地机器人是否属于机器人\n同意或不同意均可，需有理有据。常见观点：属于机器人，因为它具备感知（传感器）、决策（路径规划）、执行（移动和清扫）的自主能力。\n10.激光测距传感器通过发射激光束并测量反射时间来计算与目标物体的距离，通常返回一维或多维距离数组，每个数据点对应某一角度方向的距离值。判断前方障碍物时，可提取机器人前进方向（如正前方±10°范围）的距离值，若最小值小于预先设定的安全阈值（如0.5米），则认为前方存在障碍物。示例：若传感器返回正前方0°方向距离为0.3米，小于0.5米，则判定有障碍。\n11.一种常见方法是使用SLAM技术。机器人搭载激光雷达或深度相机，在移动过程中持续扫描环境，提取特征点，并与之前建立的地图进行匹配，从而实时修正自身位姿。SLAM通过回环检测，当机器人再次经过已访问区域时，可显著消除里程计的累积漂移，得到全局一致的定位结果。另一种方法是融合惯性测量单元（IMU），利用加速度计和陀螺仪数据通过积分得到短时高精度位姿，再结合扩展卡尔曼滤波与里程计数据融合，抑制误差发散。", "exam": true}, {"id": 60, "type": "论述题", "question": "10.机器人搭载激光测距传感器，在移动过程中需要实时检测前进路径上是否存在障碍物。请说明该类传感器数据的物理含义，并阐述如何利用这些数据判断前方是否有障碍。请给出一个基于距离阈值的判断示例。", "answer": "", "exam": true}, {"id": 61, "type": "论述题", "question": "11.请提出一种不依赖里程计的技术手段来提高机器人的定位精度，并简要说明其工作原理。", "answer": "", "exam": true}, {"id": 62, "type": "画图题", "question": "1. 话题通信模型图\n在机器人系统中，有一个“速度控制节点”负责发布机器人的移动速度指令，另一个“电机驱动节点”负责订阅该速度指令并控制电机实际运动。请画出两个节点通过话题通信的示意图。\n要求：标出发布者节点名称：`/cmd_vel_publisher`\n标出订阅者节点名称：`/motor_driver`\n标出话题名称：`/cmd_vel`\n用箭头标出消息的流向", "answer": "", "exam": true}, {"id": 63, "type": "画图题", "question": "2. SLAM地图构建\n假设机器人使用激光雷达进行两次扫描，栅格地图分辨率为 1m×1m，机器人两次扫描的位置和扫描数据如下。\n第一次扫描：\n机器人位置为坐标原点（0，0），朝向正东（x 轴正方向）。\n扫描数据（角度为相对于机器人朝向的极角）\n第二次扫描：\n机器人位置为坐标（3，2），朝向正东（x 轴正方向）。\n扫描数据（角度为相对于机器人朝向的极角）\n在同一张栅格地图中，标注两次扫描的机器人位置，并根据两次扫描数据，绘制合并后的栅格地图。\n要求：用 ☆ 表示机器人位置，用 ■ 表示障碍物栅格，用·表示可通行栅格，未探测区域留空。", "answer": "", "exam": true}], "编译原理": [{"id": 1, "type": "简答题", "question": "编译程序是一种(B)", "answer": "B", "exam": true}, {"id": 2, "type": "简答题", "question": "编译原理是对(C)", "answer": "C", "exam": true}, {"id": 3, "type": "简答题", "question": "(A)是一种典型的解释型语言。", "answer": "", "exam": true}, {"id": 4, "type": "简答题", "question": "把汇编语言程序翻译成机器可执行的目标程序的工作是由(B)完成的", "answer": "", "exam": true}, {"id": 5, "type": "简答题", "question": "用高级语言编写的程序经编译后产生的程序叫(B)", "answer": "B", "exam": true}, {"id": 6, "type": "简答题", "question": "(C)不是编译程序的组成部分", "answer": "", "exam": true}, {"id": 7, "type": "简答题", "question": "通常一个编译程序中，不仅包含词法分析，语法分析，语义分析，中间代码生成，代码优化，目标代码生成等六个部分，还应包括(C)", "answer": "C", "exam": true}, {"id": 8, "type": "简答题", "question": "按逻辑上划分，编译程序第三步工作是(A)", "answer": "A", "exam": true}, {"id": 9, "type": "简答题", "question": "编译原理各阶段工作都涉及(B)", "answer": "B", "exam": true}, {"id": 10, "type": "简答题", "question": "编译程序绝大多数时间花在(D)上", "answer": "", "exam": true}, {"id": 11, "type": "简答题", "question": "在使用高级语言编程时 ,首先可通过编译程序发现源程序的全部语法错误和部分(B)错误", "answer": "", "exam": true}, {"id": 12, "type": "简答题", "question": "编译程序分两阶段工作，前阶段完成的工作是(C)", "answer": "C", "exam": true}, {"id": 13, "type": "简答题", "question": "关于程序设计语言的翻译机制，下列选项说法错误的是(D)", "answer": "D", "exam": true}, {"id": 14, "type": "简答题", "question": "代码优化的目的是(C)", "answer": "C", "exam": true}, {"id": 15, "type": "简答题", "question": "代码生成阶段的主要任务是(C)", "answer": "C", "exam": true}, {"id": 16, "type": "简答题", "question": "下面说法正确的是(A)", "answer": "A", "exam": true}, {"id": 17, "type": "简答题", "question": "程序设计语言的翻译机制中，汇编程序、编译程序和解释程序三种翻译程序实现的难易程度，由易到难依次是 汇编程序 、 解释程序 、 编译程序", "answer": "", "exam": true}, {"id": 件生存周期是从软件开始开发到开发结束的整个时期。（ ×）", "answer": "", "exam": true}, {"id": 73, "type": "判断题", "question": "30.软件产品当中潜在的错误数量与已发现的错误数量成正比。（ √）", "answer": "", "exam": true}, {"id": 74, "type": "判断题", "question": "31.软件设计种设计详审和设计本身一样重要，其主要作用是避免后期付出高昂的\n代价。（ √）", "answer": "", "exam": true}, {"id": 75, "type": "判断题", "question": "32.软件的开发工作中，为了保证工作的进度，开发工作与测试工作应交给同一部\n分人完成。（ ×）", "answer": "", "exam": true}, {"id": 76, "type": "判断题", "question": "33.软件是指用程序设计语言（如 Python，C++，Java等）编写的程序，软件开\n发实际上就是编写程序代码。（ ×）", "answer": "", "exam": true}, {"id": 77, "type": "判断题", "question": "34.软件调试工作的主要任务，就是批量挖掘出软件内部潜藏的各类程序错误与漏\n洞。（ ×）", "answer": "", "exam": true}, {"id": 78, "type": "判断题", "question": "35.单元测试主要针对模块的几个基本特征进行测试，该阶段不能完成的测试是系\n统功能。 (√)", "answer": "√", "exam": true}, {"id": 79, "type": "判断题", "question": "36.单元测试主要针对模块的几个基本特征进行测试，该阶段不能完成的测试是系\n统功能。（ √）", "answer": "", "exam": true}, {"id": 80, "type": "判断题", "question": "37.详细设计阶段只需梳理程序执行逻辑，不用编写实际程序代码。（ √）", "answer": "", "exam": true}, {"id": 81, "type": "判断题", "question": "38.类图用来表示系统中类与类之间的关系，它是对系统动态结构的描述。（ ×）", "answer": "", "exam": true}, {"id": 82, "type": "判断题", "question": "39.类封装比对象封装更具体、更细致（ ×）", "answer": "", "exam": true}, {"id": 83, "type": "判断题", "question": "40.高内聚低耦合是软件模块设计中最优的设计原则。（ √）", "answer": "", "exam": true}, {"id": 84, "type": "判断题", "question": "41.确认测试阶段的主要工作内容，是逐一检测各个程序模块之间的数据接口能否\n正常连通交互。（ ×）", "answer": "", "exam": true}, {"id": 85, "type": "判断题", "question": "42.黑盒测试可以发现性能错误、功能遗漏以及冗余代码等问题。 （×）", "answer": "×", "exam": true}, {"id": 86, "type": "判断题", "question": "43.黑盒测试只检查程序功能是否按照需求规格说明书的规定正常使用，程序是否\n能适当地接收输入数据而产生正确的输出信息，而不考虑模块的内部执行与程序结构。（ √）", "answer": "", "exam": true}, {"id": 87, "type": "判断题", "question": "44.集成测试的测试对象包括单元间的接口。（ √）", "answer": "", "exam": true}, {"id": 88, "type": "判断题", "question": "45.数据流图明了业务用例实现的工作流程。（ ×）", "answer": "", "exam": true}, {"id": 89, "type": "判断题", "question": "46.耦合用于衡量一个模块内部的各个元素彼此结合的紧密程度。（ ×）", "answer": "", "exam": true}, {"id": 90, "type": "判断题", "question": "47.增量模型把瀑布模型的顺序特征与快速原型法的迭代特征相结合。（ √）", "answer": "", "exam": true}, {"id": 91, "type": "判断题", "question": "48.螺旋模型在瀑布模型和增量模型的基础上增加了风险分析。（ ×）", "answer": "", "exam": true}, {"id": 92, "type": "填空题", "question": "1.仅检查程序代码逻辑、不运行程序的测试类型称为 __静态 ____测试。", "answer": "", "exam": true}, {"id": 93, "type": "填空题", "question": "2.功能测试 是系统测试中最基本的测试，它不管软件内部是如何实现的。", "answer": "", "exam": true}, {"id": 94, "type": "填空题", "question": "3.白盒测试逻辑覆盖标准中，测试强度最弱的是 __语句 ____覆盖。", "answer": "", "exam": true}, {"id": 95, "type": "填空题", "question": "4.对象是客观实体的抽象表示，由数据和 对数据的操作 两部分组成。", "answer": "", "exam": true}, {"id": 96, "type": "填空题", "question": "5.在MVC设计模式中，负责接收用户请求、调度业务逻辑的是 ____控制器 ____。", "answer": "", "exam": true}, {"id": 97, "type": "填空题", "question": "6.快速原型是快速建立起来的可以在计算机上运行的程序，它所能完成的功能往往是最\n终产品能完成功能的一个 _子集 _。", "answer": "", "exam": true}, {"id": 98, "type": "填空题", "question": "7.纯收入是软件生命周期中软件系统的累计经济效益与投资之差。", "answer": "", "exam": true}, {"id": 99, "type": "填空题", "question": "8.软件工程分为工具层、方法层、过程层、 质量保证层 。", "answer": "", "exam": true}, {"id": 100, "type": "填空题", "question": "9.按照功能的不同，可以把软件划分为系统软件，支撑软件和 应用软件 。", "answer": "", "exam": true}, {"id": 101, "type": "填空题", "question": "10.面向对象中， _封装 _____特性可隐藏对象内部数据与实现细节，仅对外暴露访问接口。", "answer": "", "exam": true}, {"id": 102, "type": "填空题", "question": "11.面向对象分析里，用来描述对象状态转换与事件响应流程的是 __动态 _____模型。", "answer": "", "exam": true}, {"id": 103, "type": "填空题", "question": "12.面向对象设计中，子类能够替换父类并保持功能正常，遵循的是 ___里氏替换 _____原\n则", "answer": "", "exam": true}, {"id": 104, "type": "填空题", "question": "13.面向对象的分析方法的关键是识别问题域内的 对象。", "answer": "", "exam": true}, {"id": 105, "type": "填空题", "question": "14.面向对象模型主要以对象模型，动态模型和 功能模型 。", "answer": "", "exam": true}, {"id": 106, "type": "填空题", "question": "15.适用于需求频繁变更、快速迭代开发的软件过程模型是 ___敏捷 ___模型。", "answer": "", "exam": true}, {"id": 107, "type": "填空题", "question": "16.类图是面向对象设计的核心，是建立状态图、协作图和其他图的基础。", "answer": "", "exam": true}, {"id": 108, "type": "填空题", "question": "17.活动图中必须有且仅有一个 开始标记。", "answer": "", "exam": true}, {"id": 109, "type": "填空题", "question": "18.结构化设计中，应当坚决杜绝、耦合程度最强的耦合类型是 _____内容耦合 ____。", "answer": "", "exam": true}, {"id": 110, "type": "填空题", "question": "19.结构化程序设计三大基本控制结构是顺序、 __选择 ____、_循环 _____。", "answer": "", "exam": true}, {"id": 111, "type": "填空题", "question": "20.基于组件的开发模型充分体现了 软件重用 的思想。", "answer": "", "exam": true}, {"id": 112, "type": "填空题", "question": "21.模块结构图之中如果两个模块之间有直线连接，表示它们之间存在 调用关系。", "answer": "", "exam": true}, {"id": 113, "type": "填空题", "question": "22.需求分析阶段的任务是确定 软件系统的功能 。", "answer": "", "exam": true}, {"id": 114, "type": "填空题", "question": "23.增量模型是把待开发的软件系统 模块化，将每个模块作为一个增量组件，从而分批次\n地模块化，分析，设计，编码，测试这些增量组件。", "answer": "", "exam": true}, {"id": 115, "type": "填空题", "question": "24.整体部件生命周期依附整体、不可拆分复用的类间关系是 __组合 ___。", "answer": "", "exam": true}, {"id": 116, "type": "填空题", "question": "25.螺旋模型是一种适用于 风险较大 的大型软件项目开发的过程模型", "answer": "", "exam": true}, {"id": 117, "type": "计算题", "question": "1.假设开发某个计算机应用系统的投资额为 3000元，该计算机应用系统投入使用后，每年\n可以节约 1000元， 5年内节约 5000元。 3000元是现在投资的钱，假定年利率为 12%，请\n根据以下表格 1中的数据计算该系统的纯收入和投资回收期？\n表1\n年 节省 利率 现在值（元） 累积的现在值（元）", "answer": "", "exam": true}, {"id": 118, "type": "计算题", "question": "1 1000 1.12 892.86 892.86", "answer": "", "exam": true}, {"id": 119, "type": "计算题", "question": "2 1000 1.2544 797.19 1690.05", "answer": "", "exam": true}, {"id": 120, "type": "计算题", "question": "3 1000 1.404928 711.78 2401.834 1000 1.573519 635.52 3037.35", "answer": "", "exam": true}, {"id": 121, "type": "计算题", "question": "5 1000 1.762342 567.43 3604.78\n答：纯收入 =累计现在值 -投资金额 =3604.78-3000=604.78 元\n投资回收期 =累计出现正值年份数 +上年末累计未收回投资的绝对值 /当年净现金流 =3+\n(3000-2401.83)/(3037.35-2401.83)=3.94 年", "answer": "", "exam": true}, {"id": 122, "type": "计算题", "question": "2.某公司计划开发一款库存管理软件，开发成本（包括人力、设备）共计 20万元，软件上\n线后每年可节省人工管理成本 8万元。假设软件使用寿命为 3年，不考虑其他额外成本，\n计算该项目的总收益和投资回报率（ ROI） 。（注：总收益 =每年节省成本 ×使用年限；\nROI=（总收益 -开发成本） /开发成本 ×100%）\n答：总收益 =8 × 3 = 2 4 万元； ROI=（24-20）/20×100%=4/20×100%=20%", "answer": "", "exam": true}, {"id": 123, "type": "计算题", "question": "3.某学校计划引入一套学生成绩管理系统，有 A、B两个方案可选：方案 A：自主开发，\n开发成本 15万元，每年维护成本 2万元，使用年限 5年；方案 B：购买现成系统，购\n买费用 8万元，每年维护成本 3万元，使用年限 5年。计算两个方案的 5年总成本，并\n判断哪个方案更具经济可行性。答：方案 A总成本 =开发成本 +（每年维护成本 ×使用年限） =15 +（2×5）=15+10=25 万\n元；方案 B总成本 =购买费用 +（每年维护成本 ×使用年限） =8 +\n（3×5）=8+15=23 万\n元；因为 23万元＜ 25万元，所以方案 B更具经济可行性。", "answer": "", "exam": true}, {"id": 124, "type": "计算题", "question": "4.现有一软件开发项目，其 C语言源文件总大小为 4MB，经统计每一万行 C语言源代码对\n应的源文件大小为 256KB，若该项目开发生产率为 0.8KLOC/ 人月，每人每月人工费用为\n10000元，请完成以下计算：\n（1）估算该项目代码规模为多少 KLOC？\n（2）求出项目开发工作量以及项目开发总成本；\n（3）计算平均每行代码的投入成本。\n（1）源码总容量： 4×1024=4096KB ，总代码万行数： 4096÷256=16 （万行），千行代\n码KLOC：16×10=160 （KLOC）\n（2）求工作量与总成本\n开发工作量： 160÷0.8=200 （人月），项目开发总成本： 200×10000=2000000 （元）\n（3）求单行代码成本\n总行数： 160×1000=160000 行，单行投入成本： 2000000÷160000=12.5 （元 /行）", "answer": "", "exam": true}, {"id": 125, "type": "计算题", "question": "5.某软件开发公司开发电商平台，包含五大模块代码量：用户管理 1500行、商品浏览搜索\n1000行、购物车订单 2500行、支付模块 1300行、后台管理 1700行。已知人均每月可编写\n2000行代码，每人每月人力成本 30000元。要求计算：项目总代码行数、所需开发人数、\n项目总开发成本？\n项目总代码行数： 1500+1000+2500+1300+1700=8000 行，所需开发人数 =8000÷2000=4 人，\n总开发成本 =所需开发人数 ×每人每月成本 =4×30000=120000 元。", "answer": "", "exam": true}, {"id": 126, "type": "论述题", "question": "1.软件工程的目标是什么？\n软件工程以采用工程化方法、规范化开发软件为核心，在给定成本、进度约束下，开发\n出高质量、可维护、高效率、满足用户需求的软件产品，具体分为四大目标：\n可用性：软件符合用户实际业务需求，功能正确、操作便捷，能够切实解决用户问题。可靠性：软件稳定健壮，运行故障率低，异常环境下不易崩溃，数据安全可靠。可维护性：后期发现 BUG、迭代新增需求时，修改、优化软件工作量小，便于修改升\n级。\n经济性（低成本高效率）：在预定工期与预算成本内完成开发，控制开发、运维总成本，\n提升开发效率。", "answer": "", "exam": true}, {"id": 127, "type": "论述题", "question": "2.面向对象方法的特点有哪些？\n答：（1）把数据和操作封装在一起，形成对象。\n（2）把特征相似的对象抽象为类。\n（3）类之间可以存在继承或被继承的关系，形成软件系统的层次结构。\n（4）对象类之间通过发送消息进行通信。\n（5）将对象的私有信息封装起来。", "answer": "", "exam": true}, {"id": 128, "type": "论述题", "question": "3.面向对象系统设计的主要工作？\n面向对象设计在需求分析与面向对象分析模型基础上， 将分析模型转化为可实现的软件\n架构与代码设计模型，主要包含 5项核心工作：\n系统架构设计：划分软件整体分层 /分包架构（如分层架构：表现层、业务层、数据层） ，\n确定子系统、模块划分、模块间交互规则。\n类与对象细化设计：优化分析阶段的类图，完善类的属性、成员方法，细化访问权限，\n补充派生类、抽象类设计。\n接口与消息设计：设计类之间、子系统之间的交互接口，明确对象间消息传递方式、参\n数格式与调用规则。\n数据存储设计：根据对象模型设计数据库表结构、持久化方案，完成对象与数据库的映\n射。\n人机界面与异常设计：设计用户交互界面布局，补充系统异常处理、容错、安全控制方\n案。", "answer": "", "exam": true}, {"id": 129, "type": "论述题", "question": "4.软件生命周期包含的主要阶段有哪些？\n（1）问题定义：明确项目目标、范围与开发需求边界\n（2）可行性研究：分析技术、经济、操作等落地可行性\n（3）需求分析：梳理用户需求，确定系统功能与性能要求\n（4）设计编码：完成架构、模块设计，编写程序代码\n（5）测试维护：开展多轮测试，上线后迭代修复与运维", "answer": "", "exam": true}, {"id": 130, "type": "论述题", "question": "5.软件设计的活动主要包括哪些？\n答：（1）结构设计：定义软件系统各主要部件之间的关系。\n（2）数据设计：将模型转换成数据结构的定义。\n（3）接口设计：软件内部，软件和操作系统间以及软件和人之间如何通信。\n（4）过程设计：系统结构部件转换成软件的过程描述。", "answer": "", "exam": true}, {"id": 131, "type": "论述题", "question": "6.软件危机产生的原因有哪些？\n（1）软件规模复杂度提升，逻辑与协作难度大幅增加\n（2）开发过程缺乏规范，流程管控混乱无序\n（3）需求频繁变更，前期需求定义不够准确稳定\n（4）开发工具技术受限，生产效率难以满足需求\n（5）忽视后期维护，维护成本高且难度大", "answer": "", "exam": true}, {"id": 132, "type": "论述题", "question": "7.什么是模块化设计？简述高内聚、低耦合的含义。\n答：模块化设计是将复杂软件系统拆分为独立且协同的模块，各模块通过接口交互、专注特定功能。高内聚指模块内部元素联系紧密，聚焦单一核心功能；低耦合指模块间依赖低，接口简单，修改影响小。8.通常有哪几种软件开发方法？\n答：（1）结构化方法\n（2）面向数据结构方法\n（3）面向对象方法\n（4）面向数据的方法\n（5）形式化方法", "answer": "", "exam": true}, {"id": 133, "type": "论述题", "question": "9.什么是静态测试，什么是动态测试？\n答：静态测试是采用人工检测和计算机辅助静态分析的方法对程序进行检测。动态测试是指事先设计好一组测试用例，然后通过运行程序来发现错误。10.什么是类？什么是对象？什么是类的构成成分？\n答：类是一组具有相同属性、操作的相似对象的描述。对象是类的一个实例，由一组属性和操作组成。类的构成成分包括：类名、属性、操作。", "answer": "", "exam": true}, {"id": 134, "type": "应用题", "question": "1.某公司需要开发一个 “员工考勤管理系统 ”，要求实现员工打卡、请假审批、考勤统计等功\n能。请运用面向对象设计的五个基本原则来分析如何设计这个系统，并说明每个原则的具体应用？答：（1）模块化：将系统划分为独立的模块，如员工管理、考勤记录、请假审批、统计报表模\n块，每个模块负责特定功能。（2）抽象化：定义关键抽象概念，隐藏具体实现细节。\n（3）信息隐藏：将员工薪资、审批意见等敏感数据封装在类内部，通过公共方法提供受控\n访问，隐藏实现细节。（4）低耦合：模块间通过接口交互，如考勤模块通过通知接口与审批模块通信，减少直接\n依赖。（5）高内聚：确保每个模块功能集中，如请假审批模块专注于审批流程，提高可维护性。", "answer": "", "exam": true}, {"id": 135, "type": "应用题", "question": "2.下图为开发一个铁路自动售票系统 (预计从 2021年使用到 2031年)，请完成下面的数据流\n图和数据字典，请从供选择的答案中选出 A，B，C，D，E的内容，并给出 F，G和H的内\n容，填在答案栏中。\n（1）（ 5分）数据流图\n铁路自动售票系统数据流\n【供选择的答案】A~E：（ 1）车次表 （ 2）接受 （ 3）售票记录 （ 4）购票请求 （ 5）拒绝\n（2）（10分）数据字典（注： “01”..“20” 表示数字范围从 01到20；乘车日期应给出年月日，\n例如 2021/6/1；假设每个车厢有 100个座位）\n购票请求 =F\n乘车日期 =G\n到站 =4{字母 }20\n字母 =[“A”..“Z“a”..“z”]\n车次 =“001”..“999”\n拒绝 =[无车次 |无票 ]\n无车次 =“no train”\n无票 =“no ticket”\n接受 =“to sale”\n已收款 =“yes”\n车次表 ={起站 +止站 +车次 }\n起站 =止站 =到站\n售票记录 ={乘车日期 +起站 +止站 +车次 +座号 }\n座号 =车厢号 +座位号\n车厢号 =“01”..“20”\n座位号 =H\n（1）A：购票请求 B：接受 C：拒绝 D：车次表 E\n：售票记录\n（2）F：{乘车日期 +到站 +车次 }\nG：“2021”..“2031”+“/”+“01 ”..“12”+“/”+“01”..“31”\nH：“001”..“100”", "answer": "", "exam": true}, {"id": 136, "type": "应用题", "question": "3.某银行要开发一个 “在线转账 ”系统，允许用户在账户间进行资金转账。请运用软件工程中\n的面向对象建模方法来说明如何通过三种模型来描述这个系统？答：对象模型：定义系统中的静态结构，包括类（如用户、账户、交易记录）及其属性（账户余额、账号），关系（关联、聚合）。\n动态模型：描述系统随时间变化的行为，通过状态图（如账户状态：正常、冻结），顺序图\n（展示转账过程中对象间的交互顺序）表示。功能模型：说明系统的数据转换过程，使用数据流图描述数据（转账请求、金额）的流动，处理步骤（验证、扣款、存款、记录流水）。4.你所在的信息系统开发公司指定你为项目负责人，你的任务是开发一个应用系统，该系统\n类似于你的小组以前做过的那些系统，不过这一个系统规模更大且更复杂，需求已经由客户写成了完整的文档， 你将选用哪种小组结构？为什么？你准备采用哪种软件过程模型？为什\n么？答：采用主程序员组的项目组结构。由于我的项目小组已经开发过类似的系统，开发人员已\n经具备了一定的经验，这个时候开发过程遇到的难题不会很多，所以应减少通信开销，充分发挥技术骨干的作用。采用 “已定义级 ”的软件过程模型。因为客户已经写出了完整的需求文\n档，而且项目小组已经有过类似的开发经验。这种过程模型是基于在软件机构中对已定义的过程模型的活动、人员和职责都有共同的理解。", "answer": "", "exam": true}, {"id": 137, "type": "应用题", "question": "5.设有一个学生成绩管理系统，要求用户输入课程成绩。假设成绩限定在 0~100分之间的整\n数，并规定成绩由 1~3位数字字符组成。根据以下等价类划分法设计测试用例，测试程序的\n“成绩输入检查功能 ”。\n输入条件 有效等价类 等价类编号 无效等价类 等价类编号\n成绩的类型及长度 1~3位数字字符 1非数字字符 3\n输入为空 4\n成绩数字范围 0≤成绩≤100 2成绩 <0 5\n成绩 >100 6\n序号 测试数据 覆盖等价类 结果", "answer": "", "exam": true}, {"id": 138, "type": "应用题", "question": "18 5 1 、2 有效", "answer": "", "exam": true}, {"id": 139, "type": "应用题", "question": "29 0 A 3 无效", "answer": "", "exam": true}, {"id": 140, "type": "应用题", "question": "3 （空输入） /NULL 4 无效\n4- 2 5 无效", "answer": "", "exam": true}, {"id": 141, "type": "应用题", "question": "51 0 5 6 无效", "answer": "", "exam": true}], "软件测试技术": [{"id": 1, "type": "选择题", "question": "下列选项中，关于软件测试的分类描述错误的是（C）A、文档测试主要验证文档说明与实际软件之间是否存在差异B、随机测试是没有测试用例的测试C、自动化测试不需要人工参与D、回归测试是指对修改后的程序重新进行测试", "answer": "C", "exam": true}, {"id": 2, "type": "选择题", "question": "下列选项中，关于等价类划分法的描述错误的是（B）A、正确的划分等价类可以减少测试用例的数量B、划分等价类时不需要考虑无效等价类C、同一个等价类中的数据发现缺陷的能力相同D、无效等价类是不符合程序要求的输入数据", "answer": "B", "exam": true}, {"id": 3, "type": "选择题", "question": "下列选项中，关于接口测试的描述错误的是（B）A、接口测试需要关注软件系统中被测接口之间数据的传递B、接口测试不需要关注接口之间是否存在逻辑依赖关系C、通过代码或工具都可以实现接口测试D、接口测试中的接口文档通常由开发人员编写", "answer": "B", "exam": true}, {"id": 4, "type": "选择题", "question": "下列选项中，关于UI测试的描述正确的是（C）A、App界面结构应具备多种风格B、App界面的字体、图片应采用多种颜色搭配C、App的导航设计应符合用户习惯D、App界面的文字长度需要限制", "answer": "C", "exam": true}, {"id": 5, "type": "选择题", "question": "下列选项中，关于请求方法的描述错误的是（C）A、GET方法用于请求服务器获取指定的资源B、DELETE方法用于请求服务器删除指定的资源C、PUT方法用于请求服务器提交指定的资源D、POST方法用于请求服务器提交指定的资源", "answer": "C", "exam": true}, {"id": 6, "type": "选择题", "question": "下列选项中，需要制定系统测试计划的阶段是（D）A、编码阶段B、测试阶段C、概要设计阶段D、需求分析阶段", "answer": "D", "exam": true}, {"id": 7, "type": "选择题", "question": "下列选项中，关于“纸杯测试”的描述错误的是（D）A、查看纸杯说明书是否完整属于纸杯的需求测试B、用纸杯装水、饮料等并观察是否漏水属于纸杯的兼容性测试C、将纸杯揉捏变形观察能否恢复属于纸杯的可维护性测试D、用纸杯装水并观察是否漏水属于纸杯的易用性测试", "answer": "D", "exam": true}, {"id": 8, "type": "选择题", "question": "下列选项中，使用哪个方法设计的测试用例发现程序错误的能力最强（B）A、等价类划分法B、边界值分析法C、因果图法D、场景法", "answer": "B", "exam": true}, {"id": 9, "type": "选择题", "question": "下列选项中，属于软件开发与软件测试并发进行的软件测试模型是（A）A、W模型B、V模型C、H模型D、X模型", "answer": "A", "exam": true}, {"id": 10, "type": "选择题", "question": "下列选项中，导致软件缺陷的最大原因是（A）A、软件需求说明书B、设计方案C、编码D、维护", "answer": "A", "exam": true}, {"id": 11, "type": "选择题", "question": "下列选项中，属于测试准出标准的是（C）A、开发编码结束B、项目代码符合编码规范且通过评审C、测试覆盖率达到要求D、测试项目基本通过冒烟测试", "answer": "C", "exam": true}, {"id": 12, "type": "选择题", "question": "下列选项中，关于App测试的描述错误的是（B）A、在移动设备上使用App时可以通过电容笔输入B、App只能在iOS和Android平台上使用C、App测试的过程应进行版本测试D、App的测试方法与PC端软件测试的方法基本相同", "answer": "B", "exam": true}, {"id": 13, "type": "选择题", "question": "下列选项中，关于软件测试的目的说法正确的是（D）A、避免软件开发中出现的错误B、证明软件中没有错误C、修改软件中出现的错误D、尽可能发现并排除软件中潜藏的错误，提高软件的可靠性", "answer": "D", "exam": true}, {"id": 14, "type": "选择题", "question": "下列选项中，关于场景法的描述正确的是（A）A、场景法通常用于测试多个功能之间的组合使用情况B、场景法不能模拟用户错误的操作流程C、场景法只能用于集成测试阶段D、场景法可以用于系统测试阶段但不能用于验收测试阶段", "answer": "A", "exam": true}, {"id": 15, "type": "选择题", "question": "下列选项中，关于软件测试的流程描述错误的是（D）A、测试计划的制定随着项目发展不断调整B、执行测试是测试人员最主要的活动阶段C、测试报告需要对缺陷进行统计与分析D、设计的测试用例数量越多，测试覆盖率越大", "answer": "D", "exam": true}, {"id": 16, "type": "选择题", "question": "下列选项中，单元测试产生的阶段是（A）A、详细设计阶段B、概要设计阶段C、需求分析阶段D、编码阶", "answer": "A", "exam": true}, {"id": 17, "type": "选择题", "question": "下列选项中，关于统一资源定位符的描述正确的是（A）A、HTTP协议的默认端口是80B、HTTP协议的默认端口是443C、HTTPS协议的默认端口是80D、HTTPS协议的默认端口是21", "answer": "A", "exam": true}, {"id": 18, "type": "选择题", "question": "下列选项中，不属于逻辑覆盖法的是（B）A、条件覆盖B、判定-语句覆盖C、判定覆盖D、判定-条件覆盖", "answer": "B", "exam": true}, {"id": 19, "type": "选择题", "question": "下列选项中，关于基本路径法的描述错误的是（B）A、控制流图中的圆圈表示节点B、程序的圈复杂度数量等于控制流图中的节点数量C、控制流图中的边和节点限定的范围称为区域D、根据圈复杂度的路径数量可以设计测试用例", "answer": "B", "exam": true}, {"id": 20, "type": "选择题", "question": "下列选项中，发现错误能力最弱的是（D）A、判定覆盖B、条件覆盖C、判定-条件覆盖D、语句覆盖", "answer": "D", "exam": true}, {"id": 21, "type": "选择题", "question": "下列选项中，关于性能测试指标的描述正确的是（B）A、错误率是软件系统的功能BugB、吞吐量越大系统单位时间内处理的数据就越多C、并发用户数量越多越好D、吞吐量越大系统单位时间内处理的数据就越少", "answer": "B", "exam": true}, {"id": 22, "type": "选择题", "question": "下列选项中，可以查看JMeter测试结果的是（C）A、取样器B、前置处理器C、监听器D、后置处理器", "answer": "C", "exam": true}, {"id": 23, "type": "选择题", "question": "下列选项中，关于自动化测试优缺点的描述正确的是（B）A、能够完全代替人工测试B、可以提高测试精确度C、发现的缺陷数量比人工测试多D、可以提高测试的有效性", "answer": "B", "exam": true}, {"id": 24, "type": "选择题", "question": "下列选项中，用于执行测试用例或测试套件并返回测试结果的是（B）A、TextTestResultB、TextTestRunnerC、TestCaseD、TestSuite", "answer": "B", "exam": true}, {"id": 25, "type": "选择题", "question": "下列选项中，关于逻辑覆盖的说法错误的是（A）A、所有满足条件组合覆盖标准的测试用例集，也满足路径覆盖的覆盖标准B、条件覆盖能够查出条件中包含的错误，但有时达不到判定覆盖的覆盖率要求C、路径覆盖的查错能力很强，但有时达不到条件组合覆盖的覆盖率要求D、判定覆盖包含了语句覆盖，但它不能保证每个错误条件都能检查得出来", "answer": "A", "exam": true}, {"id": 26, "type": "选择题", "question": "下列选项中，关于HTTP响应的描述正确的是（B）A、响应头位于HTTP响应的第1行B、数字4开头的状态码通常表示客户端错误C、响应体位于状态行的下方D、状态码400表示服务器发生错误", "answer": "B", "exam": true}, {"id": 27, "type": "选择题", "question": "下列选项中，关于判定-条件覆盖的描述错误的是（B）A、无法保证使各种条件都能取到所有可能的值B、充分考虑了判定语句与条件判断的组合情况C、所有判定语句的可能结果至少出现一次D、使得判定语句中所有条件的可能取值至少出现一次", "answer": "B", "exam": true}, {"id": 28, "type": "选择题", "question": "下列选项中，关于性能测试的说法错误的是（C）A、性能测试可以提高软件系统的稳定性B、性能测试可以发现软件系统的性能瓶颈C、性能测试不会引发安全问题D、如果没有开展性能测试除了声誉受损外还会导致金钱损失", "answer": "C", "exam": true}, {"id": 29, "type": "选择题", "question": "下列选项中，在设计测试用例时最常用的逻辑覆盖是（C）A、条件覆盖B、判定覆盖C、条件组合覆盖D、路径覆盖填空题根据测试经验或直觉推测程序中可能存在的错误称为【错误推测法】。常见的传输协议有HTTP、HTTPS、【FTP】等。软件从从“出生”到“消亡”的过程称为【软件生命周期】。按照缺陷的优先级可以将缺陷划分为立即解决缺陷、【高优先级缺陷】、正常排队缺陷和低优先级缺陷。场景法也叫【流程图法】。常用的缺陷管理工具有Bugzilla、【禅道】、Jira。在软件测试模型中，【W模型】是在软件开发与软件测试并发进行的。HTTP请求主要由【请求行】、请求头和请求体组成。通过确定边界的上点、【离点】和内点来设计测试用例。根据用户操作流程的正确性将场景法分为【基本流】和备选流。介于黑盒测试与白盒测试之间的一种软件测试方法是【灰盒测试】。需求给定范围内的点是指【内点】。使用Python语言编写接口测试代码通常需要结合【Request】框架。按照缺陷的严重程度可以将缺陷划分为严重缺陷、一般缺陷、次要缺陷、【建议缺陷】。断言的目的是验证软件开发的【预期结果】与实际结果是否一致。对程序的逻辑结构、路径与运行过程进行的测试称为【白盒测试】。等价类划分法可以将输入数据划分为【有效等价类】和无效等价类。统一资源定位符也称为【URL】。接口是指系统或【组件】之间进行信息交互的通道。性能测试从软件的【响应速度】稳定性、兼容性、可移植性等方面检测软件是否满足用户需求。单位时间内系统能够完成的工作量是指【吞吐量】。使用白盒测试方法时，确定测试数据应根据【程序内部逻辑】和指定的覆盖标准。设计测试用例的原则是尽量以最少的测试用例达到最大的【覆盖率】。程序的圈复杂度等于控制流图中【判定节点的数量】加1。执行语句不包括头文件、【注释】、空行等。语句覆盖的目的是测试程序中的代码是否被执行，它只测试代码中的【执行语句】。系统对用户请求作出响应所需要的时间是指【响应时间】。测试用例的名称必须以【test】开头。瞬间将系统压力加载到最大，测试软件系统在极限压力下的运行情况称为【峰值测试】。自动化测试的金字塔策略包括单元测试、接口测试和【UI测试】。在cmd命令窗口中通过【pip install selenium】命令安装Selenium。简答题和答案请简述软件测试的原则。软件测试的原则主要有以下6点：（1）测试应基于客户需求；（2）测试要尽早进行；（3）不能做到穷尽测试；（4）遵循GoodEnough原则；（5）测试缺陷要符合“二八”定理；（6）避免缺陷免疫。请简述软件测试的流程。（1）分析测试需求，测试人员在制定测试计划之前需要先对软件需求进行分析，以便对要开发的软件产品有一个清晰的认识，从而明确测试对象及测试工作的范围和测试重点；（2）制定测试计划，测试工作贯穿于整个软件开发生命周期，是一项庞大而复杂的工作，需要制定一个完整且详细的测试计划作为指导；（3）设计测试用例，测试用例是一套详细的测试方案，包括测试环境、测试步骤、测试数据和预期结果；（4）执行测试，执行测试是按照测试用例执行测试的过程，这是测试人员最主要的活动阶段；（5）编写测试报告，测试报告是对一个测试活动的总结，对项目测试过程进行归纳，对测试数据进行统计，对项目的测试质量进行客观评价。请简述软件质量模型包含的6大特性及其含义。功能性：软件实现指定功能的能力，包含功能完备性、准确性、互操作性、安全性等。性能效率：软件在规定条件下，资源使用、响应时间、吞吐能力等表现。兼容性：软件与其他产品、不同软硬件环境协同运行的能力。易用性：用户学习、操作、理解软件的难易程度。可靠性：软件在规定时间、条件下正常运行、不出故障的能力。维护性：软件被分析、修改、修复、升级的难易程度。请简述接口测试流程包括哪些？需求分析：梳理接口文档、业务逻辑、入参、出参及约束规则。测试计划：明确测试范围、环境、资源、进度与风险。用例设计：依据接口参数、边界值、异常场景编写测试用例。环境准备：搭建测试环境，配置接口地址、账号、依赖服务。执行测试：使用工具 / 代码发送请求，校验返回结果、状态码与数据。缺陷管理：发现问题提交缺陷，跟踪修复并回归验证。测试总结：整理测试数据、报告，评估接口质量。请简述压力测试与负载测试的区别。（1）压力测试：在极端或超过正常负载条件下运行系统，目的是发现系统的失效点或崩溃阈值，观察系统在超负荷下的表现（如是否会崩溃、是否可恢复）。（2）负载测试：在预期或接近预期的正常负载条件下运行系统，目的是验证系统在预期用户数、请求量下的性能指标（如响应时间、吞吐量、资源占用率）是否满足要求。（3）主要区别：压力测试强调“极限”与“破坏”，找系统的上限与稳定性；负载测试强调“预期”与“验证”，确认系统能否正常承载设计目标。压力测试关注系统何时会失败，负载测试关注系统在正常使用时是否合格。请简述使用基本路径法设计测试用例的步骤。画出程序控制流图。计算控制流图的环路复杂度。确定独立路径（数量等于环路复杂度）。根据每条独立路径，设计对应的测试用例。请简述性能测试的种类。（1）负载测试：模拟预期用户负载，验证系统性能是否达标。（2）压力测试：超出正常负载，测试系统极限与崩溃恢复能力。（3）并发测试：模拟多个用户同时执行同一操作，检测并发冲突与资源竞争。（4）稳定性测试（疲劳强度测试）：长时间运行，检测系统内存泄漏、资源释放等问题。（5）容量测试：测试系统在大数据量下的处理能力，如数据库极限、缓存极限。（6）峰值测试：瞬间将系统压力加载到最大，观察系统应对突发高峰的能力。请简述性能测试的常用指标。响应时间：从发起请求到收到完整响应的总耗时，直观体现交互快慢。并发数：同一时间同时向系统发起请求的用户 / 请求数量。吞吐量：单位时间内系统处理的请求数、数据量，反映整体处理能力。TPS/QPS：TPS 为每秒事务数，QPS 为每秒查询数，衡量业务处理效率。错误率：失败请求数占总请求数的比例，体现运行稳定性。资源使用率：服务器 CPU、内存、磁盘 IO、网络带宽等硬件资源占用情况。自动化测试能否替代人工测试（1）自动化测试无法完全替代人工测试。（2）自动化测试适合回归测试、重复性高、稳定性强的场景（如单元测试、接口测试、每日构建验证）。（3）人工测试在探索性测试、易用性测试、界面美观测试、需求不明确时的适应性测试、复杂场景逻辑判断等方面不可替代。（4）自动化测试只能发现预期内的缺陷，而人工测试可以发现需求理解偏差、异常操作路径等非预期缺陷。（5）实际工作中应两者结合：用自动化完成重复验证，释放人力进行创造性、探索性测试，以提高整体测试效率与质量。设计题和答案题目1：以QQ账号为测试对象，在判断QQ账号的合法性时，需要明确2个条件：第1个条件是QQ账号的长度为6~10；第2个条件是QQ账号的数据类型为自然数。根据这2个条件可以将QQ账号划分为1个有效等价类和5个无效等价类，具体如下。要求有效等价类有效等价类编号无效等价类无效等价类编号QQ账号为6~10位自然数6~10位自然数1少于6位自然数（包含空值）2多于10位自然数36~10位非自然数4少于6位非自然数（包含空值）5多于10位非自然数6题目2：根据题目1设计测试用例。测试用例编号测试数据覆盖等价类编号预期结果test11472581QQ账号合法test2123452QQ账号不合法test3147258369123QQ账号不合法test41234@&4QQ账号不合法test5空值5QQ账号不合法test6@#&888888886QQ账号不合法题目3：三角形问题是测试中广泛使用的一个经典案例，它要求输入3个正数a、b、c作为三角形的3条边，判断这3个数构成的是一般三角形、等边三角形、等腰三角形，还是无法构成三角形。如果使用等价类划分法设计三角形程序的测试用例，则需要将所有输入数据划分为不同的等价类。要求有效等价类有效等价类编号无效等价类无效等价类编号输入 3 个数输入 3 个数1输入 0 个数2只输入 1 个数3只输入 2 个数4输入超过 3 个数53 个数是否都是正数3 个数都是正数6有 1 个数小于等于 07有 2 个数小于等于 083 个数都小于等于 093 个数是否能构成三角形任意 2 个数之和大于第 3 个数10其中 2 个数之和小于等于第 3 个数113 个数是否能构成等腰三角形其中有 2 个数相等，a=b|a=c|b=c123 个数均不相等133 个数是否能构成等边三角形3 个数相等，a=b=c143 个数不相等15题目4：当年份能够被4但不能被100整除时为闰年，或者年份能够被400整除时为闰年。通过分析流程图画出控制流图，以及描述路径个数，路径分别是哪些？iVBORw0KGgoAAAANSUhEUgAAAwEAAAJxCAIAAACVKCk3AAAABGdBTUEAALGPC/xhBQAAAAlwSFlz\nAAAOxAAADsQBlSsOGwAAeoJJREFUeF7t3XlAFGUfB/CtyMWSzILClLIw0dTUvDA0xcwjj/AIj0TJ\nKyOtzSQ1NTExLCokUjIMSzFNTUzKAwvC+wRNlBATz/BCRTJqybf3NzMPy56w4O5c+/38Uc7z7DXP\nM8eXuR7NfwAAAACuBxkIAAAAXBEyEAAAALgiZCAApysoKMhXKZo1Np      return \"A\"# 上点/内点/离点标注  # 区分测试点# 内点：30、80、95 上点：74、89、100 离点：0、75、90# 测试代码print(get_level(80))print(get_level(74))print(get_level(90))print(get_level(-10))  # 测试代码编程题3：根据成绩判定等级，区分上点、离点、内点并完成测试。规则：0~74 为 C，75~89 为 B，90~100 为 A，超出 0-100 提示输入非法。def get_level(score):    if score < 0 or score > 100: return \"输入非法\"    if score >= 90: return \"A\"    if score >= 75: return \"B\"    return \"C\"for s in [74,75,76,-2,101]:    print(s, get_level(s))编程题4：4. 编写 Selenium 代码，启动谷歌浏览器打开百度首页，在搜索框输入软件测试并执行搜索。from selenium import webdriverfrom selenium.webdriver.common.by import Bydriver = webdriver.Chrome()driver.gt(\"https://www.baidu.com\")# 定位搜索框并输入内容driver.find_element(By.ID, \"kw\").send_keys(\"软件测试\")# 点击搜索按钮driver.find_element(By.ID, \"su\").click()选择题/填空题/简答题 答案单选题2．C3．B4．B5．C6．C7．D8．D9．B10．A11．A12．C13．B14．D15．A16．D17．A18．A19．B20．B21．D22．B23．C24．B25．B26．A27．B28．B29．C30．C填空题31．【错误推测法】32．【FTP】33．【软件生命周期】34．【高优先级缺陷】35．【流程图法】36．【禅道】37．【W模型】38．【请求行】39．【离点】40．【基本流】41．【灰盒测试】42．【内点】43．【Request】44．【建议缺陷】45．【预期结果】46．【白盒测试】47．【有效等价类】48．【URL】49．【组件】50．【响应速度】51．【吞吐量】52．【程序内部逻辑】53．【覆盖率】54．【判定节点的数量】55．【注释】56．【执行语句】57．【响应时间】58．【test】59．【峰值测试】60．【UI测试】61．【pip install selenium】PAGE   \\* MERGEFORMAT2", "answer": "C", "exam": true}]};
const PAGE = 20;
const SUBJECTS = Object.keys(DATA);
const TYPES = ['选择题','填空题','判断题','简答题','计算题','论述题','编程题','应用题','画图题'];

let curSub = SUBJECTS[0];
let curType = 'all';
let filtered = [];
let mode = 'review';
let page = 1;

let examIdx = 0;
let examAnswers = {};
let examRevealed = {};
let examFinished = false;

function init() {
  renderSubTabs();
  renderTypeTabs();
  filterQ('review');
}

function setMode(m) {
  mode = m;
  document.getElementById('modeReview').className = 'mode-tab'+(m==='review'?' active':'');
  document.getElementById('modeExam').className = 'mode-tab'+(m==='exam'?' active':'');
  document.getElementById('headerDesc').textContent = m==='review'
    ? '背题模式 — 浏览全部题目，正确答案已标出'
    : '考试模式 — 逐题作答，提交后判对错（课本引用题不纳入考试）';
  document.getElementById('controlsBar').style.display = m==='review'?'flex':'none';
  if (m==='exam') startExam(); else filterQ('review');
}

function renderSubTabs() {
  const el = document.getElementById('subTabs');
  el.innerHTML = SUBJECTS.map(s =>
    `<div class="sub-tab${s===curSub?' active':''}" onclick="onSub('${s}')">${s}</div>`
  ).join('');
}

function renderTypeTabs() {
  const types = new Set();
  (DATA[curSub]||[]).forEach(q => types.add(q.type));
  const avail = TYPES.filter(t => types.has(t));
  const el = document.getElementById('typeTabs');
  el.innerHTML = '<div class="type-tab'+(curType==='all'?' active':'')+'" onclick="onType(\'all\')">全部</div>' +
    avail.map(t => `<div class="type-tab${t===curType?' active':''}" onclick="onType('${t}')">${t}</div>`).join('');
}

function onSub(s) {
  curSub = s; curType = 'all'; page = 1;
  renderSubTabs(); renderTypeTabs();
  if (mode==='exam') startExam(); else filterQ('review');
}

function onType(t) {
  curType = t; page = 1;
  renderTypeTabs();
  if (mode==='exam') startExam(); else filterQ('review');
}

function onSearch() { if (mode==='review') { page=1; filterQ('review'); } }

function filterQ(origin) {
  const kw = document.getElementById('search').value.trim().toLowerCase();
  let qs = DATA[curSub]||[];
  if (curType !== 'all') qs = qs.filter(q => q.type === curType);
  
  // In exam mode, only show questions tagged for exam
  if (origin === 'exam') {
    qs = qs.filter(q => q.exam !== false);
  }
  
  if (kw) qs = qs.filter(q => q.question.toLowerCase().includes(kw) || q.answer.toLowerCase().includes(kw));
  filtered = qs;
  document.getElementById('stats').textContent = `共 ${filtered.length} 题`;
  if (mode==='review') render();
}

// ===================== REVIEW MODE =====================
function render() {
  const total = filtered.length;
  const tp = Math.ceil(total/PAGE)||1;
  if (page>tp) page=tp;
  const start = (page-1)*PAGE;
  const items = filtered.slice(start, start+PAGE);
  const el = document.getElementById('contentArea');

  if (!items.length) {
    el.innerHTML = '<div class="empty"><h3>暂无题目</h3><p>试试其他科目或题型</p></div>';
    return;
  }

  el.innerHTML = '<div class="q-list">' + items.map((q, i) => {
    const n = start+i+1;
    const ans = escHtml(q.answer);
    let bodyLines = q.question.split('\n');
    let formattedBody = bodyLines.map(l => {
      const tr = l.trim();
      if (/^[A-D][、．\.\)]/.test(tr)) {
        const isCorrect = ans && (tr[0] === ans[0]);
        return `<div class="review-opt${isCorrect?' correct':''}">${escHtml(l)}</div>`;
      }
      return escHtml(l);
    }).join('\n');

    const tagHtml = q.exam === false ? '<span class="review-tag">仅背题</span>' : '';

    return `<div class="q-card">
      <div class="q-hdr"><span class="q-num">${n}</span><span class="q-type">${q.type}</span>${tagHtml}</div>
      <div class="q-body">${formattedBody}</div>
      <div>
        <button class="show-ans" onclick="toggle(this)">显示答案</button>
        <div class="ans-box"><strong>答案：</strong>${ans||'（无答案）'}</div>
      </div>
    </div>`;
  }).join('') + '</div>';

  el.innerHTML += `<div class="pages">
    <button onclick="reviewPrev()" ${page<=1?'disabled':''}>上一页</button>
    <span>第 ${page} 页 / 共 ${tp} 页</span>
    <button onclick="reviewNext()" ${page>=tp?'disabled':''}>下一页</button>
  </div>`;
}

function reviewPrev() { if (page>1) {page--;render();} }
function reviewNext() { var tp=Math.ceil(filtered.length/PAGE); if (page<tp) {page++;render();} }
function toggle(btn) {
  var box = btn.nextElementSibling;
  box.classList.toggle('show');
  btn.textContent = box.classList.contains('show')?'隐藏答案':'显示答案';
}

// ===================== EXAM MODE =====================
function startExam() {
  const kw = document.getElementById('search').value.trim().toLowerCase();
  let qs = DATA[curSub]||[];
  if (curType !== 'all') qs = qs.filter(q => q.type === curType);
  qs = qs.filter(q => q.exam !== false); // Only exam-eligible questions
  if (kw) qs = qs.filter(q => q.question.toLowerCase().includes(kw) || q.answer.toLowerCase().includes(kw));
  filtered = qs;
  examIdx = 0;
  examAnswers = {};
  examRevealed = {};
  examFinished = false;
  document.getElementById('stats').textContent = `共 ${filtered.length} 题`;
  renderExam();
}

function renderExam() {
  const el = document.getElementById('contentArea');
  const total = filtered.length;
  if (total === 0) {
    el.innerHTML = '<div class="empty"><h3>暂无可考试的题目</h3><p>当前筛选下没有可用于考试的题目，试试其他题型</p></div>';
    return;
  }
  if (examFinished) { renderExamResult(); return; }
  if (examIdx >= total) { examFinished = true; renderExamResult(); return; }

  const q = filtered[examIdx];
  const isRevealed = examRevealed[examIdx] || false;
  const userChoice = examAnswers[examIdx] || '';
  const correctAns = q.answer || '';
  const pct = Math.round((examIdx / total) * 100);

  let optHtml = '';
  let feedbackHtml = '';

  if (q.type === '选择题') {
    const opts = extractOptions(q.question);
    optHtml = opts.map(o => {
      let cls = 'exam-opt';
      if (!isRevealed && userChoice === o.key) cls += ' selected';
      if (isRevealed) {
        cls += ' disabled';
        if (o.key === correctAns) cls += ' correct-answer';
        if (userChoice === o.key && userChoice !== correctAns) cls += ' wrong';
        if (userChoice === o.key && userChoice === correctAns) cls += ' correct';
      }
      return `<div class="${cls}" onclick="examSelect('${o.key}')"><strong>${o.key}.</strong> ${escHtml(o.text)}</div>`;
    }).join('');
  } else if (q.type === '判断题') {
    optHtml = ['√','×'].map(v => {
      let cls = 'exam-opt';
      if (!isRevealed && userChoice === v) cls += ' selected';
      if (isRevealed) {
        cls += ' disabled';
        if (v === correctAns) cls += ' correct-answer';
        if (userChoice === v && userChoice !== correctAns) cls += ' wrong';
        if (userChoice === v && userChoice === correctAns) cls += ' correct';
      }
      return `<div class="${cls}" onclick="examSelect('${v}')">${v}</div>`;
    }).join('');
  } else {
    if (!isRevealed) optHtml = '<div style="padding:12px 0;color:#999">请思考后提交查看答案</div>';
  }

  if (isRevealed) {
    const isCorrect = userChoice === correctAns;
    const fbClass = isCorrect ? 'correct' : 'wrong';
    const fbText = isCorrect
      ? '回答正确！'
      : (userChoice ? `回答错误。正确答案：${correctAns}` : `正确答案：${correctAns}`);
    feedbackHtml = `<div class="exam-feedback ${fbClass}">${fbText}</div>`;
  }

  const bodyHtml = formatExamQ(q.question);
  let navHtml = '';
  if (isRevealed) {
    if (examIdx < total-1) navHtml = '<button class="btn-next" onclick="examNext()">下一题 →</button>';
    else navHtml = '<button class="btn-finish" onclick="examFinish()">查看结果</button>';
  } else {
    navHtml = `<button class="btn-next" onclick="examReveal()" ${!userChoice?'disabled':''}>提交答案</button>`;
  }

  el.innerHTML = `<div class="exam-container">
    <div class="exam-progress"><span>第 ${examIdx+1} 题 / 共 ${total} 题</span><span>${q.type}</span></div>
    <div class="exam-bar"><div class="exam-bar-inner" style="width:${pct}%"></div></div>
    <div class="exam-card">
      <div class="exam-q-header"><span class="q-num" style="width:30px;height:30px;font-size:13px">${examIdx+1}</span><span class="q-type">${q.type}</span></div>
      <div class="exam-q-body">${bodyHtml}</div>
      <div class="exam-options">${optHtml}</div>
      ${feedbackHtml}
      <div class="exam-nav">
        <button class="btn-prev" onclick="examPrev()" ${examIdx===0?'disabled':''}>← 上一题</button>
        ${navHtml}
      </div>
    </div>
  </div>`;
}

function examSelect(key) { if (examRevealed[examIdx]) return; examAnswers[examIdx] = key; renderExam(); }
function examReveal() { if (!examAnswers[examIdx]) return; examRevealed[examIdx] = true; renderExam(); }
function examNext() { if (examIdx < filtered.length-1) { examIdx++; renderExam(); } }
function examPrev() { if (examIdx > 0) { examIdx--; renderExam(); } }
function examFinish() { examFinished = true; renderExam(); }

function renderExamResult() {
  const total = filtered.length;
  let correct = 0, wrong = 0, unanswered = 0;
  filtered.forEach((q, i) => {
    const ua = examAnswers[i]||'', ca = q.answer||'';
    if (!ua) unanswered++;
    else if (ua===ca) correct++;
    else wrong++;
  });
  const pct = total>0 ? Math.round(correct/total*100) : 0;
  const grade = pct>=90?'优秀': pct>=80?'良好': pct>=60?'及格':'不及格';
  const el = document.getElementById('contentArea');
  el.innerHTML = `<div class="exam-result">
    <h2>考试结果</h2>
    <div class="score">${correct}/${total}</div>
    <div class="detail">正确 ${correct} 题 · 错误 ${wrong} 题 · 未作答 ${unanswered} 题<br>正确率 ${pct}% · ${grade}</div>
    <div class="exam-btn-group">
      <button style="padding:12px 32px;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer" onclick="setMode('review')">切换到背题模式查看</button>
      <button style="padding:12px 32px;border:1px solid #d9d9d9;border-radius:8px;background:#fff;cursor:pointer" onclick="startExam()">重新考试</button>
    </div>
  </div>`;
}

function extractOptions(text) {
  const result = [];
  for (const l of text.split('\n')) {
    const m = l.trim().match(/^([A-D])[、．\.\)]\s*(.+)/);
    if (m) result.push({key:m[1],text:m[2]});
  }
  return result;
}

function formatExamQ(text) {
  return text.split('\n').map(l => { if (/^[A-D][、．\.\)]/.test(l.trim())) return ''; return escHtml(l); }).filter(l=>l).join('\n');
}

function escHtml(s) { var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
init();
</script>
