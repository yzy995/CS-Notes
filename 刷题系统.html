对应第三个参数\na+b=30。尽管占位符顺序与参数顺序不同，但位置索引会准确定位参数，因此{2}的值为30。", "answer": "", "exam": true}, {"id": 1651, "type": "填空题", "question": "1469、在Python中，若字符串包含单引号，则只能使用双引号定义该字符串。\n解析：Python中定义包含单引号的字符串有三种方式：使用双引号、使用三引号（'''或\"\"\"）、对单\n引号转义（如'let\\'s go'）。题目中“只能使用双引号”的表述错误，遗漏了后两种合法方式。", "answer": "错误", "exam": true}, {"id": 1652, "type": "填空题", "question": "1470、使用%格式化字符串时，若字符串中有多个格式符，真实数据需放入元组中且数量与格式符一\n致。\n解析：当使用%对包含多个格式符的字符串进行格式化时，必须将所有真实数据按顺序放入元组，且\n数据数量、位置需与格式符一一对应，否则会引发错误。题目表述符合该规则。", "answer": "正确", "exam": true}, {"id": 1653, "type": "填空题", "question": "1471、使用format()方法格式化字符串时，{}中的占位符数量必须与传入的参数数量完全一致，否则\n会报错。\n解析：format()方法要求占位符{}的数量与参数数量严格匹配，若数量不一致会抛出IndexError或\nTypeError。例如'{} {}'需要传入2个参数，少传或多传都会报错。因此题目说法正确。", "answer": "正确", "exam": true}, {"id": 1654, "type": "填空题", "question": "1472、在Python中，只能使用+运算符进行字符串拼接，无法使用join()方法。\n解析：Python中字符串拼接有两种常用方式：一是使用+运算符，如'a'+'b'；二是使用join()方法，\n如''.join(['a','b'])。join()方法更适合多个字符串的拼接。因此题目说法错误。", "answer": "错误", "exam": true}, {"id": 1655, "type": "填空题", "question": "1473、在Python中，若要定义包含单引号的字符串'let's learn Python'，只能通过将单引号替换为\n双引号或三引号来实现，无法使用反斜线转义。\n解析：Python中定义包含单引号的字符串时，除了使用双引号或三引号，还可以通过反斜线\\对单引\n号进行转义，例如print('let\\'s learn Python')可以正确输出let's learn Python。因此该说法错\n误。", "answer": "错误", "exam": true}, {"id": 1656, "type": "填空题", "question": "1474、在Python中，原始字符串的前缀r或R只能用于处理包含反斜线的字符串，对其他转义字符无\n效。\n解析：原始字符串中任何字符都保持字面含义，不仅限于反斜线。例如r'\\n'会输出\\n而非换行符，\nr'\\t'会输出\\t而非制表符。因此该说法错误。", "answer": "错误", "exam": true}, {"id": 1657, "type": "填空题", "question": "1475、Python中的字符串是不可变序列，因此无法通过索引直接修改字符串中的单个字符，例如\ns='abc'，执行s[0]='A'会引发错误。\n解析：字符串的不可变性意味着其内容创建后无法直接修改。若尝试通过索引赋值（如s[0]='A'），\nPython会抛出TypeError。若需修改字符串，需通过拼接、替换等方式生成新字符串。题目描述符合\n字符串不可变性的特性。", "answer": "正确", "exam": true}, {"id": 1658, "type": "填空题", "question": "1476、执行代码print(\"{1} {0}\".format('a', 'b'))时，输出结果为\"a b\"，因为format()方法默认\n按参数顺序填充占位符。\n解析：format()方法支持位置参数索引，{1}对应第二个参数'b'，{0}对应第一个参数'a'，正确输出\n应为\"b a\"。", "answer": "错误", "exam": true}, {"id": 1659, "type": "填空题", "question": "1477、对于字符串s = \"apple,banana,orange\"，执行s.split(',', 1)的结果为['apple', 'banana,\norange']，因为split()方法的第二个参数指定了最大分割次数。\n解析：split(sep, maxsplit)中maxsplit=1表示最多分割1次，因此字符串被分割为两部分，结果正\n确。", "answer": "正确", "exam": true}, {"id": 1660, "type": "填空题", "question": "1478、执行代码s = \"hello world\"; s.replace('l', 'x', 2)后，s的值变为\"hexxo world\"，因为\nreplace()方法会修改原字符串。\n解析：Python字符串是不可变对象，replace()方法返回新字符串，原字符串s的值保持不变，仍为\"\nhello world\"。", "answer": "错误", "exam": true}, {"id": 1661, "type": "填空题", "question": "1479、Python中定义字符串有哪几种常见方式？请分别举例说明。\nPython中定义字符串的常见方式有： 1. 单引号定义：如 'hello' 2. 双引号定义：如 \"hello\" 3.\n三单引号定义：如 '''hello world''' 4. 三双引号定义：如 \"\"\"hello world\"\"\"\n解析：评分点1（2分）：答对单引号定义并举例； 评分点2（2分）：答对双引号定义并举例； 评分\n点3（3分）：答对三单引号定义并举例； 评分点4（3分）：答对三双引号定义并举例； 总分为10\n分，每个评分点需准确回答定义方式及对应示例方可得分。", "answer": "", "exam": true}, {"id": 1662, "type": "填空题", "question": "1480、Python中格式化字符串的方式有哪些？请分别写出对应的语法格式。\nPython中格式化字符串的方式有： 1. %格式化：语法格式为 format % values 2. format()方法：\n语法格式为 str.format(values) 3. f-string：语法格式为 f'string {variable}'\n解析：评分点1（3分）：答对%格式化并写出语法格式； 评分点2（3分）：答对format()方法并写出\n语法格式； 评分点3（4分）：答对f-string并写出语法格式； 总分为10分，每个评分点需准确回答\n方式及语法格式方可得分。", "answer": "", "exam": true}, {"id": 1663, "type": "填空题", "question": "1481、现有字符串s = \"apple,banana,orange\", 请写出Python代码实现以下功能：1. 将字符串按逗\n号分割成列表；2. 将分割后的列表用\"-\"拼接成新的字符串。并解释split()和join()方法的参数及\n返回值。\n代码：s = \"apple,banana,orange\"; lst = s.split(','); new_s = '-'.join(lst)。split()方法\n参数：分隔符（默认是任意空白字符），返回值是分割后的字符串列表；join()方法参数：可迭代对\n象（如列表），返回值是拼接后的字符串。\n解析：评分点1：正确使用split()方法分割字符串（2分）；评分点2：正确使用join()方法拼接列表\n（2分）；评分点3：split()方法参数解释正确（2分）；评分点4：join()方法参数解释正确（2\n分）；评分点5：返回值解释正确（2分）。总分为10分，每个评分点2分，未完成对应要求则扣除相\n应分数。", "answer": "", "exam": true}, {"id": 1664, "type": "编程题", "question": "1482、给定字符串\" Hello, World! \",要求：1）查找子串\"World\"的起始索引；2）将所有\"l\"替换\n为\"L\"；3）删除字符串两端的空格。请编写Python代码实现，并解释各方法的参数和返回值特点。\n实现代码如下： s = \" Hello, World! \" # 1. 查找子串索引 index = s.find(\"World\") print\n(\"World的起始索引：\", index) # 2. 替换子串 new_s = s.replace(\"l\", \"L\") print(\"替换后的字\n符串：\", new_s) # 3. 删除两端空格 stripped_s = s.strip() print(\"删除空格后的字符串：\",\nstripped_s) 关键原理： 1. find()方法：返回子串首次出现的索引，未找到返回-1，区分大小\n写； 2. replace()方法：接受三个参数，第一个是被替换子串，第二个是替换子串，第三个是替换\n次数（可选，默认全部替换）； 3. strip()方法：删除字符串两端的空白字符（空格、\\n、\\t\n等），lstrip()删除左端，rstrip()删除右端。\n解析：评分点（共10分）： 1. 查找子串索引（2分）：正确使用find()方法，返回正确索引值；", "answer": "", "exam": true}, {"id": 1665, "type": "填空题", "question": "2. 替换子串（3分）：正确使用replace()方法，替换逻辑正确，区分大小写； 3. 删除两端空格（3\n分）：正确使用strip()方法，删除两端空格； 4. 方法参数理解（2分）：正确解释find()、\nreplace()、strip()方法的参数和返回值特点。", "answer": "", "exam": true}, {"id": 1666, "type": "填空题", "question": "1483、已知字符串 `msg = \" HeLLo PythOn! \"`\n要求：", "answer": "", "exam": true}, {"id": 1669, "type": "填空题", "question": "3. 使用f-string格式化输出：处理后的字符串内容：【xxx】。\nmsg = \" HeLLo PythOn! \"\ns1 = msg.strip()\ns2 = s1.lower()\nres = f'处理后的字符串内容：【{s2}】'\nprint(res)\n解析：", "answer": "", "exam": true}, {"id": 1670, "type": "填空题", "question": "1. 正确使用strip()去除首尾空格（3分）", "answer": "", "exam": true}, {"id": 1671, "type": "填空题", "question": "2. 正确调用lower()全小写（3分）", "answer": "", "exam": true}, {"id": 1672, "type": "填空题", "question": "3. f-string格式书写正确、输出格式符合要求（4分）", "answer": "", "exam": true}, {"id": 1673, "type": "填空题", "question": "1484、字符串`msg = \"I love apple,apple\"`，使用replace把所有apple替换成pear，打印原字符串\n和替换后字符串。\nmsg = \"I love apple,apple\"\nnew_msg = msg.replace(\"apple\", \"pear\")\nprint(\"原文本：\", msg)\nprint(\"替换后：\", new_msg)\n解析：", "answer": "", "exam": true}, {"id": 1675, "type": "填空题", "question": "2. replace参数正确，全量替换（5分）", "answer": "", "exam": true}, {"id": 1677, "type": "填空题", "question": "1485、给定height=175.236，name=\"李明\"，分别使用%、format、f-string三种格式输出：姓名：李\n明，身高：175.24（保留2位小数）。\nname = \"李明\"\nheight = 175.236\n#%格式\ns1 = \"姓名：%s，身高：%.2f\" % (name, height)\n#format\ns2 = \"姓名：{}，身高：{:.2f}\".format(name, height)\n#f-string\ns3 = f\"姓名：{name}，身高：{height:.2f}\"\nprint(s1,s2,s3)\n解析：", "answer": "", "exam": true}, {"id": 1678, "type": "填空题", "question": "1. %格式、%.2f正确（3分）", "answer": "", "exam": true}, {"id": 1679, "type": "填空题", "question": "2. format+{:.2f}正确（3分）", "answer": "", "exam": true}, {"id": 1680, "type": "填空题", "question": "3. f-string+:.2f写法正确（4分）", "answer": "", "exam": true}, {"id": 1681, "type": "填空题", "question": "1486、编写文本过滤小程序：原文本：`这款产品是全网最优秀的配置，用料扎实，最优秀的工艺做\n工`，要求：", "answer": "", "exam": true}, {"id": 1682, "type": "填空题", "question": "1.先用find判断是否包含“最优秀”；", "answer": "", "exam": true}, {"id": 1683, "type": "填空题", "question": "2.如果存在，全部replace替换为“优质”；不存在则原样输出；", "answer": "", "exam": true}, {"id": 1684, "type": "填空题", "question": "3.结果字符串居中，总长度40，填充符号`=`；\ntext = \"这款产品是全网最优秀的配置，用料扎实，最优秀的工艺做工\"\nif text.find(\"最优秀\") != -1:\nnew_text = text.replace(\"最优秀\",\"优质\")\nelse:\nnew_text = text\nfinal = new.center(40,\"=\")\nprint(final)\n解析：", "answer": "", "exam": true}, {"id": 1685, "type": "填空题", "question": "1.find判断是否存在（3分）", "answer": "", "exam": true}, {"id": 1687, "type": "填空题", "question": "3.replace替换（3分）", "answer": "", "exam": true}, {"id": 1688, "type": "填空题", "question": "4.center居中处理（2分）", "answer": "", "exam": true}, {"id": 1689, "type": "选择题", "question": "1487、以下哪种方式不能创建Python列表？\nA、[1, 2, 3]\nB、list(\"hello\")\nC、{1, 2, 3}\nD、[x for x in range(5)]\n解析：选项C创建的是集合，不是列表。A是直接创建列表，B是通过list()函数将字符串转换为列\n表，D是通过列表推导式创建列表。", "answer": "C", "exam": true}, {"id": 1690, "type": "选择题", "question": "1488、以下关于Python元组的描述，正确的是？\nA、元组中的元素可以被修改\nB、元组使用方括号[]定义\nC、元组是不可变序列\nD、元组不能包含不同类型的元素\n解析：元组是不可变序列，一旦创建后元素不能被修改，使用圆括号()定义，可以包含不同类型的元\n素。", "answer": "C", "exam": true}, {"id": 1691, "type": "选择题", "question": "1489、Python集合中不能包含以下哪种元素？\nA、整数\nB、字符串\nC、列表\nD、元组\n解析：集合中的元素必须是可哈希的，列表是可变的，不可哈希，因此不能作为集合元素。", "answer": "C", "exam": true}, {"id": 1692, "type": "选择题", "question": "1490、要访问字典person = {'name': 'Alice', 'age': 25}中的'age'值，以下哪种方式正确？\nA、person[0]\nB、person['age']\nC、person.get('age', 0)\nD、以上都正确\n解析：字典通过键来访问值，选项B直接使用键'age'访问，正确。选项A使用索引访问适用于序列，\n字典不支持；选项C使用get()方法虽然也能获取值，但题目问的是正确方式，B更直接。", "answer": "B", "exam": true}, {"id": 1693, "type": "选择题", "question": "1491、以下Python代码执行后，输出结果是？\nmy_list = list('hello')\nmy_list[1] = 'E'\nprint(my_list)\nA、['h', 'E', 'l', 'l', 'o']\nB、['H', 'e', 'l', 'l', 'o']\nC、['h', 'e', 'l', 'l', 'o']\nD、['h', 'E', 'l', 'o']\n解析：list('hello')将字符串转换为列表['h','e','l','l','o']，通过索引1修改元素为'E'，最终\n结果为['h','E','l','l','o']。", "answer": "A", "exam": true}, {"id": 1694, "type": "选择题", "question": "1492、关于Python元组，以下说法正确的是？\nA、元组中的元素可以直接修改\nB、元组可以通过append()方法添加元素\nC、元组中的可变元素（如列表）可以修改\nD、元组不能进行切片操作\n解析：元组是不可变序列，无法直接修改元素或使用`append()`等可变方法，但元组中的可变元素\n（如列表）可以修改。元组支持切片操作。", "answer": "C", "exam": true}, {"id": 1695, "type": "选择题", "question": "1493、以下Python代码执行后，输出结果是？\ndict1 = {'name': 'Alice', 'age': 20}\ndict2 = dict(name='Bob', age=25)\ndict1.update(dict2)\nprint(dict1.get('name'))\nA、Alice\nB、Bob\nC、20\nD、25\n解析：update()方法将dict2的键值对更新到dict1中，若键相同则覆盖原有值。dict2中'name'的值\n为'Bob'，因此dict1.get('name')返回'Bob'。", "answer": "B", "exam": true}, {"id": 1696, "type": "选择题", "question": "1494、以下Python代码的输出结果是？\nlst = [1, 2, 3]\nd = {'a': lst, 'b': lst.copy()}\nlst.append(4)\nprint(d['a'], d['b'])\nA、[1,2,3,4] [1,2,3]\nB、[1,2,3] [1,2,3,4]\nC、[1,2,3,4] [1,2,3,4]\nD、[1,2,3] [1,2,3]\n解析：d['a']引用原列表lst，d['b']通过copy()创建新列表，原列表lst添加元素4后，d['a']会同\n步更新，d['b']保持原状态。", "answer": "A", "exam": true}, {"id": 1697, "type": "选择题", "question": "1495、以下Python代码执行后，输出结果为？\nlst = [{'name':'A','score':90}, {'name':'B','score':85}, {'name':'A','score':95}]\nd = {}\nfor item in lst:\nkey = item['name']\nif key not in d:\nd[key] = []\nd[key].append(item['score'])\nres = {k: sum(v) for k, v in d.items()}\nprint(res)\nA、{'A':185, 'B':85}\nB、{'A':90, 'B':85}\nC、{'A':95, 'B':85}\nD、{'A':185}\n解析：代码将列表中相同name的score值合并到字典d的列表中，再通过字典推导式计算每个name对应\n的score总和，'A'的总分为90+95=185，'B'为85。", "answer": "A", "exam": true}, {"id": 1698, "type": "选择题", "question": "1496、以下Python代码执行后，输出结果为？\nset1 = {1, 2, 3, 4}\nset2 = {3, 4, 5, 6}\nresult = set1 & set2\nprint(result)\nA、{3, 4}\nB、{1, 2, 5, 6}\nC、{1, 2, 3, 4, 5, 6}\nD、set()\n解析：本题考查集合的交集运算。Python中使用`&`运算符或`intersection()`方法求两个集合的交\n集,即返回同时属于两个集合的元素组成的新集合。set1和set2的交集元素为3和4,故结果为{3, 4}。", "answer": "A", "exam": true}, {"id": 1699, "type": "填空题", "question": "1497、在Python中，使用方括号[ ]创建的序列结构是______。\n列表\n；\n解析：Python中列表的创建方式之一是使用方括号`[]`，例如`a = [1, 2, 3]`，这是最常见的列表\n创建方法。", "answer": "", "exam": true}, {"id": 1700, "type": "填空题", "question": "1498、元组是Python中的______序列结构，一旦创建后其元素不能被修改。\n不可变\n；\n解析：元组的核心特征是不可变性，即创建后无法修改、添加或删除元素，这是它与列表的主要区别\n之一。", "answer": "", "exam": true}, {"id": 1701, "type": "填空题", "question": "1499、字典是由______组成的无序集合，每个元素包含一个键和一个值。\n键值对\n；\n解析：字典的基本结构是键值对（key-value pairs），例如`{'name': 'Alice', 'age': 20}`，通\n过键可以快速访问对应的值。", "answer": "", "exam": true}, {"id": 1702, "type": "填空题", "question": "1500、使用列表的append()方法可以在列表的______添加一个元素。\n末尾\n；\n解析：`append()`方法用于在列表末尾添加单个元素，例如`a.append(4)`会将4添加到列表`a`的最\n后位置。", "answer": "", "exam": true}, {"id": 1703, "type": "填空题", "question": "1501、元组的元素访问方式与列表类似，使用______来获取指定位置的元素。\n索引\n；\n解析：元组和列表都支持通过索引访问元素，例如`tuple1[0]`表示访问元组`tuple1`的第一个元\n素，索引从0开始。", "answer": "", "exam": true}, {"id": 1704, "type": "填空题", "question": "1502、Python中计算两个集合交集的运算符是______。\n&\n；\n解析：集合的交集运算可以使用`&`运算符，例如`set1 & set2`表示同时存在于`set1`和`set2`中的\n元素组成的集合。", "answer": "", "exam": true}, {"id": 1705, "type": "填空题", "question": "1503、字典中的______必须是唯一的，不允许重复。\n键\n；\n解析：字典的键具有唯一性，如果添加重复的键，新的值会覆盖旧的值，例如`{'a':1, 'a':2}`最终\n字典为`{'a':2}`。", "answer": "", "exam": true}, {"id": 1706, "type": "填空题", "question": "1504、使用列表推导式[x for x in range(5)]创建的列表是______。\n[0, 1, 2, 3, 4]\n；\n解析：列表推导式是一种简洁的创建列表的方式，`range(5)`生成0到4的整数，因此该推导式创建的\n列表为`[0, 1, 2, 3, 4]`。", "answer": "", "exam": true}, {"id": 1707, "type": "填空题", "question": "1505、已知 set1 = {1, 2, 3} ， set2 = {2, 3, 4} ，则 set1 - set2 的结果是______。\n{1}\n；\n解析：集合的差集运算`set1 - set2`表示存在于`set1`但不存在于`set2`的元素，因此结果为`{1}\n`。", "answer": "", "exam": true}, {"id": 1708, "type": "填空题", "question": "1506、字典的 get() 方法在键不存在时会返回______，而不会引发KeyError异常。\nNone\n；\n解析：`get()`方法用于获取指定键的值，若键不存在则返回默认值None（或指定的默认值），例如\n`dict1.get('key')`在'key'不存在时返回None。", "answer": "", "exam": true}, {"id": 1709, "type": "填空题", "question": "1507、在Python中，使用 list() 函数可以将其他可迭代对象（如字符串、元组）转换为列表。\n解析：`list()`函数是Python中创建列表的常用方法之一，它能够接收可迭代对象并将其元素转换为\n列表元素。", "answer": "正确", "exam": true}, {"id": 1710, "type": "填空题", "question": "1508、元组一旦创建后，其元素的值和数量都不可以被修改。\n解析：元组是不可变序列，不支持对元素进行赋值、添加或删除操作，但如果元组中的元素是可变对\n象（如列表），则可变对象内部可以修改。", "answer": "正确", "exam": true}, {"id": 1711, "type": "填空题", "question": "1509、集合中的元素可以重复，且会自动保留重复元素的首次出现值。\n解析：集合的核心特性是元素的唯一性，当添加重复元素时，集合会自动去重，只保留一个实例。", "answer": "错误", "exam": true}, {"id": 1712, "type": "填空题", "question": "1510、字典的键可以是任意数据类型，包括列表和集合。\n解析：字典的键必须是不可变类型（如整数、字符串、元组），列表和集合是可变类型，不能作为字\n典的键。", "answer": "错误", "exam": true}, {"id": 1713, "type": "填空题", "question": "1511、列表的 append() 方法可以一次添加多个元素，而 extend() 方法只能添加一个元素。\n解析：`append()`方法用于在列表末尾添加单个元素（包括可迭代对象作为整体），`extend()`方法\n用于将可迭代对象的元素逐个添加到列表中。", "answer": "错误", "exam": true}, {"id": 1714, "type": "填空题", "question": "1512、创建只包含一个元素的元组时，必须在元素后添加逗号，例如 (5,) 。\n解析：如果省略逗号，`(5)`会被解释为整数5，而不是元组，因此单元素元组的正确写法是`(元素,)\n`。", "answer": "正确", "exam": true}, {"id": 1715, "type": "填空题", "question": "1513、使用 add() 方法可以向集合中添加多个元素，参数为可迭代对象。\n解析：`add()`方法只能添加单个元素，若要添加多个元素需使用`update()`方法，其参数为可迭代\n对象。", "answer": "错误", "exam": true}, {"id": 1716, "type": "填空题", "question": "1514、通过 dict.keys() 方法可以获取字典中所有的值， dict.values() 方法可以获取所有的键。\n解析：`dict.keys()`返回字典中所有键的视图对象，`dict.values()`返回所有值的视图对象，二者\n功能相反。", "answer": "错误", "exam": true}, {"id": 1717, "type": "填空题", "question": "1515、所有序列（列表、元组、字符串）都支持切片操作，且切片结果的类型与原序列类型一致。\n解析：切片是序列的通用操作，对于列表切片返回列表，元组切片返回元组，字符串切片返回字符\n串。", "answer": "正确", "exam": true}, {"id": 1718, "type": "填空题", "question": "1516、字典推导式的语法格式为 {键表达式: 值表达式 for 变量 in 可迭代对象 if 条件} ，可以\n快速生成字典。\n解析：字典推导式是Python中生成字典的高效方式，与列表推导式类似，但使用键值对的形式。", "answer": "正确", "exam": true}, {"id": 1719, "type": "填空题", "question": "1517、请简述Python中列表的三种常见创建方法，并分别举例说明如何对列表进行添加元素、修改元\n素、删除元素的操作。", "answer": "", "exam": true}, {"id": 1720, "type": "填空题", "question": "1. 列表的三种创建方法： （1）直接使用方括号`[]`创建，例如：`list1 = [1, 2, 3]` （2）使用\n`list()`函数将其他可迭代对象转换为列表，例如：`list2 = list((1, 2, 3))`（将元组转换为列\n表） （3）使用列表推导式创建，例如：`list3 = [x for x in range(5)]`（生成包含0到4的列\n表） 2. 列表的操作： （1）添加元素：使用`append()`方法在列表末尾添加单个元素，例如：\n`list1.append(4)`；使用`extend()`方法添加多个元素，例如：`list1.extend([5, 6])` （2）修\n改元素：通过索引直接赋值修改，例如：`list1[0] = 10` （3）删除元素：使用`del`语句通过索引\n删除，例如：`del list1[1]`；使用`remove()`方法通过元素值删除，例如：`list1.remove(3)`；\n使用`pop()`方法删除并返回指定索引的元素，例如：`list1.pop(2)`\n解析：\n评分细则： 1. 正确列举出列表的三种创建方法（4分，每种方法描述各1分，有举例说明1分） 2.\n正确说明添加元素的方法并举例（2分，提及`append()`或`extend()`方法1分，举例1分） 3. 正确\n说明修改元素的方法并举例（2分，索引赋值修改1分，举例1分） 4. 正确说明删除元素的方法并举\n例（2分，方法描述1分，举例1分）\n考察知识点：列表的创建方法；列表的添加、修改、删除操作", "answer": "", "exam": true}, {"id": 1721, "type": "填空题", "question": "1518、请解释元组的不可变特性，并说明如何通过两种方法创建元组，以及举例说明如何对元组进行\n访问。", "answer": "", "exam": true}, {"id": 1722, "type": "填空题", "question": "1. 元组的不可变特性：元组一旦创建，其元素的数量和值不能直接修改（元素为可变对象时，对象\n内部可修改，但元组本身的结构不变） 2. 元组的创建方法： （1）直接使用圆括号`()`创建，例\n如：`tuple1 = (1, 2, 3)` （2）省略圆括号创建，例如：`tuple2 = 1, 2, 3` 3. 元组的访问操\n作：通过索引访问元素，例如：`print(tuple1[0])`（输出1）\n解析：\n评分细则： 1. 正确解释元组的不可变特性（4分，说明结构不可变2分，可变对象内部可修改2分）", "answer": "", "exam": true}, {"id": 1723, "type": "填空题", "question": "2. 正确说明两种创建元组的方法并举例（4分，每种方法2分） 3. 正确说明元组的访问操作并举例\n（2分，索引访问1分，举例1分）\n考察知识点：元组的不可变特性；元组的创建方法；元组的访问操作", "answer": "", "exam": true}, {"id": 1724, "type": "填空题", "question": "1519、请说明集合的无序性和唯一性特性，并列举集合的两种创建方法，以及集合的两种常见运算\n（如交集、并集）并举例说明。", "answer": "", "exam": true}, {"id": 1725, "type": "填空题", "question": "1. 集合的特性： （1）无序性：集合中的元素没有固定顺序，不能通过索引访问 （2）唯一性：集\n合中的元素不能重复，重复元素会被自动去重 2. 集合的创建方法： （1）使用大括号`{}`创建，例\n如：`set1 = {1, 2, 3}` （2）使用`set()`函数创建，例如：`set2 = set([1, 2, 2, 3])`（自动\n去重为{1,2,3}） 3. 集合的运算： （1）交集：使用`&`运算符或`intersection()`方法，例如：\n`set1 & set2`或`set1.intersection(set2)` （2）并集：使用`|`运算符或`union()`方法，例如：\n`set1 | set2`或`set1.union(set2)` （3）差集：使用`-`运算符或`difference()`方法，例如：\n`set1 - set2`或`set1.difference(set2)`\n解析：\n评分细则： 1. 正确解释集合的无序性和唯一性（2分，每种特性1分） 2. 正确说明集合的两种创建\n方法并举例（4分，每种方法2分） 3. 正确说明集合的两种运算并举例（4分，每种运算2分）\n考察知识点：集合的无序性和唯一性；集合的创建方法；集合的运算操作", "answer": "", "exam": true}, {"id": 1726, "type": "填空题", "question": "1520、请解释字典的键值对特性，并说明如何通过两种方法创建字典，以及如何对字典进行访问值、\n添加键值对、修改值、删除键值对的操作。", "answer": "", "exam": true}, {"id": 1727, "type": "填空题", "question": "1. 字典的键值对特性：字典是由`键（key）`和`值（value）`组成的无序集合，键必须唯一且不可\n变（如字符串、数字、元组），值可以是任意数据类型 2. 字典的创建方法： （1）直接使用大括号\n`{}`创建，例如：`dict1 = {'name': 'Alice', 'age': 20}` （2）使用`dict()`函数创建，例如：\n`dict2 = dict(name='Bob', age=25)`或`dict3 = dict([('name', 'Charlie'), ('age', 30)])`", "answer": "", "exam": true}, {"id": 1728, "type": "填空题", "question": "3. 字典的操作： （1）访问值：通过键访问，例如：`print(dict1['name'])`（输出'Alice'）；使\n用`get()`方法，例如：`dict1.get('age')`（输出20） （2）添加键值对：直接赋值不存在的键，\n例如：`dict1['gender'] = 'female'` （3）修改值：通过键重新赋值，例如：`dict1['age'] =\n21` （4）删除键值对：使用`del`语句，例如：`del dict1['gender']`；使用`pop()`方法，例如：\n`dict1.pop('age')`（删除并返回值）\n解析：\n评分细则： 1. 正确解释字典的键值对特性（2分，键的特性1分，值的特性1分） 2. 正确说明字典\n的两种创建方法并举例（4分，每种方法2分） 3. 正确说明字典的访问、添加、修改、删除键值对的\n方法并举例（4分，每个操作各1分））\n考察知识点：字典的键值对特性；字典的创建方法；字典的访问、添加、修改、删除操作", "answer": "", "exam": true}, {"id": 1729, "type": "编程题", "question": "1521、请编写一个Python程序，完成以下任务：\n创建一个包含初始元素['apple', 'banana', 'cherry']的列表；\n向列表末尾添加元素'orange'；\n在索引为1的位置插入元素'grape'；\n删除列表中的元素'banana'；\n输出最终的列表fruits。\n参考代码：\nfruits = ['apple', 'banana', 'cherry']\nfruits.append('orange')\nfruits.insert(1, 'grape')\nfruits.remove('banana')\nprint(fruits)\n解析：评分细则（10分）： 1. 正确创建初始列表fruits（2分）； 2. 正确使用append()方法添加\n元素（2分）； 3. 正确使用insert()方法插入元素（2分）； 4. 正确使用remove()方法删除元素\n（2分）； 5. 正确输出最终列表（2分）。", "answer": "", "exam": true}, {"id": 1730, "type": "编程题", "question": "1522、请编写一个Python程序，完成以下任务：\n创建一个包含元素(10, 20, 30, 40)的元组nums；\n将元组nums转换为列表，修改列表中的第三个元素（索引为2）为35；\n将修改后的列表转换回元组；\n输出最终的元组。\n参考代码：\nnums = (10, 20, 30, 40)\nlist_nums = list(nums)\nlist_nums[2] = 35\nnew_nums = tuple(list_nums)\nprint(new_nums)\n解析：评分细则（10分）： 1. 正确创建元组nums（2分）； 2. 正确将元组转换为列表（2分）；", "answer": "", "exam": true}, {"id": 1731, "type": "填空题", "question": "3. 正确修改列表中的指定元素（2分）； 4. 正确将列表转换回元组（2分）； 5. 正确输出最终元\n组（2分）。", "answer": "", "exam": true}, {"id": 1732, "type": "编程题", "question": "1523、请编写一个Python程序，完成以下任务：\n创建两个集合A={1, 2, 3, 4, 5}和B={4, 5, 6, 7, 8}；\n计算并输出A和B的交集；\n计算并输出A和B的并集；\n计算并输出A相对于B的差集（即A中有而B中没有的元素）。\n参考代码：\nA = {1, 2, 3, 4, 5}\nB = {4, 5, 6, 7, 8}\nprint('交集:', A & B)\nprint('并集:', A | B)\nprint('差集:', A - B)\n解析：评分细则（10分）： 1. 正确创建集合A和B（2分）； 2. 正确计算并输出交集（2分）； 3.\n正确计算并输出并集（2分）； 4. 正确计算并输出差集（2分）； 5. 输出格式清晰（2分）。", "answer": "", "exam": true}, {"id": 1733, "type": "编程题", "question": "1524、请编写一个Python程序，完成以下任务：\n创建一个字典student，包含键值对'name': 'Alice', 'age': 20, 'major': 'Computer\nScience'；\n向字典中添加键值对'grade': 'A'；\n修改键'age'的值为21；\n输出字典中键'major'对应的值；\n输出最终的字典student。\n参考代码：\nstudent = {'name': 'Alice', 'age': 20, 'major': 'Computer Science'}\nstudent['grade'] = 'A'\nstudent['age'] = 21\nprint(student['major'])\nprint(student)\n解析：评分细则（10分）： 1. 正确创建初始字典student（2分）； 2. 正确添加键值对'grade':\n'A'（2分）； 3. 正确修改键'age'的值（2分）； 4. 正确输出键'major'对应的值（2分）； 5. 正\n确输出最终字典（2分）。", "answer": "", "exam": true}, {"id": 1734, "type": "选择题", "question": "1525、关于Python函数的概念，下列描述错误的是：\nA、函数是组织好的、用于实现单一功能或相关联功能的代码段\nB、函数必须有返回值\nC、使用函数可以提高代码的复用性\nD、函数可以被多次调用\n解析：根据教材第6章函数概述部分，函数可以没有返回值，return语句可省略。", "answer": "B", "exam": true}, {"id": 1735, "type": "选择题", "question": "1526、在Python中，定义函数时使用的关键字是？\nA、function\nB、def\nC、define\nD、func\n解析：根据书中第6章内容，Python中使用def关键字定义函数，例如def add(): ...", "answer": "B", "exam": true}, {"id": 1736, "type": "选择题", "question": "1527、定义函数时设置的参数称为？\nA、实际参数\nB、形式参数\nC、关键字参数\nD、默认参数\n解析：书中6.3节明确，定义函数时的参数是形式参数（形参），调用时传入的是实际参数（实参）", "answer": "B", "exam": true}, {"id": 1737, "type": "选择题", "question": "1528、调用函数传递位置参数时，实参的什么必须与形参一致？\nA、数量和位置\nB、数量和类型\nC、位置和类型\nD、数量和名称\n解析：书中6.3.1节说明，位置参数传递时，实参的数量和位置必须与形参一致，否则会出错", "answer": "A", "exam": true}, {"id": 1738, "type": "选择题", "question": "1529、以下哪项不是使用函数的好处？\nA、提高代码复用性\nB、增加程序复杂度\nC、使程序结构更清晰\nD、便于后期维护\n解析：书中6.1节指出，函数可提高代码复用性、简化结构、便于维护，不会增加复杂度", "answer": "B", "exam": true}, {"id": 1739, "type": "选择题", "question": "1530、递归函数的特点是？\nA、函数内部调用其他函数\nB、函数自己调用自己\nC、函数有多个返回值\nD、函数没有参数\n解析：书中6.3节提到，递归函数是直接或间接调用自身的函数，常用于解决阶乘等问题", "answer": "B", "exam": true}, {"id": 1740, "type": "选择题", "question": "1531、在函数内部定义的变量，其作用域通常是？\nA、全局作用域\nB、局部作用域\nC、嵌套作用域\nD、内置作用域\n解析：书中第6章指出，函数内部定义的变量是局部变量，仅在函数内部有效（局部作用域）", "answer": "B", "exam": true}, {"id": 1741, "type": "选择题", "question": "1532、nonlocal关键字的作用是？\nA、修改全局变量\nB、修改嵌套作用域中的变量\nC、定义局部变量\nD、定义全局变量\n解析：书中第6章提到，nonlocal关键字用于修改嵌套作用域（外层函数的局部变量）中的变量", "answer": "B", "exam": true}, {"id": 1742, "type": "选择题", "question": "1533、以下哪种参数传递方式允许通过参数名传递实参？\nA、位置参数传递\nB、关键字参数传递\nC、默认参数传递\nD、参数打包传递\n解析：书中6.3节提到，关键字参数传递允许通过参数名（如func(a=1,b=2)）传递实参，不受位置限\n制", "answer": "B", "exam": true}, {"id": 1743, "type": "选择题", "question": "1534、调用函数时，程序的执行流程是？\nA、直接执行函数体，不暂停当前程序\nB、暂停当前程序，跳转到函数定义处执行，执行完后回到原位置继续\nC、跳转到函数定义处执行，执行完后不回到原位置\nD、先执行函数体，再传递参数\n解析：附件中描述函数调用时，程序会暂停当前执行，跳转到函数定义处，传递参数后执行函数体，\n再回到原位置继续，故选项B正确。", "answer": "B", "exam": true}, {"id": 1744, "type": "填空题", "question": "1535、在Python中，定义函数需要使用____关键字。\ndef\n；\n解析：本题考察函数定义的关键字，根据书中第6章6.2.1节内容，Python使用def关键字定义函数。", "answer": "", "exam": true}, {"id": 1745, "type": "填空题", "question": "1536、函数在定义完成后不会立刻执行，直到被程序____时才会执行。\n调用\n；\n解析：本题考察函数调用的基本概念，根据书中第6章6.2.2节内容，函数需被调用才会执行。", "answer": "", "exam": true}, {"id": 1746, "type": "填空题", "question": "1537、若要在函数内部修改全局变量，需要使用____关键字声明。\nglobal\n；\n解析：拓展阅读要求掌握global关键字修改变量作用域。", "answer": "", "exam": true}, {"id": 1747, "type": "填空题", "question": "1538、函数直接或间接调用自身的函数称为____。\n递归函数\n；\n解析：教材拓展阅读要求掌握递归函数的使用。", "answer": "", "exam": true}, {"id": 1748, "type": "填空题", "question": "1539、当调用函数传递位置参数时，实参会按照______顺序依次传递给对应的形参。\n位置\n；\n解析：根据教材第6章位置参数传递的内容，位置参数的传递需保持实参与形参的位置顺序一致。", "answer": "", "exam": true}, {"id": 1749, "type": "填空题", "question": "1540、当调用函数传递位置参数时，实参的______和位置必须与函数定义中位置参数的数量和位置保\n持一致。\n数量\n；\n解析：依据教材第6章位置参数传递的内容，位置参数传递要求实参数量与形参数量一致。", "answer": "", "exam": true}, {"id": 1750, "type": "填空题", "question": "1541、Python中使用______关键字定义匿名函数。\nlambda\n；\n解析：拓展阅读提到，匿名函数通过lambda关键字定义。", "answer": "", "exam": true}, {"id": 1751, "type": "填空题", "question": "1542、函数中使用____语句将处理结果返回给调用方。\nreturn\n；\n解析：本题考察函数返回值的关键字，教材中明确return语句用于返回结果。", "answer": "", "exam": true}, {"id": 1752, "type": "填空题", "question": "1543、定义函数时设置的参数称为____参数，简称为形参。\n形式\n；\n解析：函数参数传递部分说明，定义函数时的参数为形式参数（形参）。", "answer": "", "exam": true}, {"id": 1753, "type": "填空题", "question": "1544、调用函数时传入的参数称为____参数，简称为实参。\n实际\n；\n解析：函数参数传递部分指出，调用函数时传入的参数为实际参数（实参）。", "answer": "", "exam": true}, {"id": 1754, "type": "填空题", "question": "1545、函数在定义完成后会自动执行。\n解析：教材6.2.2节说明，函数定义后不会立刻执行，需调用才会执行。", "answer": "错误", "exam": true}, {"id": 1755, "type": "填空题", "question": "1546、定义函数时设置的参数称为实际参数。\n解析：教材6.3节指出，定义函数时的参数是形式参数（形参），调用时传入的是实际参数（实\n参）。", "answer": "错误", "exam": true}, {"id": 1756, "type": "填空题", "question": "1547、函数内部不能调用其他函数。\n解析：教材6.2.2节提到函数内部可以调用其他函数，称为嵌套调用。", "answer": "错误", "exam": true}, {"id": 1757, "type": "填空题", "question": "1548、所有函数都必须有return语句。\n解析：教材6.2.1节说明，若函数没有返回值，可以省略return语句。", "answer": "错误", "exam": true}, {"id": 1758, "type": "填空题", "question": "1549、函数是组织好的、用于实现单一功能或相关联功能的代码段，可在需要时以`函数名()`的形式\n调用。\n解析：根据课程内容，函数是组织好的代码段，用于实现单一或关联功能，调用方式为`函数名()`。", "answer": "正确", "exam": true}, {"id": 1759, "type": "填空题", "question": "1550、Python中定义函数必须使用关键字`func`。\n解析：Python中定义函数的关键字是`def`，而非`func`。", "answer": "错误", "exam": true}, {"id": 1760, "type": "填空题", "question": "1551、Python函数只能返回单个值，无法返回多个值。\n解析：根据拓展阅读要求，函数可处理多个返回值（如返回元组实现多值返回）。", "answer": "错误", "exam": true}, {"id": 1761, "type": "填空题", "question": "1552、关键字参数的传递方式是指在调用函数时，通过“形参=实参”的格式将实参与对应的形参关\n联起来，实参的顺序可以任意调整。\n解析：关键字参数传递时，实参通过形参名进行匹配，顺序可以任意调整。", "answer": "正确", "exam": true}, {"id": 1762, "type": "填空题", "question": "1553、在函数内部定义的变量是局部变量，只能在函数内部访问\n解析：局部变量的作用域仅限于定义它的函数内部，外部无法直接访问", "answer": "正确", "exam": true}, {"id": 1763, "type": "填空题", "question": "1554、递归函数是指在函数内部调用自身的函数，必须包含终止条件以避免无限递归\n解析：递归函数通过自我调用来解决问题，终止条件是防止递归无限进行的必要条件", "answer": "正确", "exam": true}, {"id": 1764, "type": "填空题", "question": "1555、Python中定义函数的关键字是什么？请写出函数定义的基本语法结构。\n定义函数的关键字是def。基本语法结构为：def 函数名(参数列表): 文档字符串 函数体 [return\n返回值]。\n解析：本题考察函数定义的关键字和语法。得分点：关键字def（2分）；函数头结构（def 函数名\n(参数列表):）（3分）；文档字符串（2分）；函数体（2分）；return语句（1分）。", "answer": "", "exam": true}, {"id": 1765, "type": "填空题", "question": "1556、什么是形式参数和实际参数？函数参数传递的位置参数方式有什么要求？\n形式参数（形参）是定义函数时设置的参数；实际参数（实参）是调用函数时传入的参数。位置参数\n传递要求实参的数量和位置必须与函数定义中形参的数量和位置保持一致。\n解析：本题考察函数参数的基本概念和位置参数传递规则。得分点：形参定义（2分）；实参定义（2\n分）；数量一致要求（3分）；位置顺序要求（3分）。", "answer": "", "exam": true}, {"id": 1766, "type": "填空题", "question": "1557、什么是局部变量和全局变量？如何在函数内部修改全局变量？\n局部变量是在函数内部定义的变量，作用域仅限于函数内部；全局变量是在函数外部定义的变量，作\n用域覆盖整个程序。在函数内部使用global关键字声明变量后即可修改全局变量。\n解析：知识点：变量作用域及global关键字的使用。评分细则：局部变量定义正确得2分；全局变量\n定义正确得2分；提到global关键字得3分；说明修改方法得3分。", "answer": "", "exam": true}, {"id": 1767, "type": "填空题", "question": "1558、函数参数的传递方式有哪些？请分别简述其特点。\n传递方式包括：1. 位置参数：实参按位置顺序传递给形参，数量和位置需匹配；2. 关键字参数：通\n过“形参=实参”传递，无需关注位置；3. 默认参数：定义函数时给形参指定默认值，调用时可省\n略；4. 打包与解包：使用*或**对参数进行打包或解包；5. 混合传递：结合多种方式传递参数。\n解析：1. 列出至少4种传递方式（2分）；2. 位置参数特点（2分）；3. 关键字参数特点（2分）；", "answer": "", "exam": true}, {"id": 1768, "type": "填空题", "question": "4. 默认参数特点（2分）；5. 打包解包特点（2分）。考察知识点：函数参数传递。", "answer": "", "exam": true}, {"id": 1769, "type": "填空题", "question": "1559、编写一个递归函数计算斐波那契数列的第n项，要求：", "answer": "", "exam": true}, {"id": 1770, "type": "填空题", "question": "1) 函数名为fibonacci，参数为整数n；", "answer": "", "exam": true}, {"id": 1771, "type": "填空题", "question": "2) 当n小于等于0时返回0，n等于1时返回1；", "answer": "", "exam": true}, {"id": 1773, "type": "填空题", "question": "4) 在主程序中调用该函数计算第10项并输出结果。\nif n <= 0:\nreturn 0\nelif n == 1:\nreturn 1\nelse:\nreturn fibonacci(n-1) + fibonacci(n-2)\nprint(fibonacci(10))\n解析：\n函数定义正确（包含函数名、参数）得2分；\n递归终止条件判断正确（n<=0返回0，n==1返回1）得3分；\n递归调用逻辑正确（fibonacci(n-1)+fibonacci(n-2)）得3分；\n主程序调用并输出正确结果得2分。", "answer": "def fibonacci(n):", "exam": true}, {"id": 1774, "type": "填空题", "question": "1560、定义一个函数calculate_area，用于计算矩形面积，要求：1) 函数有两个参数length和\nwidth，其中width的默认值为10；2) 分别使用位置参数、关键字参数和混合参数三种方式调用该函\n数，计算不同矩形的面积并输出结果。\ndef calculate_area(length, width=10):\nreturn length * width\n# 位置参数调用\nprint(calculate_area(5))\n# 关键字参数调用\nprint(calculate_area(width=5, length=8))\n# 混合参数调用\nprint(calculate_area(6, width=7))\n解析：\n函数定义正确（参数设置及默认值）得2分；\n位置参数调用正确（传递length参数）得2分;\n关键字参数调用正确（参数顺序无关）得3分；\n混合参数调用正确（位置参数在前，关键字参数在后）得3分。", "answer": "", "exam": true}, {"id": 1775, "type": "填空题", "question": "1561、定义一个函数get_stats，接收一个列表参数，返回该列表的最大值、最小值和平均值。在主\n程序中调用该函数并格式化输出结果。\nmax_val = max(lst)\nmin_val = min(lst)\navg_val = sum(lst) / len(lst)\nreturn max_val, min_val, avg_val\nresult = get_stats([1,2,3,4,5])\nprint(f\"最大值：{result[0]}, 最小值：{result[1]}, 平均值：{result[2]}\")\n解析：\n函数定义正确（参数接收列表）得2分;\n计算最大值、最小值、平均值正确得3分；\n多返回值处理正确得3分；\n主程序调用并格式化输出正确得2分。", "answer": "def get_stats(lst):", "exam": true}, {"id": 1776, "type": "填空题", "question": "1562、定义函数 `process_data(data)`，接收一个列表 `data`，实现以下功能：\n计算列表的平均值，存储到变量 average 中；\n统计大于平均值的数的个数，存储到变量 above_avg_count 中；\n返回average和 above_avg_count\n调用该函数并处理返回值，例如 `data = [1,2,3,4,5,6]`，编写代码并格式化输出结果，打印输出\n结果，格式为 “平均值为：XXX，大于平均值的数有：YYY 个”（保留两位小数）。\n# 计算平均值\naverage = sum(data) / len(data)\n# 统计大于平均值的数字个数\nabove_avg_count = 0\nfor num in data:\nif num > average:\nabove_avg_count += 1\n# 返回两个结果\nreturn average, above_avg_count\n# 测试数据\ndata = [1, 2, 3, 4, 5, 6]\n# 接收返回值\navg, count = process_data(data)\n# 格式化输出，保留两位小数\nprint(f\"平均值为：{avg:.2f}，大于平均值的数有：{count} 个\")\n解析：", "answer": "def process_data(data):", "exam": true}, {"id": 1777, "type": "填空题", "question": "1、函数定义与平均值计算（3 分）：\n1）正确定义 process_data(data) 函数（1 分）；\n2）使用 sum()、len()计算列表总和（1 分）；\n3）正确算出平均值并赋值给变量 average （1 分），计算逻辑错误本项全扣。", "answer": "", "exam": true}, {"id": 1778, "type": "填空题", "question": "2、数据统计（2 分）：\n1）初始化计数变量（1 分）；\n2）结合循环与条件判断，准确统计大于平均值的数字个数（1 分），统计逻辑错误扣 2 分。", "answer": "", "exam": true}, {"id": 1779, "type": "填空题", "question": "3、函数返回与调用（2 分）：\n1）函数内通过 return正确返回两个结果（1 分）；\n2）调用函数并使用解包方式接收返回值（1 分），返回或接收写法错误各扣 1 分。", "answer": "", "exam": true}, {"id": 1780, "type": "填空题", "question": "4、格式化输出（3 分）：\n1）输出内容与题目指定格式一致（1 分）；\n2）实现平均值保留两位小数（1 分）；\n3）整体输出格式规范无误（1 分），小数位数错误扣 1 分，格式错误扣 1 分。", "answer": "", "exam": true}, {"id": 1781, "type": "选择题", "question": "1563、在Python中，若要以只读方式打开一个文本文件，且文件必须存在，应使用以下哪种打开模\n式？\nA、'r'\nB、'w'\nC、'a'\nD、'rb'\n解析：评分细则：1. 正确选择选项A（3分）；2. 解释'r'模式表示只读文本文件且文件必须存在（3\n分）；3. 说明'w'模式是写入模式，文件不存在则创建（2分）；4. 说明'a'模式是追加模\n式，'rb'模式是二进制只读模式（2分）。总分10分。", "answer": "A", "exam": true}, {"id": 1782, "type": "选择题", "question": "1564、以下哪个方法可以一次性读取文件中的所有行，并返回一个包含所有行的列表？\nA、read()\nB、readline()\nC、readlines()\nD、write()\n解析：评分细则：1. 正确选择选项C（3分）；2. 说明readlines()方法返回包含文件所有行的列表\n（3分）；3. 解释read()方法返回文件全部内容的字符串（2分）；4. 说明readline()返回一行内\n容，write()是写入方法（2分）。总分10分。", "answer": "C", "exam": true}, {"id": 1783, "type": "选择题", "question": "1565、Python中处理CSV格式文件时，通常使用哪个标准库模块？\nA、csv\nB、json\nC、pickle\nD、os\n解析：评分细则：1. 正确选择选项A（3分）；2. 说明csv模块用于读写CSV格式文件（3分）；3. 解\n释json模块处理JSON数据，pickle模块用于对象序列化（2分）；4. 说明os模块用于系统操作（2\n分）。总分10分。", "answer": "A", "exam": true}, {"id": 1784, "type": "选择题", "question": "1566、以下Python代码的输出结果是？\\nname = \"Alice\"\\nage = 25\\nprint(\"My name is {} and\nI am {} years old.\".format(name, age))\nA、My name is Alice and I am 25 years old.\nB、My name is {} and I am {} years old.\nC、Error\nD、My name is name and I am age years old.\n解析：评分细则：1. 正确选择选项A（3分）；2. 说明format()方法会将占位符{}替换为对应的参数\n值（3分）；3. 解释第一个{}替换为name变量的值\"Alice\"（2分）；4. 解释第二个{}替换为age变量\n的值25（2分）。总分10分。", "answer": "A", "exam": true}, {"id": 1785, "type": "选择题", "question": "1567、以下哪个方法用于读取文件的全部内容并返回一个字符串？\nA、read()\nB、readline()\nC、readlines()\nD、readall()\n解析：read()方法读取全部内容为字符串，readline()读取一行，readlines()读取所有行为列表，\nreadall()不是Python文件对象的方法。考察知识点：文件内容读取方法。", "answer": "A", "exam": true}, {"id": 1786, "type": "填空题", "question": "1568、在Python中，文件操作的三个基本步骤依次是：打开文件、______、关闭文件。\n操作文件\n；\n解析：1. 参考答案：操作文件 2. 评分细分细则：第1空填“操作文件”得10分，填其他内容不得\n分 3. 考察的知识点：文件操作的基本步骤", "answer": "", "exam": true}, {"id": 1787, "type": "填空题", "question": "1569、将数据转换为适合存储或传输的格式的过程称为____1____。\n数据格式化\n；\n解析：答案为'数据格式化'，本题考查数据格式化的基本定义，答对得10分。", "answer": "", "exam": true}, {"id": 1788, "type": "填空题", "question": "1570、readlines()方法会将文件内容按行读取，并返回一个______类型的数据。\n列表\n；\n解析：考察知识点：文件读取方法的返回值类型。参考答案：列表。评分细则：回答正确得10分，错\n误得0分。", "answer": "", "exam": true}, {"id": 1789, "type": "填空题", "question": "1571、Python中，关闭已打开文件的方法是______()\nclose\n；\n解析：参考答案：close；评分细分细则：答对得10分，答错得0分；考察的知识点：文件操作基本方\n法", "answer": "", "exam": true}, {"id": 1790, "type": "填空题", "question": "1572、打开二进制文件时，必须在模式字符串中添加'b'后缀（如'rb'或'wb'）。\n解析：参考答案：对；评分细则：答对得10分，答错得0分；考察知识点：二进制文件的打开模式要\n求", "answer": "正确", "exam": true}, {"id": 1791, "type": "填空题", "question": "1573、Python的json.dump()函数需要先打开文件并获取文件对象，才能将JSON数据写入文件。\n解析：参考答案：对；评分细则：答对得10分，答错得0分；考察知识点：JSON数据写入文件的操作\n流程", "answer": "正确", "exam": true}, {"id": 1792, "type": "填空题", "question": "1574、Python的split()方法可以将一个字符串按指定分隔符分割成列表。\n解析：参考答案：对；评分细则：答对得10分，答错得0分；考察知识点：字符串分割的数据格式化\n操作", "answer": "正确", "exam": true}, {"id": 1793, "type": "填空题", "question": "1575、Python的write()方法可以直接将列表对象写入文件。\n解析：参考答案：错；评分细则：答对得10分，答错得0分；考察知识点：文件写入操作的对象类型\n要求（需字符串或字节流）", "answer": "错误", "exam": true}, {"id": 1794, "type": "填空题", "question": "1576、使用'r'模式打开不存在的文件时，Python会抛出FileNotFoundError异常。\n解析：参考答案：对；评分细则：答对得10分，答错得0分；考察知识点：文件读取操作中的异常情\n况处理", "answer": "正确", "exam": true}, {"id": 1795, "type": "填空题", "question": "1577、Python的join()方法可以将列表中的元素连接成一个字符串。\n解析：参考答案：对；评分细则：答对得10分，答错得0分；考察知识点：字符串连接的数据格式化\n操作", "answer": "正确", "exam": true}, {"id": 1796, "type": "填空题", "question": "1578、请简述Python中文件打开模式的分类及常见模式的含义，并举例说明只读模式(r)和追加模式\n(a)的使用场景。", "answer": "", "exam": true}, {"id": 1797, "type": "填空题", "question": "1. 参考答案： - 文件打开模式分为文本模式和二进制模式两大类，文本模式处理字符数据，二进制\n模式处理字节数据； - 常见文本模式：r（只读，文件不存在则报错）、w（只写，覆盖原有内容，\n文件不存在则创建）、a（追加，在文件末尾写入，文件不存在则创建）、r+（读写，指针在开\n头）、w+（读写，覆盖内容）、a+（读写，指针在末尾）； - 二进制模式在模式字符后加'b'（如\nrb、wb），用于处理非文本文件； - 只读模式适用于读取配置文件，追加模式适用于写入日志文\n件。 2. 评分细则： - 分类为文本/二进制模式：2分 - 常见文本模式含义：3分 - 二进制模式说\n明：2分 - 场景举例：3分 3. 考察知识点：文件打开模式的分类与应用\n解析：考察文件打开模式的分类、常见模式含义及实际应用场景，评估学生对文件操作基础概念的理\n解和应用能力。", "answer": "", "exam": true}, {"id": 1798, "type": "填空题", "question": "1579、请说明Python中数据格式化输出的常用方法，并举例对比format()方法和f-string的使用。", "answer": "", "exam": true}, {"id": 1799, "type": "填空题", "question": "1. 参考答案： - 常用方法：%运算符、format()方法、f-string（Python3.6+）； - format()通过\n{}占位符和format()传递参数，支持位置/关键字参数及格式化说明符； - f-string通过前缀f和{}\n嵌入变量/表达式，语法简洁； - 示例：format()方式\"姓名：{name}\".format(name=\"张三\")，f-\nstring方式f\"姓名：{name}\"。 2. 评分细则： - 常用方法列举：2分 - format()方法特点：3分 -\nf-string特点：3分 - 示例对比：2分 3. 考察知识点：数据格式化输出的方法与应用\n解析：考察数据格式化输出的常用方法及两种主流方式的差异，评估学生对字符串格式化的掌握程\n度。", "answer": "", "exam": true}, {"id": 1800, "type": "填空题", "question": "1580、请说明Python中write()和writelines()方法的区别，并举例说明如何使用writelines()写入\n列表数据到文件。", "answer": "", "exam": true}, {"id": 1801, "type": "填空题", "question": "1. 参考答案： - write()写入字符串，非字符串数据会抛出TypeError； - writelines()写入字符\n串序列（列表/元组），不自动添加换行符； - 写入多行需手动添加\"\\n\"； - 示例：data = [\"第一\n行\\n\", \"第二行\\n\"], file.writelines(data)。 2. 评分细则： - write()方法特点：2分 -\nwritelines()方法特点：3分 - 换行符处理：2分 - 示例说明：3分 3. 考察知识点：文件写入方法\n的差异与应用\n解析：考察两种文件写入方法的区别及实际应用，评估学生对文件写入操作的细节掌握程度。", "answer": "", "exam": true}, {"id": 1802, "type": "选择题", "question": "1581、以下关于数据格式化的描述,正确的是?\nA、JSON格式只能存储字符串数据\nB、CSV格式以逗号作为默认分隔符\nC、二进制文件可以直接用文本编辑器打开查看\nD、`pickle`模块只能序列化Python的基本数据类型\n解析：1. 正确指出B选项正确（3分）；2. 说明JSON格式可以存储多种数据类型（2分）；3. 说明二\n进制文件的查看限制（2分）；4. 说明`pickle`模块可以序列化复杂对象（3分）。本题考察数据格\n式化的基本概念。", "answer": "B", "exam": true}, {"id": 1803, "type": "选择题", "question": "1582、以二进制写入模式打开文件的模式符号是?\nA、`'wb'`\nB、`'w'`\nC、`'rb'`\nD、`'r'`\n解析：1. 正确选择`'wb'`（3分）；2. 说明`'w'`是文本写入模式（2分）；3. 说明`'rb'`是二进制\n读取模式（2分）；4. 说明`'r'`是文本读取模式（3分）。本题考察文件打开模式中的二进制模式。", "answer": "A", "exam": true}, {"id": 1804, "type": "选择题", "question": "1583、以下哪种方法可以将Python字典转换为JSON字符串?\nA、`json.load()`\nB、`json.dump()`\nC、`json.loads()`\nD、`json.dumps()`\n解析：1. 正确选择`json.dumps()`（4分）；2. 说明`json.load()`用于从文件读取JSON（2分）；", "answer": "D", "exam": true}, {"id": 1805, "type": "填空题", "question": "3. 说明`json.dump()`用于将JSON写入文件（2分）；4. 说明`json.loads()`用于JSON字符串转\nPython对象（2分）。本题考察JSON数据的序列化操作。", "answer": "", "exam": true}, {"id": 1806, "type": "选择题", "question": "1584、以下哪个函数可以用于获取当前工作目录?\nA、`os.getcwd()`\nB、`os.listdir()`\nC、`os.path.join()`\nD、`os.mkdir()`\n解析：1. 正确选择`os.getcwd()`（3分）；2. 说明`os.listdir()`用于列出目录内容（2分）；3.\n说明`os.path.join()`用于拼接路径（2分）；4. 说明`os.mkdir()`用于创建目录（3分）。本题考\n察文件路径操作的相关函数。", "answer": "A", "exam": true}, {"id": 1807, "type": "选择题", "question": "1585、在Python中,将JSON字符串转换为Python对象的函数是?\nA、`json.dumps()`\nB、`json.loads()`\nC、`json.read()`\nD、`json.write()`\n解析：1. 正确选择`json.loads()`（4分）；2. 说明`json.dumps()`用于Python对象转JSON字符串\n（2分）；3. 指出`json.read()`和`json.write()`不是标准方法（2分）；4. 明确JSON数据转换的\n基本概念（2分）。本题考察JSON数据的转换方法。", "answer": "B", "exam": true}, {"id": 1808, "type": "选择题", "question": "1586、以下哪个模块常用于处理CSV格式的文件?\nA、`json`\nB、`csv`\nC、`math`\nD、`random`\n解析：1. 正确选择`csv`模块（4分）；2. 说明`json`模块用于处理JSON数据（2分）；3. 说明\n`math`模块用于数学运算（2分）；4. 说明`random`模块用于生成随机数（2分）。本题考察CSV文件\n处理的相关模块。", "answer": "B", "exam": true}, {"id": 1809, "type": "选择题", "question": "1587、以下哪种数据格式常用于存储表格型数据？\nA、JSON\nB、CSV\nC、XML\nD、YAML\n解析：评分细则：1. 正确选择选项B得3分；2. 说明CSV格式的特点（以逗号分隔的表格数据）得2\n分；3. 指出选项A适合嵌套结构数据（错误）得1分；4. 指出选项C为标记语言（错误）得2分；5.\n指出选项D适合配置文件（错误）得2分。考察知识点：常见数据格式的应用场景。", "answer": "B", "exam": true}, {"id": 1810, "type": "填空题", "question": "1588、with语句可以自动管理文件资源，即使发生异常也能保证文件被正确关闭。\n解析：1. 判断正确（3分）；2. 说明with语句的上下文管理功能（2分）；3. 解释自动关闭文件的\n原理：通过__enter__和__exit__方法实现（2分）；4. 对比使用with与不使用with的区别（如手动\nclose()可能因异常遗漏）（2分）；5. 给出一个使用with打开文件的示例代码（如with open('a.\ntxt','r') as f: print(f.read())）（1分）。考察知识点：with语句在文件操作中的应用。", "answer": "正确", "exam": true}, {"id": 1811, "type": "填空题", "question": "1589、二进制文件与文本文件的区别在于，二进制文件存储的是字节流，而文本文件存储的是字符\n流，Python中打开二进制文件需要指定模式为'b'。\n解析：1. 判断正确（3分）；2. 区分二进制与文本文件的存储内容（字节vs字符）（2分）；3. 说\n明打开二进制文件需加'b'模式（如'rb'、'wb'）（2分）；4. 举例说明读取二进制文件的方法（如\nopen('img.jpg','rb').read()）（2分）；5. 说明二进制文件的应用场景（如图像、音频、压缩\n包）（1分）。考察知识点：二进制文件与文本文件的区别及操作。", "answer": "正确", "exam": true}, {"id": 1812, "type": "填空题", "question": "1590、在Python中，文件指针的位置可以通过tell()方法获取，通过seek()方法移动。其中seek\n(offset, whence)的whence参数默认值是1（当前位置）。\n解析：1. 判断正确（3分）；2. 指出whence参数的默认值是0（文件开头）（2分）；3. 说明whence\n的三个取值：0（开头）、1（当前）、2（末尾）（2分）；4. 举例说明seek()方法的使用（如seek\n(5,0)移动到第5字节处）（2分）；5. 说明tell()方法的作用：返回当前指针的字节位置（1分）。\n考察知识点：文件指针的操作（tell()和seek()方法）。", "answer": "错误", "exam": true}, {"id": 1813, "type": "填空题", "question": "1591、Python中文件打开模式有多种类型，请分别说明'r'、'w'、'a'三种模式的特点和主要区别。", "answer": "", "exam": true}, {"id": 1814, "type": "填空题", "question": "1. 'r'模式：只读模式，用于读取已存在的文件，若文件不存在则抛出异常；2. 'w'模式：写入模\n式，用于创建新文件或覆盖已有文件，若文件存在则清空内容后写入；3. 'a'模式：追加模式，用于\n在文件末尾添加内容，若文件不存在则创建新文件；4. 三种模式的核心区别在于对文件存在性的处\n理和写入位置的不同。\n解析：评分细则：1. 准确描述'r'模式特点（2分）；2. 准确描述'w'模式特点（2分）；3. 准确描\n述'a'模式特点（2分）；4. 清晰说明三种模式的核心区别（3分）；5. 逻辑清晰（1分）。总分10\n分。考察知识点：文件打开模式的类型与区别。", "answer": "", "exam": true}, {"id": 1815, "type": "填空题", "question": "1592、请简述Python中打开文件进行操作的基本步骤，并说明每个步骤的主要作用。", "answer": "", "exam": true}, {"id": 1816, "type": "填空题", "question": "1. 使用open()函数打开文件，传入文件名和打开模式参数，获取文件对象；2. 通过文件对象调用\nread()、write()等方法执行读写操作；3. 操作完成后调用close()方法关闭文件，释放系统资源；", "answer": "", "exam": true}, {"id": 1817, "type": "编程题", "question": "4. 推荐使用with语句上下文管理器，自动管理文件的打开与关闭，避免资源泄漏。\n解析：评分细则：1. 答出open()函数打开文件及参数（2分）；2. 答出文件对象的读写操作（2\n分）；3. 答出close()方法的作用（2分）；4. 答出with语句的使用及优势（3分）；5. 语言表达清\n晰（1分）。总分10分。考察知识点：Python文件操作的基本流程与最佳实践。\n编写一个Python程序，实现文件的备份功能。要求如下：\n提示用户输入一个源文件名（例如\ntest.txt\n）。\n如果源文件不存在，程序应提示“源文件不存在，请检查！”并结束运行。\n如果源文件存在，则将其内容逐行复制到一个新文件中，新文件名为\n备份_原文件名\n（例如\n备份_test.txt\n）。\n备份完成后，输出“备份成功！”。\n使用\nwith\n语句管理文件对象，确保文件正确关闭。\nimport os\nsource_file = input(\"请输入要备份的文件名：\")\nif not os.path.exists(source_file):\nprint(\"源文件不存在，请检查！\")\nelse:\nbackup_file = \"备份_\" + source_file\nwith open(source_file, 'r', encoding='utf-8') as src:\nwith open(backup_file, 'a', encoding='utf-8') as dst:\nfor line in src:\ndst.write(line)\nprint(\"备份成功！\")\n解析：\n评分细则（满分10分）：\n正确获取用户输入的文件名（1分）：使用\ninput()\n实现。\n正确判断源文件是否存在（2分）：使用\nos.path.exists()\n（属于os模块，附件7.3）或\ntry-except\n结构。\n正确生成备份文件名，格式为“备份_原文件名”（1分）：通过字符串拼接实现。\n使用\nwith\n语句打开源文件和备份文件（2分）：可以使用两个\nwith\n语句嵌套或一个\nwith\n内同时打开两个文件。\n正确实现逐行读取与写入（2分）：使用\nfor line in src:\n遍历源文件，并调用\ndst.write(line)\n写入备份文件。\n输出正确的提示信息，包括源文件不存在和备份成功两种情况（1分）：两个分支都有相应的输出。\n文件编码指定为\nutf-8\n或\ngbk\n（1分）：在\nopen()\n函数中添加\nencoding='utf-8'\n参数（参考附件7.2.1）。\n有一个CSV文件\nscore.csv\n，内容如下（第一行为表头，后续每行为一名学生的各科成绩）：\ntext\n姓名,语文,数学,英语,理综\n小红,124,137,145,260\n小明,116,143,139,263\n小白,120,130,148,255\n请编写程序完成以下功能：\n读取\nscore.csv\n文件中的内容。\n计算每名学生的总分（语文+数学+英语+理综）。\n将原表头增加一列“总分”，并将每名学生的总分添加到对应行末尾。\n将处理后的数据写入新文件\nscore_with_total.csv\n。\n要求使用\nsplit(',')\n解析CSV，并注意处理换行符。\nwith open('score.csv', 'r', encoding='utf-8') as f:\nlines = []\nfor line in f:\nline = line.strip()\nlines.append(line.split(','))\nlines[0].append(\"总分\")\nfor i in range(1, len(lines)):\nscores = list(map(int, lines[i][1:5]))\ntotal = sum(scores)\nlines[i].append(str(total))\nwith open('score_with_total.csv', 'a', encoding='utf-8') as f:\nfor row in lines:\nf.write(','.join(row) + '\\n')\nprint(\"处理完成，已生成 score_with_total.csv\")\n解析：\n评分细则（满分10分）：\n正确打开并读取CSV文件（2分）：使用\nopen()\n'r' 并以读模式\n打开，能够读取文件内容。\n正确去除每行的换行符并按逗号分割字符串（2分）：使用\nstrip()\nreplace('\\n','')或\nsplit(',') 去除换行，再用\n得到列表。\n正确增加表头“总分”（1分）：对第一行（表头）执行\nappend(\"总分\")\n。\n正确提取每名学生的成绩列并计算总分（2分）：使用列表切片\n[1:5]\nsum() 获取四科成绩，转换为整数后用\n求和。\n将计算出的总分追加到该行末尾（1分）：对数据行执行\nappend(str(total))\n。\n正确将处理后的数据写入新CSV文件（2分）：使用\n','.join(row)\n\\n 拼接每行，并写入文件，每行末尾添加换行符\n。\n当前目录下存在多个文件（不包括子文件夹）。请编写程序：\n使用 os 模块获取当前目录下所有文件的文件名列表。\n依次以二进制读取模式 打开每个文件，使用 seek tell 和  方法获取文件的总字节数（大小）。\n输出每个文件的名称及其大小（格式： 文件名 : 字节数 ）。\n最后输出所有文件的总大小（累加和）。\n要求处理可能发生的异常（如文件无法读取）\nimport os\ntotal_size = 0\nfiles = os.listdir('./')\nfor item in files:\nif os.path.isfile(item):\ntry:\nwith open(item, 'rb') as f:\nf.seek(0, os.SEEK_END)\nsize = f.tell()\nprint(f\"{item} : {size} 字节\")\ntotal_size += size\nexcept Exception as e:\nprint(f\"无法读取文件 {item}: {e}\")\nprint(f\"所有文件总大小: {total_size} 字节\")\n解析：\n正确导入 os listdir('.')  模块并调用  获取当前目录下的所有条目（2分）。\n正确区分文件与子目录（1分）：可以使用 os.path.isfile()  或简单的扩展名判断，避免将子目录\n作为文件处理。\n以二进制读取模式（ 'rb' seek ）打开文件（2分）：符合附件7.2.3中要求使用二进制模式进行  操\n作。\n正确使用 seek(0, os.SEEK_END) os.SEEK_END  将读写指针移动到文件末尾（2分）：参数可使用  或\n2整数 。\n正确使用 tell() 获取当前指针位置（即文件字节数）并记录大小（2分）。\n正确累加所有文件大小并在最后输出总大小（1分）：使用变量累加，循环结束后打印总字节数。", "answer": "", "exam": true}, {"id": 1818, "type": "填空题", "question": "1596、请对比Python中类属性和实例属性的定义位置、所属对象、访问方式及修改影响。（10分）", "answer": "", "exam": true}, {"id": 1819, "type": "填空题", "question": "1. 定义位置：类属性定义在类内部、方法外部；实例属性定义在__init__方法或其他实例方法中，\n使用self.属性名。（2分） 2. 所属对象：类属性属于类本身；实例属性属于类的具体实例对象。\n（2分） 3. 访问方式：两者均可通过类名或对象访问，但通过对象修改类属性时会创建一个同名实\n例属性遮蔽类属性。（3分） 4. 修改影响：通过类修改类属性会影响所有实例（除非实例有遮蔽的\n实例属性）；修改实例属性仅影响当前实例。（3分） 总分：10分\n解析：考核知识点：类属性与实例属性的区别 评分标准： 1. 定义位置：2分，准确描述两者定义位\n置 2. 所属对象：2分，正确指出属性所属对象 3. 访问方式：3分，完整说明访问方式及遮蔽现象", "answer": "", "exam": true}, {"id": 1820, "type": "填空题", "question": "4. 修改影响：3分，清晰解释修改对类和实例的影响", "answer": "", "exam": true}, {"id": 1821, "type": "填空题", "question": "1597、说明Python中方法重写的概念，如何在子类中调用父类被重写的方法，以及多继承中的方法解\n析顺序（MRO）。（10分）", "answer": "", "exam": true}, {"id": 1822, "type": "填空题", "question": "1. 方法重写：子类重新定义父类中同名同参数的方法，实现子类特有功能。（2分） 2. 调用父类方\n法：使用super().方法名(...)或父类名.方法名(self,...)。（3分） 3. MRO定义：多继承中方法搜\n索的顺序，采用C3线性化算法。（2分） 4. MRO示例：如class C(A,B)，MRO为C→A→B→object。\n（3分） 总分：10分\n解析：考核知识点：方法重写、super()函数、MRO 评分标准： 1. 方法重写：2分，正确定义方法重\n写 2. 调用父类方法：3分，准确列出两种调用方式 3. MRO定义：2分，正确说明MRO及算法 4. MRO\n示例：3分，给出正确的多继承MRO示例", "answer": "", "exam": true}, {"id": 1823, "type": "填空题", "question": "1598、解释Python中__init__和__del__方法的作用、定义方式及调用时机。（10分）", "answer": "", "exam": true}, {"id": 1824, "type": "填空题", "question": "1. __init__作用：初始化实例属性，是类的构造方法。（2分） 2. __init__定义与调用：定义为\ndef __init__(self,...):...；创建对象时自动调用。（3分） 3. __del__作用：对象销毁前执行清\n理操作，是析构方法。（2分） 4. __del__定义与调用：定义为def __del__(self):...；对象被垃\n圾回收时自动调用。（3分） 总分：10分\n解析：考核知识点：构造方法与析构方法 评分标准： 1. __init__作用：2分，正确说明初始化属性\n的功能 2. __init__定义与调用：3分，准确写出定义格式及调用时机 3. __del__作用：2分，正确\n描述清理资源的作用 4. __del__定义与调用：3分，准确写出定义格式及调用时机", "answer": "", "exam": true}, {"id": 1825, "type": "填空题", "question": "1599、解释Python中多态的概念、实现方式，以及运算符重载的含义，并举例说明__add__方法的重\n载。（10分）", "answer": "", "exam": true}, {"id": 1826, "type": "填空题", "question": "1. 多态：同一接口（方法名）可作用于不同类型对象，实现不同行为。（2分） 2. 实现方式：通过\n继承重写方法或鸭子类型（检查对象是否有所需方法）。（3分） 3. 运算符重载：重写内置运算符\n方法（如__add__），使运算符支持自定义类对象。（2分） 4. __add__示例：定义Vector类的\n__add__方法，实现向量加法：def __add__(self,other):return Vector(self.x+other.x,self.\ny+other.y)。（3分） 总分：10分\n解析：考核知识点：多态、运算符重载 评分标准： 1. 多态：2分，正确定义多态概念 2. 实现方\n式：3分，准确列出两种实现方式 3. 运算符重载：2分，正确说明其含义 4. __add__示例：3分，给\n出正确的运算符重载示例", "answer": "", "exam": true}, {"id": 1827, "type": "填空题", "question": "1600、设计一个Dog类；包含属性name(名字)、age(年龄)、color(颜色)；构造方法接收三个参数；\n实现bark()方法打印\"汪汪汪!\"；实现info()方法返回\"名字:XXX, 年龄:XX, 颜色:XXX\"\ndef __init__(self, name, age, color):\nself.name = name\nself.age = age\nself.color = color\ndef bark(self):\nprint(\"汪汪汪!\")\ndef info(self):\nreturn f\"名字:{self.name}, 年龄:{self.age}, 颜色:{self.color}\"\n解析：本题考察类的基础概念。首先定义Dog类,在构造方法__init__中接收name、age、color三个参\n数并赋值给实例属性。bark()方法使用print输出字符串,info()方法使用f-string格式化字符串返回\n包含三个属性信息的字符串。注意self关键字的使用,它代表类的实例对象。", "answer": "class Dog:", "exam": true}, {"id": 1828, "type": "填空题", "question": "1601、设计一个Rectangle类；包含属性width(宽)、height(高)；构造方法接收两个参数；实现\narea()方法返回面积(宽×高)；实现perimeter()方法返回周长(2×(宽+高))\ndef __init__(self, width, height):\nself.width = width\nself.height = height\ndef area(self):\nreturn self.width * self.height\ndef perimeter(self):\nreturn 2 * (self.width + self.height)\n解析：本题考察类中数学运算的实现。在构造方法中接收width和height两个参数并赋值。area()方\n法根据矩形面积公式\"宽×高\"计算并返回结果。perimeter()方法根据矩形周长公式\"2×(宽+高)\"计\n算并返回结果。注意运算符优先级,周长计算需要使用括号。", "answer": "class Rectangle:", "exam": true}, {"id": 1829, "type": "填空题", "question": "1602、设计一个Student类；包含属性name(姓名)、score(成绩)；构造方法接收两个参数；实现\nget_grade()方法(>=90返回\"优秀\",>=60返回\"及格\",<60返回\"不及格\")；实现is_pass()方法(>=60返\n回True,否则返回False)\ndef __init__(self, name, score):\nself.name = name\nself.score = score\ndef get_grade(self):\nif self.score >= 90:\nreturn \"优秀\"\nelif self.score >= 60:\nreturn \"及格\"\nelse:\nreturn \"不及格\"\ndef is_pass(self):\nreturn self.score >= 60\n解析：本题考察条件判断语句在类方法中的应用。构造方法接收name和score两个参数。get_grade()\n方法使用if-elif-else结构,从上到下依次判断成绩范围,注意判断顺序必须从高分到低分。\nis_pass()方法直接返回布尔表达式self.score >= 60的结果,简洁高效。", "answer": "class Student:", "exam": true}, {"id": 1830, "type": "填空题", "question": "1603、导入math模块；设计一个Circle类；包含属性radius(半径)；构造方法接收半径参数；实现\narea()方法返回面积(π×半径²)；实现perimeter()方法返回周长(2×π×半径)\nclass Circle:\ndef __init__(self, radius):\nself.radius = radius\ndef area(self):\nreturn math.pi * self.radius ** 2\ndef perimeter(self):\nreturn 2 * math.pi * self.radius\n解析：本题考察模块导入和math模块的使用。首先使用import math导入数学模块。在构造方法中接\n收radius参数并赋值。area()方法使用math.pi获取圆周率π,使用运算符计算半径的平方。\nperimeter()方法使用公式2πr计算周长。注意math.pi是常量,不需要括号。", "answer": "import math", "exam": true}, {"id": 1831, "type": "选择题", "question": "1604、以下关于Python多态的描述,正确的是?\nA、多态是指不同类的对象调用相同方法时,表现出不同行为\nB、多态只能通过继承实现\nC、多态要求子类方法名称必须与父类不同\nD、多态在Python中无法实现\n解析：选项A正确,多态的核心是同一方法调用在不同对象上有不同行为;选项B错误,多态也可以通过\n鸭子类型实现,无需继承;选项C错误,多态要求子类方法名称与父类相同(重写);选项D错误,Python支\n持多态。", "answer": "A", "exam": true}, {"id": 1832, "type": "选择题", "question": "1605、以下关于面向过程和面向对象编程思想的描述,错误的是?\nA、面向过程关注解决问题的步骤和函数调用流程\nB、面向对象将问题分解为对象,通过对象协作完成任务\nC、五子棋游戏中,面向过程需要将功能封装为函数按步骤调用\nD、面向对象的程序修改扩展时,需要修改所有相关对象的代码\n解析：选项A正确,面向过程核心是步骤和函数调用;选项B正确,面向对象核心是对象协作;选项C正确,\n五子棋面向过程需按步骤调用函数;选项D错误,面向对象修改扩展时只需修改相关对象,其他对象无需\n修改,如五子棋悔棋只需修改棋盘对象。", "answer": "D", "exam": true}, {"id": 1833, "type": "选择题", "question": "1606、以下关于类和对象关系的描述,正确的是?\nA、类是对象的实例,对象是类的抽象\nB、类是对象的抽象,对象是类的实例\nC、类和对象没有直接关系\nD、一个类只能创建一个对象\n解析：选项A错误,类是抽象,对象是实例;选项B正确,类是对一类事物的抽象,对象是类的具体实例;选\n项C错误,类和对象是抽象与具体的关系;选项D错误,一个类可以创建多个对象。", "answer": "B", "exam": true}, {"id": 1834, "type": "选择题", "question": "1607、以下关于类属性和实例属性的描述,错误的是?\nA、类属性定义在类内部、方法外部\nB、实例属性属于类的对象,每个对象的实例属性独立\nC、类属性可以通过类和对象访问,但只能通过类修改\nD、实例属性可以通过类直接访问\n解析：选项A正确,类属性定义位置正确;选项B正确,实例属性属于对象,每个对象独立;选项C正确,类\n属性可通过类和对象访问,但对象修改类属性会创建实例属性;选项D错误,实例属性属于对象,只能通\n过对象访问,不能通过类直接访问。", "answer": "D", "exam": true}, {"id": 1835, "type": "选择题", "question": "1608、以下关于Python类中方法的描述,正确的是?\nA、实例方法的第一个参数必须是self,代表类本身\nB、类方法使用@classmethod装饰,第一个参数是cls,代表类\nC、静态方法使用@staticmethod装饰,必须包含self参数\nD、实例方法只能通过类调用,不能通过对象调用\n解析：选项A错误,实例方法self代表对象本身;选项B正确,类方法装饰器为@classmethod,第一个参数\n是cls代表类;选项C错误,静态方法不需要self参数;选项D错误,实例方法只能通过对象调用。", "answer": "B", "exam": true}, {"id": 1836, "type": "选择题", "question": "1609、以下关于Python私有属性和私有方法的描述,正确的是?\nA、私有属性和方法的名称以单下划线开头\nB、私有属性和方法只能在类内部访问\nC、私有属性可以通过对象直接访问\nD、私有方法可以通过类直接调用\n解析：选项A错误,私有属性和方法以双下划线开头;选项B正确,私有成员只能在类内部访问;选项C错\n误,私有属性不能通过对象直接访问;选项D错误,私有方法不能通过类直接调用。", "answer": "B", "exam": true}, {"id": 1837, "type": "选择题", "question": "1610、以下关于Python类中构造方法和析构方法的描述,错误的是?\nA、构造方法__init__()在对象创建时自动调用\nB、析构方法__del__()在对象被销毁时自动调用\nC、构造方法可以有多个参数,用于初始化实例属性\nD、析构方法必须手动调用才能执行\n解析：选项A正确,构造方法在对象创建时自动执行;选项B正确,析构方法在对象销毁时自动执行;选项\nC正确,构造方法可以接收参数初始化实例属性;选项D错误,析构方法由Python解释器自动调用,无需手\n动执行。", "answer": "D", "exam": true}, {"id": 1838, "type": "选择题", "question": "1611、在五子棋游戏开发中，若需添加悔棋功能，以下关于不同编程思想实现难度的描述正确的是？\nA、面向过程思想更简单，只需修改落子函数即可\nB、面向对象思想更简单，只需在棋盘对象中添加悔棋方法\nC、两种思想难度相同，都需要修改核心逻辑\nD、面向对象思想更复杂，需同时修改玩家、棋盘、规则系统三个对象\n解析：根据知识点，面向过程编程需按步骤调用函数，添加悔棋功能需修改整个流程（输入、判断、\n绘制等步骤）；而面向对象编程中棋盘对象保存棋盘状态，只需在棋盘对象中添加悔棋方法，玩家和\n规则系统无需修改。因此选项B正确。选项A错误，面向过程添加悔棋更复杂；选项C错误，难度不\n同；选项D错误，面向对象只需修改棋盘对象。", "answer": "B", "exam": true}, {"id": 1839, "type": "选择题", "question": "1612、以下关于Python类属性和实例属性的说法，正确的是？\nA、类属性定义在方法内部，实例属性定义在类内部、方法外部\nB、类属性属于类，所有对象共享；实例属性属于对象，每个对象独立\nC、通过对象修改类属性的值，会影响所有对象的类属性值\nD、实例属性必须通过类来访问，不能通过对象访问\n解析：类属性定义在类内部、方法外部，实例属性定义在方法内部（通常是构造方法）或通过对象动\n态添加，故选项A错误；类属性属于整个类，所有对象共享，实例属性属于对象，每个对象独立拥\n有，故选项B正确；通过对象修改类属性时，实际是给对象添加了一个同名实例属性，不会影响类属\n性本身及其他对象的类属性值，故选项C错误；实例属性可以通过对象访问，不能通过类访问（除非\n类显式定义），故选项D错误。", "answer": "B", "exam": true}, {"id": 1840, "type": "选择题", "question": "1613、以下关于Python方法的说法，错误的是？\nA、实例方法的第一个参数是self，代表调用该方法的对象\nB、类方法使用@classmethod装饰器，第一个参数是cls，代表类本身\nC、静态方法使用@staticmethod装饰器，无需额外参数\nD、类方法和静态方法都只能通过类调用，不能通过对象调用\n解析：实例方法第一个参数是self，代表对象，选项A正确；类方法用@classmethod装饰，第一个参\n数是cls，代表类，选项B正确；静态方法用@staticmethod装饰，无默认参数，选项C正确；类方法和\n静态方法既可以通过类调用，也可以通过对象调用（Python会自动传递cls或忽略参数），选项D错\n误。", "answer": "D", "exam": true}, {"id": 1841, "type": "选择题", "question": "1614、以下关于Python私有成员的说法，正确的是？\nA、私有属性和私有方法的名称以单下划线开头\nB、私有成员只能在类内部访问，外部无法直接访问\nC、通过对象名._类名__私有成员名的方式无法访问私有成员\nD、私有方法可以被类的子类继承并直接调用\n解析：Python中私有成员（属性/方法）以双下划线开头，单下划线开头是受保护成员（约定俗\n成），选项A错误；私有成员在类外部无法直接访问，只能在类内部访问，选项B正确；Python通过名\n称重整（name mangling）将私有成员名改为_类名__私有成员名，外部可以通过此方式访问（但不推\n荐），选项C错误；私有方法不能被子类直接继承和调用（名称重整后子类无法识别），选项D错误。", "answer": "B", "exam": true}, {"id": 1842, "type": "填空题", "question": "1615、类是对具有相同特征和行为的对象的____1____，对象是类的____2____。\n抽象\n；\n实例\n；\n解析：类是抽象的概念，用于描述一类事物的共同属性和方法；对象是类的具体实例，具有类定义的\n属性和方法。", "answer": "", "exam": true}, {"id": 1843, "type": "填空题", "question": "1616、在Python中，使用____1____关键字定义类，类名通常采用____2____命名法。\nclass\n；\n大驼峰\n；\n解析：Python中定义类的关键字是class，类名一般使用大驼峰命名法（如Car、Person），首字母大\n写。", "answer": "", "exam": true}, {"id": 1844, "type": "填空题", "question": "1617、类中的实例方法第一个参数默认是____1____，它代表____2____。\nself\n；\n当前对象\n；\n解析：实例方法的第一个参数必须是self，用于指代调用该方法的对象本身，通过self可以访问对象\n的属性和方法。", "answer": "", "exam": true}, {"id": 1845, "type": "填空题", "question": "1618、类属性定义在____1____内部、____2____外部，所有对象共享同一个类属性；实例属性定义在\n方法内部，每个对象有独立的实例属性。\n类\n；\n方法\n；\n解析：类属性属于类本身，所有对象共享；实例属性属于对象，每个对象的实例属性相互独立。类属\n性定义在类内部方法外部，实例属性通常在__init__方法中定义。", "answer": "", "exam": true}, {"id": 1846, "type": "填空题", "question": "1619、Python中，以____1____开头的属性是私有属性，只能在____2____内部访问。\n__\n；\n类\n；\n解析：私有属性以双下划线开头，Python会对其进行名称修饰，使其只能在类内部被访问。", "answer": "", "exam": true}, {"id": 1847, "type": "填空题", "question": "1620、Python中的构造方法是____1____，用于____2____实例属性。\n__init__\n；\n初始化\n；\n解析：__init__方法是Python的构造方法，在创建对象时自动调用，用于初始化对象的实例属性。", "answer": "", "exam": true}, {"id": 1848, "type": "填空题", "question": "1621、Python中的析构方法是____1____，当对象被____2____时自动调用。\n__del__\n；\n销毁\n；\n解析：__del__方法是析构方法，当对象的引用计数为0时自动调用，用于释放资源。", "answer": "", "exam": true}, {"id": 1849, "type": "填空题", "question": "1622、类方法使用____1____装饰器定义，第一个参数是____2____，代表类本身。\n@classmethod\n；\ncls\n；\n解析：类方法由@classmethod装饰，第一个参数是cls，指向类本身，可用于访问或修改类属性。", "answer": "", "exam": true}, {"id": 1850, "type": "填空题", "question": "1623、静态方法使用____1____装饰器定义，____2____默认参数，与类和对象无关。\n@staticmethod\n；\n没有\n；\n解析：静态方法由@staticmethod装饰，没有默认参数self或cls，与类和对象无关，仅作为工具方\n法。", "answer": "", "exam": true}, {"id": 1851, "type": "填空题", "question": "1624、Python中，子类继承父类的语法是____1____，多继承时父类用____2____分隔。\nclass 子类名(父类名):\n；\n逗号\n；\n解析：单继承语法为class 子类(父类):，多继承时父类列表用逗号分隔，如class 子类(父类1, 父\n类2):。", "answer": "", "exam": true}, {"id": 1852, "type": "填空题", "question": "1625、面向对象编程的核心是将问题分解为步骤，通过函数实现每个步骤。\n解析：面向过程编程将问题分解为步骤，通过函数实现；面向对象编程的核心是抽象出对象，通过对\n象的协作解决问题。", "answer": "错误", "exam": true}, {"id": 1853, "type": "填空题", "question": "1626、一个类只能创建一个对象。\n解析：类是对象的模板，一个类可以创建多个对象，每个对象都是类的实例。", "answer": "错误", "exam": true}, {"id": 1854, "type": "填空题", "question": "1627、类属性只能通过类访问，不能通过对象访问。\n解析：类属性可以通过类访问，也可以通过对象访问，但通过对象修改类属性时，实际是给对象添加\n了一个同名实例属性，不会改变类属性本身。", "answer": "错误", "exam": true}, {"id": 1855, "type": "填空题", "question": "1628、实例属性必须在__init__方法中定义。\n解析：实例属性可以在__init__方法中定义，也可以在对象创建后动态添加（如obj.attr =\nvalue）。", "answer": "错误", "exam": true}, {"id": 1856, "type": "填空题", "question": "1629、Python中的私有属性是完全无法从外部访问的。\n解析：Python的私有属性是通过名称修饰实现的（如__attr变为_类名__attr），可以通过_类名\n__attr的方式从外部访问，但不推荐这样做。", "answer": "错误", "exam": true}, {"id": 1857, "type": "填空题", "question": "1630、调用实例方法时，self参数需要手动传递。\n解析：调用实例方法时，self参数由Python解释器自动传递，不需要手动传入，self代表调用方法的\n对象。", "answer": "错误", "exam": true}, {"id": 1858, "type": "填空题", "question": "1631、类方法可以访问实例属性。\n解析：类方法的第一个参数是cls，代表类本身，只能访问类属性，无法直接访问实例属性（除非通\n过cls创建对象）。", "answer": "错误", "exam": true}, {"id": 1859, "type": "填空题", "question": "1632、静态方法可以访问类属性。\n解析：静态方法没有默认参数self或cls，无法直接访问类属性或实例属性，除非显式传入类或对\n象。", "answer": "错误", "exam": true}, {"id": 1860, "type": "填空题", "question": "1633、子类可以继承父类的所有属性和方法。\n解析：子类可以继承父类的非私有属性和方法，私有属性和方法（以__开头）会被名称修饰，子类无\n法直接访问。", "answer": "错误", "exam": true}, {"id": 1861, "type": "填空题", "question": "1634、super()函数用于调用父类的构造方法，只能在子类的__init__方法中使用。\n解析：super()函数可以在子类的任何方法中使用，用于调用父类的同名方法，不仅限于__init__方\n法。", "answer": "错误", "exam": true}, {"id": 1862, "type": "选择题", "question": "1635、以下关于Python异常的描述，错误的是？\nA、异常是程序运行期间发生的错误或意外情况\nB、未处理的异常会导致程序立即终止\nC、异常信息包含错误行号、类型和描述\nD、所有异常都继承自Exception类\n解析：BaseException是所有异常的基类，Exception只是其子类之一，如KeyboardInterrupt直接继\n承BaseException而非Exception", "answer": "D", "exam": true}, {"id": 1863, "type": "选择题", "question": "1636、访问未定义的变量test会引发哪种异常？\nA、IndexError\nB、NameError\nC、AttributeError\nD、FileNotFoundError\n解析：NameError用于处理未定义变量的访问错误", "answer": "B", "exam": true}, {"id": 1864, "type": "选择题", "question": "1637、以下哪种方式可以捕获所有类型的异常？\nA、except ZeroDivisionError:\nB、except (TypeError, ValueError):\nC、except Exception:\nD、except:\n解析：Exception是所有内置非系统退出异常的基类，可捕获大部分异常", "answer": "C", "exam": true}, {"id": 1865, "type": "选择题", "question": "1638、try-except-else结构中，else块何时执行？\nA、总是执行\nB、发生异常时执行\nC、未发生异常时执行\nD、异常被捕获后执行\n解析：else块仅在try块无异常时执行，用于处理正常流程", "answer": "C", "exam": true}, {"id": 1866, "type": "选择题", "question": "1639、finally块的执行特点是？\nA、仅异常发生时执行\nB、仅异常未发生时执行\nC、无论是否发生异常都执行\nD、异常被捕获时执行\n解析：finally块用于资源清理，确保无论异常是否发生都会执行", "answer": "C", "exam": true}, {"id": 1867, "type": "选择题", "question": "1640、打开不存在的文件会引发哪种异常？\nA、FileNotFoundError\nB、IOError\nC、OSError\nD、EOFError\n解析：Python 3中专门用FileNotFoundError表示文件不存在错误", "answer": "A", "exam": true}, {"id": 1868, "type": "选择题", "question": "1641、以下代码执行后输出结果是？ num1 = 10 num2 = 0 try: print(num1/num2) except\nZeroDivisionError as e: print(f'Error: {e}')\nA、Error: division by zero\nB、程序崩溃\nC、0\nD、无输出\n解析：捕获ZeroDivisionError并输出异常信息", "answer": "A", "exam": true}, {"id": 1869, "type": "选择题", "question": "1642、列表索引超出范围会引发哪种异常？\nA、KeyError\nB、IndexError\nC、TypeError\nD、ValueError\n解析：IndexError用于处理序列索引超出范围的错误", "answer": "B", "exam": true}, {"id": 1870, "type": "选择题", "question": "1643、以下哪种方式可以同时捕获多种异常类型？\nA、except Exception1, Exception2:\nB、except (Exception1, Exception2):\nC、except Exception1 | Exception2:\nD、except Exception1 and Exception2:\n解析：Python中用元组形式在except后指定多个异常类型", "answer": "B", "exam": true}, {"id": 1871, "type": "选择题", "question": "1644、自定义异常类应继承哪个基类？\nA、BaseException\nB、Exception\nC、RuntimeError\nD、SystemError\n解析：自定义异常应继承Exception类，符合Python异常体系规范", "answer": "B", "exam": true}, {"id": 1872, "type": "填空题", "question": "1645、Python中所有异常的基类是______。\n解析：BaseException是所有异常类型的根类", "answer": "BaseException；", "exam": true}, {"id": 1873, "type": "填空题", "question": "1646、访问对象不存在的属性会引发______异常。\n解析：AttributeError用于处理对象属性访问错误", "answer": "AttributeError；", "exam": true}, {"id": 1874, "type": "填空题", "question": "1647、try-except结构中，______块用于放置可能引发异常的代码。\n解析：try块是异常监控的核心区域", "answer": "try；", "exam": true}, {"id": 1875, "type": "填空题", "question": "1648、使用______关键字可以主动抛出异常。\n解析：raise语句用于显式触发异常", "answer": "raise；", "exam": true}, {"id": 1876, "type": "填空题", "question": "1649、用户按下Ctrl+C中断程序会引发______异常。\n解析：KeyboardInterrupt是用户中断执行的标准异常", "answer": "KeyboardInterrupt；", "exam": true}, {"id": 1877, "type": "填空题", "question": "1650、finally块通常用于执行______操作，如关闭文件。\n解析：finally块确保资源无论异常是否发生都会被释放", "answer": "资源清理；", "exam": true}, {"id": 1878, "type": "填空题", "question": "1651、将字符串转换为整数失败会引发______异常。\n解析：ValueError用于处理类型转换时的数值无效错误", "answer": "ValueError；", "exam": true}, {"id": 1879, "type": "填空题", "question": "1652、自定义异常类MyError的定义格式为：class MyError(______): pass\n解析：自定义异常需继承Exception类", "answer": "Exception；", "exam": true}, {"id": 1880, "type": "填空题", "question": "1653、获取异常详细信息可使用______关键字，如except ZeroDivisionError as e:\n解析：as关键字用于绑定异常对象到变量", "answer": "as；", "exam": true}, {"id": 1881, "type": "填空题", "question": "1654、字典访问不存在的键会引发______异常。\n解析：KeyError专门处理字典键不存在的错误", "answer": "KeyError；", "exam": true}, {"id": 1882, "type": "填空题", "question": "1655、请简述 Python 中异常的含义。当程序运行过程中出现异常且没有进行处理时，解释器会如何\n处理？异常信息通常包含哪些内容？阅读异常信息有什么作用？\n异常是在程序运行期间发生的错误、意外或不正常情况，可能由外部环境、不正确的输入、无效操作\n或其他因素引起。\n如果程序运行过程中出现异常，并且没有对异常进行处理，解释器会采用默认方式处理异常，即终止\n程序运行，并给出相应的异常信息。\n异常信息通常包含异常代码所在的行号、异常类型和异常描述信息。\n通过阅读异常信息，可以了解程序出错的位置、错误类型和错误原因，从而采取适当措施解决或处理\n异常，使程序更加健壮和可靠。\n解析：\n评分细分细则：10分\n能说明异常是在程序运行期间发生的错误、意外或不正常情况，得2分。\n能说明异常可能由不正确输入、无效操作、外部环境等因素引起，得2分。\n能说明未处理异常时解释器会终止程序并给出异常信息，得2分。\n能指出异常信息通常包含行号、异常类型、异常描述信息，得2分。\n能说明阅读异常信息有助于定位错误原因并提高程序健壮性，得2分。", "answer": "", "exam": true}, {"id": 1883, "type": "填空题", "question": "1656、请简述 Python 中 NameError、IndexError、AttributeError 和 FileNotFoundError 四种异\n常分别在什么情况下产生，并各举一个简单说明。\nNameError 是程序中使用了未定义的变量、函数名、类名或未导入模块时引发的异常，例如直接执\n行 print(test)，而变量 test 未定义。\nIndexError 是使用超出序列范围的索引时引发的异常，例如空列表 num_list = [] 中访问\nnum_list[0]。\nAttributeError 是使用对象访问不存在的属性或调用不存在的方法时引发的异常，例如对象 car 没\n有 name 属性，却执行 print(car.name)。\nFileNotFoundError 是未找到指定文件或目录时引发的异常，例如执行 open(\"test.txt\")，但本地\n不存在该文件。\n解析：\n评分细分细则：10分\n正确说明 NameError 的产生原因，并能举出未定义变量等情况，得2分。\n正确说明 IndexError 的产生原因，并能举出索引超出序列范围的情况，得2分。\n正确说明 AttributeError 的产生原因，并能举出访问不存在属性或方法的情况，得2分。\n正确说明 FileNotFoundError 的产生原因，并能举出文件不存在的情况，得2分。\n表述清晰，能体现这些异常都属于程序运行时可能出现的异常类型，得2分。", "answer": "", "exam": true}, {"id": 1884, "type": "填空题", "question": "1657、请简述 try-except 语句的基本执行流程，并说明 else 子句和 finally 子句分别在什么情\n况下执行。说明 except 异常类 as 异常信息 中 as 的作用。\ntry-except 语句用于捕获和处理程序可能发生的异常，避免程序意外终止。程序会先执行 try 子句\n中的代码。\n如果 try 子句没有发生异常，则忽略 except 子句，继续向下执行；如果存在 else 子句，则执行\nelse 中的代码。\n如果 try 子句中发生异常，则会忽略 try 中剩余代码，转而查找匹配的 except 子句；如果异常类\n型匹配，就执行对应的异常处理代码。\nfinally 子句无论是否发生异常都会执行，常用于关闭文件、关闭网络连接、关闭数据库连接等资源\n清理操作。\nas 关键字用于把捕获到的异常信息赋值给一个变量，便于输出或查看异常原因。\n解析：\n评分细分细则：10分\n能说明 try-except 用于捕获和处理异常，避免程序意外终止，得2分。\n能说明 try 中无异常时，except 不执行，else 会执行，得2分。\n能说明 try 中发生异常后，会跳过 try 剩余代码并进入匹配的 except，得2分。\n能说明 finally 无论是否发生异常都会执行，并常用于资源清理，得2分。\n能说明 as 用于获取并保存异常信息，得2分。", "answer": "", "exam": true}, {"id": 1885, "type": "填空题", "question": "1658、请简述 raise 语句和 assert 语句的作用，并说明 Python 中如何自定义异常类。要求说明\nraise 异常类、raise 异常类对象 和不带参数的 raise 的区别。\nraise 语句用于由开发人员主动引发异常。\nraise 异常类 会抛出指定异常类对应的异常，执行时会隐式创建该异常类的对象，例如 raise\nIndexError。\nraise 异常类对象 会直接抛出指定异常类对象，例如 raise IndexError(\"索引超出范围\")，可以携\n带具体异常信息。\n不带参数的 raise 用于重新抛出刚刚发生的异常，通常写在 except 子句中。\nassert 语句又称断言语句，用于检查某个条件是否满足；当表达式为 False 时，会抛出\nAssertionError 异常，当表达式为 True 时不做任何操作。\n自定义异常类时，只需要创建一个继承 Exception 类或其子类的类，类名一般以 Error 结尾。\n解析：\n评分细分细则：10分\n能说明 raise 用于主动抛出异常，得2分。\n能说明 raise 异常类 会隐式创建异常对象并抛出异常，得2分。\n能说明 raise 异常类对象 可直接抛出异常对象，并可携带异常信息，得2分。\n能说明不带参数的 raise 用于重新抛出刚刚发生的异常，得1分。\n能说明 assert 表达式为 False 时会抛出 AssertionError，表达式为 True 时不做操作，得2分。\n能说明自定义异常类需要继承 Exception 或其子类，且类名一般以 Error 结尾，得1分。", "answer": "", "exam": true}, {"id": 1886, "type": "填空题", "question": "1659、请设计一个 Python 程序，完成以下需求：\n接收用户输入的一个运算式，格式为：数字 运算符 数字，例如 10 / 2；\n将输入内容按空格拆分，分别得到第一个数、运算符和第二个数；\n定义函数 calculate(operation, num1, num2) 实现加、减、乘、除四种运算；\n使用 try-except-else 结构捕获除数为 0 时产生的异常；\n如果没有异常，则输出运算结果，格式为：运算结果：XXX；\n如果发生除零异常，则输出：出错了，原因：XXX。\ndef calculate(operation, num1, num2):\nif operation == \"+\":\nreturn num1 + num2\nelif operation == \"-\":\nreturn num1 - num2\nelif operation == \"*\"\nreturn num1 * num2\nelif operation == \"/\":\nreturn num1 / num2\nelse:\nreturn \"无效的运算符\"\nexpression = input(\"请输入运算式（例如 2 + 3）：\")\nexpression_list = expression.split()\nnum1 = int(expression_list[0])\noperation = expression_list[1]\nnum2 = int(expression_list[2])\ntry:\nresult = calculate(operation, num1, num2)\nexcept ZeroDivisionError as error:\nprint(\"出错了，原因：\", error)\nelse:\nprint(\"运算结果：\", result)\n解析：\n评分细分细则：10分\n正确接收并拆分用户输入的运算式，能得到两个数字和运算符，得2分。\n正确定义 calculate() 函数，并能处理 +、-、*、/ 四种运算，得2分。\n除法运算中能正常触发除零异常，代码结构合理，得2分。\n正确使用 try-except 捕获 ZeroDivisionError，并使用 as error 获取异常信息，得2分。\n正确使用 else 子句，在没有异常时输出运算结果，输出格式基本正确，得2分。", "answer": "", "exam": true}, {"id": 1887, "type": "填空题", "question": "1660、请设计一个 Python 程序，完成以下需求：\n创建列表 num_list = [10, 20, 30, 40, 50]；\n接收用户输入的一个整数索引 index；\n使用该索引访问列表中的元素；\n使用 try-except-else 结构捕获索引超出范围时产生的异常；\n如果索引合法，则输出：对应元素为：XXX；\n如果索引超出范围，则输出：索引超出范围，原因：XXX。\nnum_list = [10, 20, 30, 40, 50]\nindex = int(input(\"请输入索引：\"))\ntry:\nvalue = num_list[index]\nexcept IndexError as error:\nprint(\"索引超出范围，原因：\", error)\nelse:\nprint(\"对应元素为：\", value)\n解析：\n评分细分细则：10分\n正确创建题目要求的列表 num_list，得2分。\n正确接收用户输入的索引，并转换为整数，得2分。\n将可能发生异常的列表索引访问语句放入 try 子句中，得2分。\n正确使用 except IndexError as error 捕获索引越界异常并输出原因，得2分。\n正确使用 else 子句，在无异常时输出对应元素，得2分。", "answer": "", "exam": true}, {"id": 1888, "type": "填空题", "question": "1661、请设计一个 Python 程序，完成以下需求：\n以只读方式打开文件 test.txt，假设该文件存在；\n在 try 子句中尝试向该文件写入字符串 \"人生苦短，我用Python\"；\n由于文件以只读方式打开，写入操作可能产生异常；\n使用 except Exception as error 捕获异常并输出：写入文件失败 XXX；\n无论是否发生异常，都要在 finally 子句中关闭文件，并输出：文件已关闭。\nfile = open(\"test.txt\", mode=\"r\", encoding=\"utf-8\")\ntry:\nfile.write(\"人生苦短，我用Python\")\nexcept Exception as error:\nprint(\"写入文件失败\", error)\nfinally:\nfile.close()\nprint(\"文件已关闭\")\n解析：\n评分细分细则：10分\n正确使用 open() 以只读方式打开 test.txt 文件，得2分。\n正确将可能发生异常的写入操作放入 try 子句，得2分。\n正确使用 except Exception as error 捕获异常并输出异常信息，得2分。\n正确使用 finally 子句，体现无论是否异常都会执行，得2分。\n在 finally 中正确调用 file.close() 关闭文件，并输出提示信息，得2分。", "answer": "", "exam": true}, {"id": 1889, "type": "填空题", "question": "1662、请设计一个 Python 程序，完成以下需求：\n自定义异常类 ShortInputError，该类继承自 Exception；\n在异常类中定义 __init__(self, length, atleast) 方法，分别保存当前输入长度和最小要求长\n度；\n接收用户输入的密码；\n如果密码长度小于 3，则使用 raise 抛出 ShortInputError 异常；\n使用 try-except-else 结构处理该异常；\n如果密码长度不足，则输出：ShortInputError：输入的长度是X，长度至少应是Y；\n如果密码长度符合要求，则输出：密码设置成功。\nclass ShortInputError(Exception):\ndef __init__(self, length, atleast):\nself.length = length\nself.atleast = atleast\ntry:\ntext = input(\"请输入密码：\")\nif len(text) < 3:\nraise ShortInputError(len(text), 3)\nexcept ShortInputError as result:\nprint(\"ShortInputError：输入的长度是%d，长度至少应是%d\" %\n(result.length, result.atleast))\nelse:\nprint(\"密码设置成功\")\n解析：\n评分细分细则：10分\n正确自定义 ShortInputError 类，并继承 Exception，得2分。\n正确定义 __init__() 方法，并保存 length 和 atleast 两个属性，得2分。\n正确接收用户输入，并判断输入长度是否小于 3，得2分。\n正确使用 raise ShortInputError(len(text), 3) 主动抛出自定义异常，得2分。\n正确使用 except ShortInputError as result 捕获异常，并使用 else 输出成功信息，得2分。", "answer": "", "exam": true}, {"id": 1890, "type": "填空题", "question": "1663、Python程序运行出错时产生的每个异常类型都对应一个类，程序运行时出现的异常大多继承自\nException类，Exception类又继承了BaseException基类。\n解析：根据附件内容，Python程序运行出错时产生的每个异常类型都对应一个类，程序运行时出现的\n异常大多继承自Exception类，Exception类又继承了BaseException基类。", "answer": "正确", "exam": true}, {"id": 1891, "type": "填空题", "question": "1664、BaseException类派生了四个子类，分别是Exception、KeyboardInterrupt、GeneratorExit和\nSystemExit，其中Exception是所有内置的、非系统退出的异常的基类。\n解析：附件中明确说明BaseException类派生了四个子类，分别是Exception、KeyboardInterrupt、\nGeneratorExit和SystemExit，其中Exception是所有内置的、非系统退出的异常的基类。", "answer": "正确", "exam": true}, {"id": 1892, "type": "填空题", "question": "1665、NameError异常只会在使用变量之前没有对变量进行赋值时发生。\n解析：附件指出NameError异常通常发生在三种情况：1.使用变量前未赋值；2.使用未导入的模块或\n未定义的函数名/类名；3.函数内部访问未赋值的全局变量，并非只会在第一种情况发生。", "answer": "错误", "exam": true}, {"id": 1893, "type": "填空题", "question": "1666、当使用索引访问列表、元组、字符串这几种序列类型的元素时，如果指定的索引超出了序列的\n范围，就会导致程序引发AttributeError异常。\n解析：附件说明当使用索引访问序列类型元素时，索引超出范围会引发IndexError异常，而非\nAttributeError异常。AttributeError是使用对象访问不存在的属性或者调用不存在的方法时引发的\n异常。", "answer": "错误", "exam": true}, {"id": 1894, "type": "填空题", "question": "1667、try-except语句中，若try子句中的代码出现异常，则会继续执行try子句的剩余代码，再执行\nexcept子句中的代码。\n解析：try-except语句的执行过程为：若try子句中的代码出现异常，则会忽略try子句的剩余代码，\n转而执行except子句。", "answer": "错误", "exam": true}, {"id": 1895, "type": "填空题", "question": "1668、捕获多个异常只能通过多个except子句完成。\n解析：附件提到捕获多个异常的实现方式比较多样，既可以通过多个except子句完成，也可以通过一\n个except子句完成（以元组形式指定多个异常类）。", "answer": "错误", "exam": true}, {"id": 1896, "type": "填空题", "question": "1669、在try-except-else语句中，无论程序是否成功捕获处理了异常，else子句中的代码都会被执\n行。\n解析：附件指出在try-except-else语句中，只有程序在没有异常发生时，else子句中的代码才会执\n行。", "answer": "错误", "exam": true}, {"id": 1897, "type": "填空题", "question": "1670、try-except-finally语句中，无论try子句的代码有没有出现异常，都会执行finally子句的代\n码。\n解析：根据附件内容，try-except-finally语句中，无论try子句的代码有没有出现异常，都会执行\nfinally子句的代码。", "answer": "正确", "exam": true}, {"id": 1898, "type": "填空题", "question": "1671、捕获程序中所有的异常，只能将except之后的异常类设置为Exception。\n解析：附件说明捕获程序中所有的异常，可以将except之后的异常类设置为Exception，或者省略不\n写任何异常类。", "answer": "错误", "exam": true}, {"id": 1899, "type": "填空题", "question": "1672、请简述Python中异常的概念以及异常信息包含的内容。\n无效的操作或其他因素引起。异常信息通常包含异常代码所在行号、异常的类型和异常的描述信息。\n解析：本题考察对异常概念和异常信息的理解，需准确阐述异常的定义和异常信息包含的三个方面内\n容。", "answer": "异常是在程序运行期间发生的错误、意外或不正常情况，可能由外部环境、不正确的输入、", "exam": true}, {"id": 1900, "type": "填空题", "question": "1673、请简述try-except语句的执行过程。\n常，则会忽略except子句而继续向下执行；若try子句中的代码出现异常，则会忽略try子句的剩余代\n码，转而执行except子句：若try子句出现的异常类型与except子句中指定的异常类型匹配，则执行\nexcept子句中的代码，否则按默认的方式终止程序的运行。\n解析：本题考察try-except语句的执行流程，需准确描述无异常和有异常时的执行路径。", "answer": "try-except语句的执行过程为：优先执行try子句中的代码。若try子句中的代码没有出现异", "exam": true}, {"id": 1901, "type": "填空题", "question": "1674、请说明try-except-else语句中else子句的作用，并举例说明。\n没有异常发生时，else子句中的代码才会执行。例如： first_num = int(input(\"请输入被除\n数：\")) second_num = int(input(\"请输入除数：\")) try: res = first_num / second_num\nexcept ZeroDivisionError as error: print('异常原因：', error) else: print(res) 当除数不\n为0时，执行else子句中的print(res)语句。\n解析：本题考察try-except-else语句中else子句的作用，需说明其执行条件并结合示例代码解释。", "answer": "try-except-else语句中，else子句用于处理与异常处理相关的正常流程代码，只有当程序在", "exam": true}, {"id": 1902, "type": "填空题", "question": "1675、请简述finally子句的特性及其常见用途，并举例说明。\n行。常见用途是用于预设资源的清理操作，比如关闭文件、关闭网络连接、关闭数据库连接等。例\n如： file = open('test.txt', mode='r', encoding='utf-8') try: file.write(\"人生苦短，我用\nPython\") except Exception as err: print('异常原因：', err) finally: file.close() 无论try\n子句是否出现异常，finally子句中的file.close()语句都会执行，确保文件被关闭。\n解析：本题考察finally子句的特性和用途，需准确描述其特性、常见用途并结合示例代码说明。", "answer": "finally子句的特性是无论try子句监控的代码是否出现异常，finally子句中的代码都会被执", "exam": true}, {"id": 1903, "type": "选择题", "question": "1676、在Python数据分析领域中，基于NumPy开发且专注于数据处理和分析的库是？\nA、SciPy\nB、pandas\nC、Matplotlib\nD、scikit-learn\n解析：本题考察知识点为数据分析领域的常用库。教材中提到pandas是基于NumPy开发的库，专注于\n数据处理、数据分析和数据可视化，提供灵活的数据结构和丰富的函数。SciPy主要用于科学计算，\nMatplotlib用于数据可视化，scikit-learn用于机器学习，因此正确答案是B。", "answer": "B", "exam": true}, {"id": 1904, "type": "选择题", "question": "1677、以下哪个库可以用于提取PDF文档中的信息？\nA、jieba\nB、python-docx\nC、PyPDF2\nD、NLTK\n解析：本题考察知识点为文本处理领域的常用库。根据教材内容，PyPDF2是用于处理PDF文档的\nPython库，支持PDF文档信息提取、拆分合并等功能。jieba用于中文分词，python-docx用于处理\nWord文档，NLTK用于自然语言处理，因此正确答案是C。", "answer": "C", "exam": true}, {"id": 1905, "type": "选择题", "question": "1678、以下哪个Python库是基于ECharts的交互式数据可视化库？\nA、Matplotlib\nB、seaborn\nC、pyecharts\nD、NumPy\n解析：本题考察知识点为数据可视化领域的常用库。教材中提到pyecharts是基于ECharts\nJavaScript库的Python数据可视化库，用于生成交互式图表。Matplotlib是基础绘图库，seaborn是\n基于Matplotlib的高级封装库，NumPy用于科学计算，因此正确答案是C。", "answer": "C", "exam": true}, {"id": 1906, "type": "选择题", "question": "1679、以下哪个深度学习框架具有动态计算图的特点？\nA、TensorFlow\nB、PyTorch\nC、scikit-learn\nD、SciPy\n解析：本题考察知识点为机器学习领域的常用库。根据教材内容，PyTorch具有动态计算图的特点，\n使得模型开发和调试更加直观灵活。TensorFlow使用静态计算图，scikit-learn是传统机器学习库，\nSciPy用于科学计算，因此正确答案是B。", "answer": "B", "exam": true}, {"id": 1907, "type": "选择题", "question": "1680、以下哪个库是Python与Qt框架的融合？\nA、PyQt5\nB、wxPython\nC、PyGObject\nD、Tkinter\n解析：本题考察知识点为图形用户界面领域的常用库。教材中提到PyQt5是Python与Qt框架的融合，\n提供Qt开发框架的Python接口。wxPython基于wxWidgets，PyGObject绑定GTK+3，Tkinter是Python内\n置GUI库，因此正确答案是A。", "answer": "A", "exam": true}, {"id": 1908, "type": "选择题", "question": "1681、以下哪个Python库适合处理需要JavaScript渲染的动态网页内容？\nA、Requests\nB、Selenium\nC、Beautiful Soup\nD、re\n解析：本题考察知识点为Python计算生态中的网络爬虫库功能。根据第10章内容，Selenium库用于处\n理需要JavaScript渲染或动态内容的网页，通过模拟真实浏览器环境加载执行JavaScript代码，能爬\n取动态生成的内容；Requests主要处理HTTP请求，Beautiful Soup用于解析HTML/XML文档，re用于正\n则表达式处理，均不支持JavaScript渲染。因此正确答案是B。", "answer": "B", "exam": true}, {"id": 1909, "type": "选择题", "question": "1682、要实现中文文本的分词功能，以下哪个Python库是最合适的选择？\nA、jieba\nB、NLTK\nC、PyPDF2\nD、python-docx\n解析：本题考察知识点为Python计算生态中的文本处理库功能。根据第10章内容，jieba是优秀的\nPython中文分词库，支持中文文本分词、自定义词典等功能；NLTK主要用于自然语言处理但更适用于\n英文，PyPDF2用于处理PDF文档，python-docx用于处理Word文档。因此正确答案是A。", "answer": "A", "exam": true}, {"id": 1910, "type": "选择题", "question": "1683、以下哪个Python Web开发库采用了MTV（Model-Template-View）模式，并且内置了强大的管理\n站点？\nA、Flask\nB、Django\nC、Tornado\nD、Twisted\n解析：考察知识点：Python计算生态中的Web开发库特性。Django采用了MTV模式，提供了URL路由映\n射、请求上下文和基于模板的页面渲染技术，并且内置了强大的管理站点，适用于快速搭建高性能的\n企业级内容类网站。其他选项中，Flask是轻量级Web框架，Tornado适用于高并发处理，Twisted是事\n件驱动的网络框架。", "answer": "B", "exam": true}, {"id": 1911, "type": "选择题", "question": "1684、某团队需开发分布式网络爬虫系统，要求支持数据库后端、消息队列、优先级管理，且适用于\n中小规模爬取任务，以下哪个库最符合需求？\nA、Scrapy\nB、pyspider\nC、Selenium\nD、Beautiful Soup\n解析：考察知识点：Python计算生态中网络爬虫库的功能特性对比。根据教材10.1节内容，pyspider\n支持数据库后端、消息队列、优先级和分布式架构，适用于中小规模爬取任务；Scrapy适用于大规模\n可扩展爬虫；Selenium用于动态网页渲染；Beautiful Soup用于HTML/XML解析。因此正确答案为B。", "answer": "B", "exam": true}, {"id": 1912, "type": "选择题", "question": "1685、在Python中，以下哪个语句用于导入整个模块？\nA、from module import *\nB、import module\nC、import module as m\nD、from module import func\n解析：考察知识点：Python模块的导入方式。import module导入整个模块，其他选项为导入模块部\n分内容或重命名模块。", "answer": "B", "exam": true}, {"id": 1913, "type": "填空题", "question": "1686、基于NumPy开发，专注于数据处理、数据分析和数据可视化的Python库是______。\npandas\n；\n解析：考察知识点为Python计算生态中数据分析领域的常用库。pandas提供了灵活的数据结构和丰富\n的函数，可高效处理各种类型的数据，并支持统计分析和可视化工具。", "answer": "", "exam": true}, {"id": 1914, "type": "填空题", "question": "1687、由谷歌开发，具备分布式计算、模型部署等功能的开源深度学习框架是______。\nTensorFlow\n；\n解析：考察知识点为Python计算生态中机器学习领域的常用库。TensorFlow是谷歌开发的开源深度学\n习框架，支持多种操作系统和硬件平台，适用于构建、训练和部署机器学习模型。", "answer": "", "exam": true}, {"id": 1915, "type": "填空题", "question": "1688、采用MTV模式，内置强大管理站点，适用于快速搭建企业级内容类网站的Web框架是______。\nDjango\n；\n解析：考察知识点为Python计算生态中Web开发领域的常用库。Django是功能完善的免费开源Web框\n架，提供URL路由映射、请求上下文等技术，支持快速开发高性能网站。", "answer": "", "exam": true}, {"id": 1916, "type": "填空题", "question": "1689、Python中用于处理时间相关功能的内置库是______。\ntime\n；\n解析：考察知识点为Python常用内置库的功能。time库可实现获取当前时间、时间格式化、程序延时\n等处理时间的功能。", "answer": "", "exam": true}, {"id": 1917, "type": "填空题", "question": "1690、用于生成随机数的Python内置库是______。\nrandom\n；\n解析：考察知识点为Python常用内置库的功能。random库提供了生成随机整数、随机浮点数、随机选\n择序列元素等生成随机数的功能。", "answer": "", "exam": true}, {"id": 1918, "type": "填空题", "question": "1691、用于中文文本分词的Python第三方库是______。\njieba\n；\n解析：考察知识点为Python常用第三方库的功能。jieba库支持中文分词，还可自定义词典、进行词\n性标注和关键词提取。", "answer": "", "exam": true}, {"id": 1919, "type": "填空题", "question": "1692、可用于制作小游戏的Python第三方库是______。\nPygame\n；\n解析：考察知识点为Python常用第三方库的功能。Pygame库提供了图形渲染、声音播放、事件处理等\n功能，适用于开发2D小游戏。", "answer": "", "exam": true}, {"id": 1920, "type": "填空题", "question": "1693、在Python中，将函数、类等代码组织成独立文件形成的可复用单元称为______。\n模块\n；\n解析：考察知识点为Python模块的概念。模块是Python中代码组织的基本单元，通过将相关代码放在\n一个.py文件中形成，可通过import语句导入使用。", "answer": "", "exam": true}, {"id": 1921, "type": "填空题", "question": "1694、包含__init__.py文件的目录在Python中被称为______。\n包\n；\n解析：考察知识点为Python包的概念。包是包含__init__.py文件的目录，用于组织多个相关模块，\n可通过import语句导入包或包中的模块。", "answer": "", "exam": true}, {"id": 1922, "type": "填空题", "question": "1695、Python计算生态涵盖众多领域，其中用于从网络上抓取信息的领域是______。\n网络爬虫\n；\n解析：考察知识点为Python计算生态的应用领域。网络爬虫领域通过Python库（如Requests、Scrapy\n等）实现自动从网络上抓取信息的功能。", "answer": "", "exam": true}, {"id": 1923, "type": "填空题", "question": "1696、Selenium库可以模拟真实浏览器环境，处理需要JavaScript渲染的动态网页内容\n解析：考察知识点：Python计算生态中的网络爬虫领域常用库。Selenium库的核心功能是模拟浏览器\n环境，能够加载并执行JavaScript代码，从而爬取动态生成的网页内容，因此该表述正确。", "answer": "正确", "exam": true}, {"id": 1924, "type": "填空题", "question": "1697、NumPy库提供的ndarray对象主要用于存储和处理大型矩阵，是科学计算的基础工具\n解析：考察知识点：数据分析领域常用库中的NumPy。NumPy的核心是ndarray（N维数组对象），支持\n高效的大型矩阵运算和科学计算功能，是数据分析领域的基础库之一，表述正确。", "answer": "正确", "exam": true}, {"id": 1925, "type": "填空题", "question": "1698、jieba库仅支持中文分词功能，无法实现词性标注或关键词提取\n解析：考察知识点：文本处理领域常用库中的jieba。根据内容，jieba库不仅支持中文分词，还可以\n自定义词典，同时具备词性标注、关键词提取、文本分类等功能，因此表述错误。", "answer": "错误", "exam": true}, {"id": 1926, "type": "填空题", "question": "1699、PyTorch的特点是采用动态计算图，相比TensorFlow更便于模型开发和调试\n解析：考察知识点：机器学习领域常用库中的PyTorch。内容提到PyTorch具有动态计算图的特点，使\n得模型的开发和调试更加直观和灵活，表述正确。", "answer": "正确", "exam": true}, {"id": 1927, "type": "填空题", "question": "1700、PyQt5是Python与Qt框架的融合，提供了超过300个类和近6000个函数/方法\n解析：考察知识点：图形用户界面领域常用库中的PyQt5。内容明确说明PyQt5拥有超过300个类、将\n近6000个函数和方法，可开发功能强大的图形用户界面，表述正确。", "answer": "正确", "exam": true}, {"id": 1928, "type": "填空题", "question": "1701、pandas是基于NumPy开发的库，专注于数据处理、分析和可视化，支持多种数据格式输入输出\n解析：考察知识点：数据分析领域常用库中的pandas。内容明确pandas基于NumPy，提供灵活的数据\n结构和函数，支持统计分析、可视化及多格式数据读写，表述正确。", "answer": "正确", "exam": true}, {"id": 1929, "type": "填空题", "question": "1702、PyPDF2仅支持PDF文档的内容读取，无法实现文档加密或解密功能\n解析：考察知识点：文本处理领域常用库中的PyPDF2。内容说明PyPDF2支持PDF文档信息提取、页面\n拆分与合并、页面裁剪、内容加密与解密等功能，表述错误。", "answer": "错误", "exam": true}, {"id": 1930, "type": "填空题", "question": "1703、Matplotlib是基于NumPy开发的绘图库，允许用户定制图表的每个细节\n解析：考察知识点：数据可视化领域常用库中的Matplotlib。内容指出Matplotlib提供丰富的绘图功\n能，支持创建各种图表并允许用户定制细节，表述正确。", "answer": "正确", "exam": true}, {"id": 1931, "type": "填空题", "question": "1704、scikit-learn建立在NumPy、SciPy和Matplotlib基础上，提供监督学习和无监督学习算法\n解析：考察知识点：机器学习领域常用库中的scikit-learn。内容明确scikit-learn基于NumPy、\nSciPy和Matplotlib，提供分类、回归、聚类等多种机器学习算法，表述正确。", "answer": "正确", "exam": true}, {"id": 1932, "type": "填空题", "question": "1705、Python计算生态仅涵盖数据分析、机器学习两个领域，不涉及游戏开发或图形艺术\n解析：考察知识点：Python计算生态概览。内容明确Python计算生态涵盖网络爬虫、数据分析、文本\n处理、数据可视化、机器学习、图形用户界面、Web开发、网络应用开发、游戏开发、图形艺术、图\n像处理等多个领域，表述错误。", "answer": "错误", "exam": true}, {"id": 1933, "type": "填空题", "question": "1706、简述Python计算生态的定义，并列举3个其覆盖的应用领域及每个领域的至少1个常用库。\nPython计算生态是指由Python语言及其周边生态构成的一系列工具、框架、库和应用，用于解决各种\n计算问题和满足开发需求。覆盖的应用领域及常用库示例：（1）网络爬虫领域：Requests库；（2）\n数据分析领域：NumPy库；（3）文本处理领域：jieba库。\n解析：评分细则：（1）正确定义Python计算生态：4分；（2）列举第一个应用领域及对应库：2分；\n（3）列举第二个应用领域及对应库：2分；（4）列举第三个应用领域及对应库：2分。考察知识点：\nPython计算生态的定义及核心应用领域与常用库。", "answer": "", "exam": true}, {"id": 1934, "type": "填空题", "question": "1707、什么是Python模块？请列举两种在程序中导入模块的常用方式。\n（1）使用import语句导入整个模块（如import math）；（2）使用from...import语句导入模块中的\n特定部分（如from math import pi）。\n解析：评分细则：（1）正确定义Python模块：4分；（2）列举并说明第一种导入方式：3分；（3）\n列举并说明第二种导入方式：3分。考察知识点：Python模块的概念及导入方法。", "answer": "Python模块是一个包含Python定义和语句的文件（后缀为.py）。导入模块的常用方式：", "exam": true}, {"id": 1935, "type": "填空题", "question": "1708、简述Python包的定义，并说明其标识特征。\n该文件可以为空，也可以包含包的初始化代码。\n解析：评分细则：（1）正确定义Python包：3分；（2）指出包的核心标识特征：4分；（3）说明\n__init__.py文件的作用：3分。考察知识点：Python包的概念及标识规则。", "answer": "Python包是一个用于组织相关模块的目录，其标识特征是目录中必须包含__init__.py文件。", "exam": true}, {"id": 1936, "type": "填空题", "question": "1709、随机库random的核心作用是什么？列举两个常用函数。\nrandom()生成0-1浮点数。\n解析：评分细则：核心作用正确得4分；每个函数正确得3分（6分）；总计10分。知识点：random库\n功能。", "answer": "核心作用是生成伪随机数。常用函数：random.randint(a,b)生成a到b整数；random.", "exam": true}, {"id": 1937, "type": "填空题", "question": "1710、使用 Python 内置的 random 库编写一个猜数字游戏，要求如下：", "answer": "", "exam": true}, {"id": 1938, "type": "填空题", "question": "1、程序随机生
