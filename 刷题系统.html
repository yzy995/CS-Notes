<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>期末复习刷题系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Microsoft YaHei",sans-serif;background:#f0f2f5;color:#333;min-height:100vh}
.app{max-width:1200px;margin:0 auto;padding:20px}
header{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;padding:24px 30px;border-radius:16px;margin-bottom:20px;text-align:center}
header h1{font-size:26px;margin-bottom:6px}
header p{opacity:.9;font-size:13px}
.mode-tabs{display:flex;gap:0;margin-bottom:18px;border-radius:10px;overflow:hidden;border:1px solid #d9d9d9;width:fit-content}
.mode-tab{padding:10px 28px;font-size:14px;cursor:pointer;background:#fff;border:none;transition:all .2s}
.mode-tab.active{background:#667eea;color:#fff}
.mode-tab:not(.active):hover{background:#f5f5f5}
.sub-tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.sub-tab{padding:8px 18px;border-radius:20px;border:1px solid #d9d9d9;background:#fff;cursor:pointer;font-size:14px;transition:all .2s}
.sub-tab:hover{border-color:#667eea;color:#667eea}
.sub-tab.active{background:#667eea;color:#fff;border-color:#667eea}
.type-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.type-tab{padding:6px 14px;border-radius:16px;border:1px solid #e8e8e8;background:#fafafa;cursor:pointer;font-size:13px;transition:all .2s}
.type-tab:hover{border-color:#667eea;color:#667eea}
.type-tab.active{background:#667eea;color:#fff;border-color:#667eea}
.controls{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.controls input{flex:1;min-width:180px;padding:9px 14px;border:1px solid #d9d9d9;border-radius:8px;font-size:14px;outline:none}
.controls input:focus{border-color:#667eea}
.stats{color:#666;font-size:13px}
.q-list{display:flex;flex-direction:column;gap:14px}
.q-card{background:#fff;border-radius:12px;padding:18px 22px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.q-hdr{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.q-num{background:#667eea;color:#fff;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0}
.q-type{background:#e6f0ff;color:#667eea;padding:2px 10px;border-radius:4px;font-size:12px;font-weight:500}
.q-body{font-size:14px;line-height:1.8;white-space:pre-wrap}
.q-body code{background:#f5f5f5;padding:1px 4px;border-radius:3px;font-family:"Cascadia Code","Fira Code",monospace;font-size:13px}
.q-body pre{background:#f8f9fa;padding:10px 14px;border-radius:8px;overflow-x:auto;font-size:13px;line-height:1.6;margin:6px 0}
.show-ans{margin-top:10px;padding:6px 14px;font-size:12px;border:1px solid #d9d9d9;border-radius:6px;background:#fafafa;cursor:pointer;color:#666}
.show-ans:hover{background:#f0f0f0}
.ans-box{display:none;margin-top:10px;padding:12px 16px;background:#f6ffed;border:1px solid #b7eb8f;border-radius:8px;font-size:14px;line-height:1.8;color:#135200;white-space:pre-wrap}
.ans-box.show{display:block}
.review-opt{display:block;padding:6px 10px;margin:3px 0;border-radius:6px;border:1px solid #e8e8e8;background:#fafafa}
.review-opt.correct{background:#f6ffed;border-color:#b7eb8f;color:#135200;font-weight:600}
.review-tag{display:inline-block;font-size:11px;background:#fff7e6;color:#d46b08;padding:1px 8px;border-radius:3px;margin-left:8px}
.pages{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:20px;padding:12px}
.pages button{padding:8px 16px;border:1px solid #d9d9d9;border-radius:6px;background:#fff;cursor:pointer;font-size:14px}
.pages button:disabled{opacity:.4;cursor:not-allowed}
.pages button:hover:not(:disabled){border-color:#667eea;color:#667eea}
.pages span{font-size:14px;color:#666}
.empty{text-align:center;padding:50px 20px;color:#999}
.empty h3{font-size:18px;margin-bottom:6px;color:#666}
.exam-container{max-width:800px;margin:0 auto}
.exam-progress{margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;font-size:14px;color:#666}
.exam-bar{height:6px;background:#e8e8e8;border-radius:3px;overflow:hidden;margin-bottom:18px}
.exam-bar-inner{height:100%;background:linear-gradient(90deg,#667eea,#764ba2);border-radius:3px;transition:width .3s}
.exam-card{background:#fff;border-radius:14px;padding:28px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.exam-q-header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.exam-q-body{font-size:15px;line-height:1.9;margin-bottom:20px;white-space:pre-wrap}
.exam-options{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.exam-opt{padding:12px 16px;border:2px solid #e8e8e8;border-radius:10px;cursor:pointer;font-size:14px;transition:all .2s;background:#fff;text-align:left}
.exam-opt:hover{border-color:#667eea;background:#f8f9ff}
.exam-opt.selected{border-color:#667eea;background:#eef0ff}
.exam-opt.correct{border-color:#52c41a;background:#f6ffed;color:#135200}
.exam-opt.wrong{border-color:#ff4d4f;background:#fff2f0;color:#a8071a}
.exam-opt.disabled{cursor:default;pointer-events:none}
.exam-opt.correct-answer{border-color:#52c41a;background:#f6ffed;color:#135200}
.exam-feedback{margin-top:16px;padding:14px 18px;border-radius:10px;font-size:14px;line-height:1.8;white-space:pre-wrap}
.exam-feedback.correct{background:#f6ffed;border:1px solid #b7eb8f;color:#135200}
.exam-feedback.wrong{background:#fff2f0;border:1px solid #ffccc7;color:#a8071a}
.exam-nav{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:12px}
.exam-nav button{padding:10px 24px;border-radius:8px;border:none;cursor:pointer;font-size:14px;transition:all .2s}
.exam-nav .btn-prev{background:#f5f5f5;color:#333}
.exam-nav .btn-prev:hover{background:#e8e8e8}
.exam-nav .btn-next{background:#667eea;color:#fff}
.exam-nav .btn-next:hover{background:#5a6fd6}
.exam-nav .btn-finish{background:#52c41a;color:#fff}
.exam-nav .btn-finish:hover{background:#45a718}
.exam-nav button:disabled{opacity:.4;cursor:not-allowed}
.exam-result{text-align:center;padding:40px 20px}
.exam-result h2{font-size:28px;margin-bottom:16px}
.exam-result .score{font-size:48px;font-weight:700;color:#667eea;margin-bottom:8px}
.exam-result .detail{font-size:16px;color:#666;margin-bottom:20px}
.exam-btn-group{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
@media(max-width:768px){
  .app{padding:12px}
  header{padding:18px 16px;border-radius:12px}
  header h1{font-size:20px}
  header p{font-size:12px}
  .mode-tabs{width:100%}
  .mode-tab{flex:1;text-align:center;padding:10px 12px;font-size:13px}
  .sub-tab{padding:6px 14px;font-size:13px}
  .type-tab{padding:5px 10px;font-size:12px}
  .q-card{padding:14px 16px;border-radius:10px}
  .q-body{font-size:13px;line-height:1.7}
  .q-body pre{font-size:12px;padding:8px 10px}
  .exam-card{padding:16px;border-radius:12px}
  .exam-q-body{font-size:14px}
  .exam-opt{padding:10px 12px;font-size:13px}
  .exam-nav button{padding:8px 16px;font-size:13px}
  .exam-result .score{font-size:36px}
  .controls input{font-size:13px;padding:8px 10px;min-width:100px}
  .pages button,.pages span{font-size:13px}
  .pages button{padding:6px 12px}
  .review-opt{padding:5px 8px;font-size:13px}
  .exam-feedback{font-size:13px;padding:12px 14px}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <h1>期末复习刷题系统</h1>
    <p id="headerDesc">选择科目与题型 → 开始刷题</p>
  </header>
  <div class="mode-tabs">
    <div class="mode-tab active" id="modeReview" onclick="setMode('review')">背题模式</div>
    <div class="mode-tab" id="modeExam" onclick="setMode('exam')">考试模式</div>
  </div>
  <div class="sub-tabs" id="subTabs"></div>
  <div class="type-tabs" id="typeTabs"></div>
  <div class="controls" id="controlsBar">
    <input class="search-box" id="search" placeholder="搜索题目关键词..." oninput="onSearch()">
    <span class="stats" id="stats">共 0 题</span>
  </div>
  <div id="contentArea"></div>
</div>
<script>
const DATA = {"Python程序设计": [{"id": 3, "type": "填空题", "question": "3、P113 选择题1-7", "answer": "", "exam": false}, {"id": 4, "type": "填空题", "question": "4、P137选择题1-5、编程题1-2", "answer": "", "exam": false}, {"id": 5, "type": "填空题", "question": "5、P150选择题1-5\nP187编程题1-2", "answer": "", "exam": false}, {"id": 7, "type": "选择题", "question": "1. 关于算法的描述，正确的是：\nA. 算法只要能运行即可，不需要考虑效率\nB. 算法必须具有明确的输入、输出和有限步骤\nC. 算法只能用程序代码表示\nD. 同一个问题只能有一种算法解决", "answer": "B", "exam": true}, {"id": 8, "type": "选择题", "question": "2. 以下哪一种结构最适合表示“学生成绩表”这类数据？\nA. 单个变量\nB. 列表或数组\nC. 条件语句\nD. 循环语句", "answer": "B", "exam": true}, {"id": 9, "type": "选择题", "question": "3. 已知代码如下：\ncount=0\n( , ): foriinrange16\n: ifi%2==0\ncount+=i\n( ) printcount\n程序输出结果是：\nA. 6\nB. 9\nC. 12\nD. 15\n二、编程题", "answer": "A", "exam": true}, {"id": 10, "type": "编程题", "question": "4. 学生成绩统计程序\n请编写程序，输入5名学生的成绩，完成以下功能：\n输出最高分 输出最低分 输出平均分 统计及格人数，60分及以上为及格\n示例输入：\n88 76 59 90 67\n示例输出：\n最高分：90\n最低分：59\n平均分：76.0\n及格人数：4", "answer": "", "exam": true}, {"id": 11, "type": "编程题", "question": "5. 简易购物车程序\n请编写程序，实现一个简易购物车功能。\n已知商品价格如下：\n{ goods=\n: , \"苹果\" 5\n: , \"香蕉\" 3\n: , \"牛奶\" 8\n:  \"面包\" 6\n}\n程序要求：\n让用户输入购买的商品名称和数量 判断商品是否存在 计算总价 如果总价满50元，打九折 输出最终\n应付金额\n示例输入：\n苹果 6\n牛奶 3\n示例输出：\n原价：54元\n优惠后价格：48.6元", "answer": "", "exam": true}, {"id": 12, "type": "编程题", "question": "6. 文本词频统计程序\n请编写程序，对一段英文文本进行单词统计。\n程序要求：\n输入一段英文句子 将所有单词转为小写 去除常见标点符号，如 . , ! ? 统计每个单词出现的次数\n按词频从高到低输出结果\n示例输入：\nPython is easy. Python is useful!\n示例输出：\npython: 2\nis: 2\neasy: 1\nuseful: 1", "answer": "", "exam": true}, {"id": 13, "type": "选择题", "question": "7、关于算法的描述，正确的是:\nA、算法只要能运行即可，不需要考虑效率\nB、算法必须具有明确的输入、输出和有限步骤\nC、算法只能用程序代码表示\nD、同一个问题只能有一种算法解决", "answer": "B", "exam": true}, {"id": 14, "type": "选择题", "question": "8、以下哪一种结构最适合表示“学生成绩表”这类数据?\nA、单个变量\nB、列表或数组\nC、条件语句\nD、循环语句", "answer": "B", "exam": true}, {"id": 15, "type": "选择题", "question": "9、已知代码如下:\ncount = 0\nfor i in range(1, 6):\nif i % 2 == 0:\ncount += i\nprint(count)\n程序输出结果是:\nA、6\nB、9\nC、12\nD、15", "answer": "A", "exam": true}, {"id": 16, "type": "编程题", "question": "10、学生成绩统计程序\n请编写程序，输入5名学生的成绩，完成以下功能:\n输出最高分\n输出最低分\n输出平均分\n统计及格人数，60分及以上为及格\n示例输入:\n88 76 59 90 67\n示例输出:\n最高分:90\n最低分:59\n平均分:76.0\n及格人数:4", "answer": "", "exam": true}, {"id": 17, "type": "编程题", "question": "11、简易购物车程序\n请编写程序，实现一个简易购物车功能。\n已知商品价格如下:\ngoods = {\n\"苹果\": 5,\n\"香蕉\": 3,\n\"牛奶\": 8,\n\"面包\": 6\n}\n程序要求:", "answer": "", "exam": true}, {"id": 18, "type": "填空题", "question": "1.让用户输入购买的商品名称和数量", "answer": "", "exam": true}, {"id": 22, "type": "填空题", "question": "5.输出最终应付金额\n示例输入:\n苹果 6\n牛奶 3\n示例输出:\n原价:54元\n优惠后价格:48.6元", "answer": "", "exam": true}, {"id": 23, "type": "编程题", "question": "12、文本词频统计程序\n请编写程序，对一段英文文本进行单词统计。\n程序要求:", "answer": "", "exam": true}, {"id": 26, "type": "填空题", "question": "3.去除常见标点符号，如 . , ! ?", "answer": "", "exam": true}, {"id": 28, "type": "填空题", "question": "5.按词频从高到低输出结果\n示例输入:\nPython is easy. Python is useful!\n示例输出:\npython: 2\nis: 2\neasy: 1\nuseful: 1", "answer": "", "exam": true}, {"id": 29, "type": "选择题", "question": "13、下列选项中，用于Python代码中添加单行注释在符号是（ ）\nA、#\nB、/\nC、//\nD、<!-- -->", "answer": "A", "exam": true}, {"id": 30, "type": "选择题", "question": "14、下列选项中，不属于Python关键字的是（ ）\nA、name\nB、if\nC、is\nD、and", "answer": "A", "exam": true}, {"id": 31, "type": "选择题", "question": "15、下列选项中，哪个数据的类型是属于数字类型的？ （ ）\nA、0\nB、1\nC、1+2j\nD、以上全部", "answer": "D", "exam": true}, {"id": 32, "type": "选择题", "question": "16、若想要将2转换为二进制数0b10，应该使用以下哪个函数？ （ ）\nA、oct( )\nB、bin( )\nC、hex( )\nD、int( )", "answer": "B", "exam": true}, {"id": 33, "type": "选择题", "question": "17、下列选项中，不属于Python数据类型的是（ ）\nA、bool\nB、dict\nC、string\nD、set", "answer": "C", "exam": true}, {"id": 34, "type": "填空题", "question": "18、Python 是一门面向（ ）的高级编程语言。", "answer": "对象；", "exam": true}, {"id": 35, "type": "填空题", "question": "19、Python 可以在多种平台运行，这体现了 Python 语言（ ）的特点。", "answer": "可移植性；", "exam": true}, {"id": 36, "type": "填空题", "question": "20、Python 模块的本质是扩展名为（ ）的文件。", "answer": ".py；", "exam": true}, {"id": 37, "type": "填空题", "question": "21、Python 中使用（ ）可以在当前程序中导入模块。", "answer": "import；", "exam": true}, {"id": 38, "type": "填空题", "question": "22、（ ）工具是 Python 模块、包或库的一个通用的管理工具。", "answer": "pip；", "exam": true}, {"id": 41, "type": "选择题", "question": "25、Python中单行注释的正确符号是？\nA、//\nB、#\nC、/* */\nD、--\n解析：Python单行注释以#开头，//是Java/C++的单行注释，/* */是多行注释，--是SQL注释。", "answer": "B", "exam": true}, {"id": 42, "type": "选择题", "question": "26、Python中实现语句换行的方法有？\nA、使用\\\nB、使用小括号包裹\nC、使用分号分隔\nD、直接换行\n解析：Python语句换行可通过\\或小括号实现，分号用于分隔同一行的多个语句，直接换行可能导致\n语法错误。", "answer": "AB", "exam": true}, {"id": 43, "type": "填空题", "question": "27、Python标识符可以以数字开头。\n解析：Python标识符命名规则规定不能以数字开头，只能以字母或下划线开头。", "answer": "错误", "exam": true}, {"id": 44, "type": "填空题", "question": "28、Python多行注释只能用三对双引号包裹。\n解析：Python多行注释可以用三对双引号或单引号包裹，两种方式均有效。", "answer": "错误", "exam": true}, {"id": 45, "type": "填空题", "question": "29、Python是一种____运行、____对象的程序设计语言。\n解析：根据Python语言概述，Python是解释运行、面向对象的语言。", "answer": "解释；面向；", "exam": true}, {"id": 46, "type": "选择题", "question": "30、以下Python标识符中，符合命名规则且推荐使用的是？\nA、2nd_student\nB、student_name\nC、from#12\nD、IF\n解析：选项A以数字开头，不符合标识符命名规则；选项C包含#符号，不符合规则；选项D虽然是大写\n字母，但IF是Python关键字，不能作为标识符；选项B由小写字母和下划线组成，符合变量命名的推\n荐格式且见名知意。", "answer": "B", "exam": true}, {"id": 47, "type": "选择题", "question": "31、关于Python缩进，下列说法错误的是？\nA、同一代码块的缩进量必须一致\nB、缩进可以使用Tab键或4个空格\nC、缩进错误会导致SyntaxError\nD、不同代码块可以混合使用Tab和空格缩进\n解析：Python中缩进不允许混合使用Tab键和空格，否则会导致缩进错误。选项A、B、C的说法均正\n确，选项D错误。", "answer": "D", "exam": true}, {"id": 48, "type": "选择题", "question": "32、下列Python数据类型中，元素不可修改的是？\nA、列表(list)\nB、元组(tuple)\nC、集合(set)\nD、字典(dict)\n解析：元组中的元素一旦创建就不能修改，而列表、集合和字典的元素都是可以修改的。因此选项B\n正确。", "answer": "B", "exam": true}, {"id": 49, "type": "选择题", "question": "33、执行Python语句`print(3 ** 2 // 2)`的输出结果是？\nA、4\nB、4.5\nC、3\nD、5\n解析：**是幂运算符，3**2等于9；//是整除运算符，9//2等于4（向下取整）。因此输出结果是4，\n选项A正确。", "answer": "A", "exam": true}, {"id": 50, "type": "选择题", "question": "34、以下关于Python注释和标识符的说法中,错误的是?\nA、单行注释以#开头,与代码共占一行时至少需要两个空格分隔\nB、多行注释可以使用三对单引号或双引号包裹,主要用于说明函数或类的功能\nC、标识符必须以字母或下划线开头,可以包含字母、数字和下划线\nD、关键字if可以作为变量名使用,因为它是Python的内置关键字\n解析：Python中的关键字是已经被Python使用的标识符,不允许开发人员重复定义。if是Python的关\n键字之一,因此不能作为变量名使用。其他选项的说法都是正确的:单行注释以#开头,与代码共占一行\n时至少需要两个空格分隔;多行注释可以使用三对单引号或双引号包裹,常用于说明函数或类的功能;\n标识符的命名规则是必须以字母或下划线开头,可以包含字母、数字和下划线。", "answer": "D", "exam": true}, {"id": 51, "type": "填空题", "question": "35、Python中单行注释以________开头，多行注释可使用三对________或单引号包裹内容。\n解析：Python单行注释用#，多行注释用三对双引号或单引号。", "answer": "#；双引号；", "exam": true}, {"id": 52, "type": "填空题", "question": "36、Python中推荐使用________个空格表示一级缩进，且不允许混合使用Tab键和空格进行缩进。\n解析：课程明确Python推荐4个空格作为一级缩进。", "answer": "4；", "exam": true}, {"id": 53, "type": "填空题", "question": "37、在Python中，标识符由字母、数字或下画线组成，且不能以____开头。\n解析：Python标识符的命名规则规定，标识符不能以数字开头，只能以字母或下画线开头。", "answer": "数字；", "exam": true}, {"id": 54, "type": "填空题", "question": "38、Python中的复数类型由实部和虚部组成，虚部以字母____结尾。\n解析：Python中的复数类型表示形式为实部+虚部j，例如3.12+1.23j，虚部必须以字母j结尾。", "answer": "j；", "exam": true}, {"id": 55, "type": "填空题", "question": "39、Python标识符由字母、数字或______组成，且不能以______开头；同时，不能使用Python的\n______作为标识符。\n解析：标识符命名规则要求：只能包含字母、数字和下画线，首字符不能是数字，且禁止使用Python\n内置关键字（如if、else等）。", "answer": "下画线；数字；关键字；", "exam": true}, {"id": 56, "type": "填空题", "question": "40、Python中布尔类型的取值为______和______；列表使用______包裹元素，而元组使用______包裹\n元素。\n解析：布尔类型表示逻辑值，取值为True和False；列表是可变序列，用[]定义；元组是不可变序\n列，用()定义。", "answer": "True；False；中括号；小括号；", "exam": true}, {"id": 57, "type": "选择题", "question": "41、以下代码用于根据成绩评定等级：score = 78，执行后输出结果为？\nif score >= 85:\nprint('优秀')\nelif 75 <= score < 85:\nprint('良好')\nelif 60 <= score < 75:\nprint('中等')\nelse:\nprint('差')\nA、优秀\nB、良好\nC、中等\nD、差\n解析：78满足75<=score<85的条件，因此执行对应分支输出'良好'", "answer": "B", "exam": true}, {"id": 58, "type": "选择题", "question": "42、以下代码执行后输出结果为？\ni = 1\nresult = 0\nwhile i <= 5:\nresult += i\ni += 1\nprint(result)\nA、10\nB、15\nC、20\nD、25\n解析：循环计算1+2+3+4+5=15", "answer": "B", "exam": true}, {"id": 59, "type": "选择题", "question": "43、以下代码执行后输出结果为？\nfor i in range(2, 8, 2):\nprint(i, end=' ')\nA、2 4 6\nB、2 4 6 8\nC、0 2 4 6\nD、2 3 4 5 6 7\n解析：range(2,8,2)生成2、4、6，间隔为2", "answer": "A", "exam": true}, {"id": 60, "type": "选择题", "question": "44、以下代码用于判断闰年：year = 2024，执行后输出结果为？\nif year % 400 == 0 or (year % 4 == 0 and year % 100 != 0):\nprint('闰年')\nelse:\nprint('平年')\nA、闰年\nB、平年\nC、无输出\nD、语法错误\n解析：2024能被4整除且不能被100整除，符合闰年条件", "answer": "A", "exam": true}, {"id": 61, "type": "填空题", "question": "45、if语句的条件表达式可以是任意表达式，只要其布尔值为True就执行代码块\n解析：Python中任何表达式都可作为条件，非零数字、非空字符串等布尔值为True", "answer": "正确", "exam": true}, {"id": 62, "type": "填空题", "question": "46、while True: 会导致无限循环，必须避免使用\n解析：无限循环在实际开发中有用，如游戏主程序、监控程序等，需合理使用", "answer": "错误", "exam": true}, {"id": 63, "type": "填空题", "question": "47、for循环只能遍历字符串和列表\n解析：for循环可遍历所有可迭代对象，如元组、字典、集合等", "answer": "错误", "exam": true}, {"id": 64, "type": "填空题", "question": "48、if-elif-else语句中，elif的数量没有限制\n解析：可以根据需要添加任意多个elif分支", "answer": "正确", "exam": true}, {"id": 65, "type": "填空题", "question": "49、以下代码用于判断成绩是否及格：\nscore = 55\nif score >= 60:\nprint('及格')\n______:\nprint('不及格')\nelse\n；\n解析：需要使用else处理不满足条件的情况", "answer": "", "exam": true}, {"id": 66, "type": "填空题", "question": "50、以下代码计算1到100的和：\ni = 1\nresult = 0\nwhile i <= 100:\nresult += i\n______\nprint(result)\ni += 1\n；\n解析：需要递增循环变量i，否则会无限循环", "answer": "", "exam": true}, {"id": 67, "type": "填空题", "question": "51、以下代码遍历字符串：\ns = 'Python'\nfor ______ in s:\nprint(c)\nc\n；\n解析：for循环需要临时变量存储每次遍历的元素", "answer": "", "exam": true}, {"id": 68, "type": "填空题", "question": "52、以下代码判断闰年：\nyear = 2020\nif month == 2:\nif ______ or (year % 4 == 0 and year % 100 != 0):\nprint('29天')\nelse:\nprint('28天')\nyear % 400 == 0\n；\n解析：闰年判断条件为能被400整除，或能被4整除但不能被100整除", "answer": "", "exam": true}, {"id": 69, "type": "填空题", "question": "53、某快递首重2kg，费用13元（华东01），续重3元/kg。重量w=4kg，费用计算：\nif w <=2:\ncost = 13\nelse:\ncost = 13 + ______\nprint(cost)\n(w-2)*3\n；\n解析：续重重量为w-2kg，续重费用为(w-2)*3元", "answer": "", "exam": true}, {"id": 70, "type": "填空题", "question": "54、while True:\nprint(\"Hello\")\n以上代码是一个无限循环，会一直输出\"Hello\"。\n解析：while True表示循环条件始终为真，因此循环会无限执行，不断输出\"Hello\"。无限循环在实\n际开发中需谨慎使用，避免占用过多系统资源。", "answer": "正确", "exam": true}, {"id": 71, "type": "填空题", "question": "55、以下Python代码运行后，输出的结果中 1 出现的次数是______。\ncount = 0\nfor i in range(1, 11):\nif i % 3 == 0:\ncontinue\nif i == 7:\nbreak\nprint(1)\ncount = count + 1\nprint(count)\n4\n；\n解析：在这段代码中，`for` 循环遍历从 1 到 10 的整数。当 `i` 是 3 的倍数时，执行\n`continue` 语句，跳过本次循环；当 `i` 等于 7 时，执行 `break` 语句，跳出整个循环。因此，\n会输出 1 的 `i` 值为 1、2、4、5，所以 1 出现的次数是 4 次。", "answer": "", "exam": true}, {"id": 72, "type": "选择题", "question": "56、执行以下Python代码后，输出结果是什么？\ni = 0\nwhile i < 5:\ni += 1\nif i == 3:\ncontinue\nprint(i)\nA、1 2 4 5\nB、1 2 3 4 5\nC、0 1 2 4 5\nD、0 1 2 3 4 5\n解析：当i=3时执行continue语句，跳过本次循环的print(i)，所以3不会被输出。i从0开始，每次循\n环i先加1，循环条件是i<5，所以i依次为1、2、3、4、5，其中3被跳过，输出1 2 4 5。", "answer": "A", "exam": true}, {"id": 73, "type": "选择题", "question": "57、执行以下Python代码后，输出结果是什么？\nfor i in range(10):\nif i % 2 == 0:\nbreak\nprint(i)\nA、0\nB、1\nC、无输出\nD、0 2 4 6 8\n解析：range(10)生成0-9的整数，第一次循环i=0，满足i%2==0的条件，执行break语句终止循环，所\n以没有任何输出。", "answer": "C", "exam": true}, {"id": 74, "type": "填空题", "question": "58、在Python中，break语句可以终止当前所在的循环或switch语句。\n解析：Python中没有switch语句，break语句只能终止当前所在的循环（for或while）或switch-case\n结构（Python 3.10+支持match-case，但break同样适用），但原表述中的switch语句是错误的。", "answer": "错误", "exam": true}, {"id": 75, "type": "填空题", "question": "59、continue语句会终止整个循环，而break语句只会跳过本次循环的剩余语句。\n解析：continue语句只会跳过本次循环的剩余语句，进入下一次循环；break语句会终止整个循环。\n原表述将两者的作用颠倒了，所以错误。", "answer": "错误", "exam": true}, {"id": 76, "type": "选择题", "question": "60、在Python中，以下哪种方式不能正确定义多行字符串？\nA、'''第一行\\n第二行'''\nB、\"\"\"第一行 第二行\"\"\"\nC、'第一行'+'第二行'\nD、\"第一行\\n第二行\"\n解析：选项C是两个单行字符串的拼接，不是多行字符串定义；三引号（选项A、B）和转义符\\n（选\n项D）可定义多行字符串。", "answer": "C", "exam": true}, {"id": 77, "type": "选择题", "question": "61、执行print(r'Python\\nProgramming')语句后，输出结果是？\nA、Python Programming\nB、Python\\nProgramming\nC、PythonProgramming\nD、Python Programming\n解析：前缀r表示原始字符串，转义字符\\n保持字面含义，不执行换行操作。", "answer": "B", "exam": true}, {"id": 78, "type": "选择题", "question": "62、以下哪个选项能正确格式化字符串？\nA、'I am %d years old' % '18'\nB、'I am {age} years old'.format(age='18')\nC、'I am {0} years old'.format(18, 20)\nD、f'I am {age} years old' where age=18 (未定义变量)\n解析：选项A中%d要求整数，却传入字符串；选项C中{0}只需一个参数，传入两个不影响但不符合题\n意；选项D未定义变量age；选项B使用format()方法正确。", "answer": "B", "exam": true}, {"id": 79, "type": "选择题", "question": "63、执行print('{1} {0}'.format('World', 'Hello'))语句后，输出结果是？\nA、Hello World\nB、World Hello\nC、{1} {0}\nD、HelloHello\n解析：format()方法中{1}对应第二个参数'Hello'，{0}对应第一个参数'World'，故输出Hello\nWorld。", "answer": "A", "exam": true}, {"id": 80, "type": "选择题", "question": "64、以下f-string使用正确的是？\nA、f'The value is {3.14159:.2f}'\nB、f'The value is {3.14159 to 2f}'\nC、f'The value is {3.14159:.2}'\nD、f'The value is {3.14159.2f}'\n解析：f-string中格式化浮点数的语法是:.nf（n为小数位数），选项A正确；选项B、C、D语法错\n误。", "answer": "A", "exam": true}, {"id": 81, "type": "填空题", "question": "65、Python字符串是可变序列，可以通过索引修改单个字符。\n解析：Python字符串是不可变序列，不支持通过索引修改单个字符，例如s='abc';s[0]='d'会报错。", "answer": "错误", "exam": true}, {"id": 82, "type": "填空题", "question": "66、在Python中，'Hello'和\"Hello\"表示相同的字符串。\n解析：单引号和双引号在Python中均可定义单行字符串，且内容相同则字符串等价。", "answer": "正确", "exam": true}, {"id": 83, "type": "填空题", "question": "67、使用%格式化字符串时，'%s %d' % ('Python', 3.8)会报错。\n解析：%d可接受浮点数3.8并自动转换为整数3，不会报错，输出'Python 3'。", "answer": "错误", "exam": true}, {"id": 84, "type": "填空题", "question": "68、format()方法中，'{:.3f}'.format(123)会输出123.000。\n解析：{:.3f}表示保留三位小数，整数123会被格式化为123.000。", "answer": "正确", "exam": true}, {"id": 85, "type": "填空题", "question": "69、print('He said: \\\"I\\'m fine\\\"')语句的输出是He said: \"I'm fine\"。\n解析：\\\"转义为\"，\\'转义为'，故输出正确。", "answer": "正确", "exam": true}, {"id": 86, "type": "填空题", "question": "70、定义包含单引号的字符串'Let's go'，正确的Python代码是______。\n解析：使用双引号定义包含单引号的字符串，避免语法错误；也可使用三引号或转义符\\'。", "answer": "print(\"Let's go\")；", "exam": true}, {"id": 87, "type": "填空题", "question": "71、执行语句print('My name is %s, age is %d' % ('Tom', 20))后，输出结果是______。\n解析：%s替换为'Tom'，%d替换为20，按格式输出字符串。", "answer": "My name is Tom, age is 20；", "exam": true}, {"id": 88, "type": "填空题", "question": "72、执行语句print('{name} is {age} years old'.format(name='Lily', age=18))后，输出结果是\n______。\n解析：{name}和{age}分别被format()方法中的name和age参数替换，输出对应字符串。", "answer": "Lily is 18 years old；", "exam": true}, {"id": 89, "type": "填空题", "question": "73、已知x=5，y=3.14，执行print(f'The result is {x*y:.2f}')后，输出结果是______。\n解析：x*y=15.7，{:.2f}保留两位小数，故输出15.70。", "answer": "The result is 15.70；", "exam": true}, {"id": 90, "type": "填空题", "question": "74、要在字符串中显示反斜杠，正确的转义方式是______。\n解析：反斜杠是转义字符，需用两个反斜杠\\\\表示一个字面反斜杠。", "answer": "\\\\；", "exam": true}, {"id": 91, "type": "填空题", "question": "75、Python的组合数据类型分为序列类型、集合类型和______类型三大类。\n解析：组合数据类型根据数据组织方式分为序列类型（如列表、元组）、集合类型和映射类型（如字\n典）。", "answer": "映射；", "exam": true}, {"id": 92, "type": "填空题", "question": "76、使用list()函数创建列表时，若传入字符串'python'，得到的列表结果是______。\n解析：list()函数接收可迭代对象，字符串是可迭代对象，会将每个字符作为元素生成列表。", "answer": "[\"p\",\"y\",\"t\",\"h\",\"o\",\"n\"]；", "exam": true}, {"id": 93, "type": "填空题", "question": "77、对于列表li = [1,2,3,4,5]，执行li[1:4:2]后得到的子列表是______。\n解析：切片语法list[m:n:step]表示从索引m到n-1，步长为step。这里m=1,n=4,step=2，取索引1和3\n的元素。", "answer": "[2,4]；", "exam": true}, {"id": 94, "type": "填空题", "question": "78、append()方法会将参数作为______添加到列表末尾，而extend()方法会将可迭代对象的元素\n______添加。\n解析：append()添加单个元素（可嵌套），extend()扩展多个元素到列表。", "answer": "整体；逐个；", "exam": true}, {"id": 95, "type": "填空题", "question": "79、sort()方法的reverse参数默认值为______，表示______排列。\n解析：sort()默认reverse=False升序，reverse=True时降序排列。", "answer": "False；升序；", "exam": true}, {"id": 96, "type": "选择题", "question": "80、以下不属于序列类型的是？\nA、字符串(str)\nB、列表(list)\nC、集合(set)\nD、元组(tuple)\n解析：集合是无序不重复的，属于集合类型，不是序列类型。", "answer": "C", "exam": true}, {"id": 97, "type": "选择题", "question": "81、以下代码创建的列表结果是？ list([1, 'python'])\nA、[1,\"python\"]\nB、[\"1\",\"python\"]\nC、[1,[\"python\"]]\nD、错误\n解析：list()函数接收列表参数时，直接生成相同元素的新列表。", "answer": "A", "exam": true}, {"id": 98, "type": "选择题", "question": "82、列表list_demo = [\"Java\", \"C#\", \"Python\", \"PHP\"]，访问\"C#\"的反向索引是？\nA、-1\nB、-2\nC、-3\nD、-4\n解析：反向索引从-1开始，\"C#\"是第2个元素，反向索引为-3。", "answer": "C", "exam": true}, {"id": 99, "type": "选择题", "question": "83、以下代码执行后li_three的结果是？ li_three = ['python', 'java', 'php'] li_three.sort\n(key=len)\nA、[\"java\",\"php\",\"python\"]\nB、[\"python\",\"java\",\"php\"]\nC、[\"php\",\"java\",\"python\"]\nD、[\"java\",\"python\",\"php\"]\n解析：key=len按元素长度排序，'java'(4)、'php'(3)、'python'(6)，排序后为\n['java','php','python']。", "answer": "A", "exam": true}, {"id": 100, "type": "填空题", "question": "84、序列类型的索引只能从0开始正向递增。\n解析：序列类型支持正向索引（从0开始）和反向索引（从-1开始）。", "answer": "错误", "exam": true}, {"id": 101, "type": "填空题", "question": "85、列表是不可变的序列类型。\n解析：列表是可变序列类型，可以修改、添加、删除元素。", "answer": "错误", "exam": true}, {"id": 102, "type": "填空题", "question": "86、切片操作list[:]会生成原列表的副本。\n解析：list[:]表示从开头到结尾步长1，生成原列表的浅拷贝。", "answer": "正确", "exam": true}, {"id": 103, "type": "填空题", "question": "87、insert()方法若指定位置超出列表长度，会插入到列表开头。\n解析：insert()位置超出长度时，正数索引超出插末尾，负数索引超出插开头。", "answer": "错误", "exam": true}, {"id": 104, "type": "填空题", "question": "88、sort()方法会生成新列表，不改变原列表。\n解析：sort()是原地排序，直接修改原列表，sorted()才生成新列表。", "answer": "错误", "exam": true}, {"id": 105, "type": "选择题", "question": "89、现有列表 `li = ['Python', 'java', 'PHP', 'JavaScript']`，执行 `li.sort(key=len,\nreverse=True)` 后，列表 `li` 的元素顺序是？\nA、[\"JavaScript\",\"Python\",\"java\",\"PHP\"]\nB、[\"Python\",\"JavaScript\",\"java\",\"PHP\"]\nC、[\"PHP\",\"java\",\"Python\",\"JavaScript\"]\nD、[\"JavaScript\",\"Python\",\"PHP\",\"java\"]\n解析：`sort(key=len)` 表示按元素长度排序，各元素长度：'JavaScript'为10、'Python'为", "answer": "A", "exam": true}, {"id": 106, "type": "填空题", "question": "6、'java'为4、'PHP'为3；`reverse=True` 表示降序排列，因此排序后顺序为['JavaScript',\n'Python', 'java', 'PHP']，对应选项A。", "answer": "", "exam": true}, {"id": 107, "type": "选择题", "question": "90、以下关于Python函数定义的说法，正确的是（）\nA、定义函数时必须使用return语句返回值\nB、函数内部可以嵌套定义另一个函数\nC、函数名必须以数字开头\nD、定义函数时参数列表不能为空\n解析：Python允许函数内部嵌套定义函数，称为内层函数；定义函数时可以没有return语句，函数名\n不能以数字开头，参数列表可以为空（无参函数）。", "answer": "B", "exam": true}, {"id": 108, "type": "选择题", "question": "91、以下函数调用方式中，正确的是（）\nA、\ndef func(a, b):\nprint(a + b)\nfunc(10, b=20)\nB、\ndef func(a, b):\nprint(a + b)\nfunc(a=10, 20)\nC、\ndef func(a, b):\nprint(a + b)\nfunc(10, a=20)\nD、\ndef func(a, b):\nprint(a + b)\nfunc(10, 20, 30)\n解析：位置参数和关键字参数可以混合使用，但位置参数必须在关键字参数之前，且不能重复传递参\n数。选项B中关键字参数后不能跟位置参数，选项C重复传递a参数，选项D参数数量不匹配。", "answer": "A", "exam": true}, {"id": 109, "type": "选择题", "question": "92、以下关于默认参数的说法，正确的是（）\nA、默认参数必须位于普通参数之前\nB、调用函数时必须给默认参数传值\nC、默认参数的值在函数定义时确定\nD、默认参数只能是数字类型\n解析：默认参数必须位于普通参数之后，调用函数时可以不给默认参数传值（使用默认值），默认参\n数的值在函数定义时确定，且可以是任意类型。", "answer": "C", "exam": true}, {"id": 110, "type": "选择题", "question": "93、以下代码的输出结果是（）\ndef func(*args, **kwargs):\nprint(len(args), len(kwargs))\nfunc(1, 2, 3, a=4, b=5)\nA、3 2\nB、2 3\nC、5 0\nD、0 5\n解析：*args接收位置参数打包成元组，长度为3；**kwargs接收关键字参数打包成字典，长度为2。", "answer": "A", "exam": true}, {"id": 111, "type": "选择题", "question": "94、以下关于函数调用的说法，正确的是（）\nA、函数定义后会自动执行\nB、函数可以在定义之前调用\nC、函数调用时必须传递与参数数量相同的实参\nD、函数内部可以调用其他函数\n解析：函数定义后不会自动执行，需调用；函数调用需在定义之后；有默认参数时可以不传递所有实\n参；函数内部可以调用其他函数（嵌套调用）。", "answer": "D", "exam": true}, {"id": 112, "type": "选择题", "question": "95、以下关于函数参数传递的说法，正确的有（）\nA、位置参数传递时实参顺序必须与形参一致\nB、关键字参数传递时可以不考虑参数顺序\nC、默认参数可以在调用时被覆盖\nD、*args可以接收任意数量的位置参数\n解析：位置参数需按顺序传递；关键字参数通过参数名匹配，无需考虑顺序；默认参数调用时可传值\n覆盖；*args用于接收任意数量的位置参数。", "answer": "ABCD", "exam": true}, {"id": 113, "type": "选择题", "question": "96、以下关于函数的说法，正确的有（）\nA、函数可以提高代码复用性\nB、函数可以使程序结构更清晰\nC、内层函数只能在外层函数内部调用\nD、函数名必须唯一\n解析：函数的主要作用包括提高代码复用性、使程序结构清晰；内层函数作用域在外层函数内部，只\n能在外层函数内调用；函数名在同一作用域内必须唯一。", "answer": "ABCD", "exam": true}, {"id": 114, "type": "选择题", "question": "97、以下函数定义中，参数使用正确的有（）\nA、\ndef func(a, b=10):\nprint(a + b)\nB、\ndef func(a, *args):\nprint(a, args)\nC、\ndef func(**kwargs):\nprint(kwargs)\nD、\ndef func(a, b, /, c):\nprint(a, b, c)\n解析：选项A是普通参数+默认参数；选项B是普通参数+*args；选项C是**kwargs；选项D是仅限位置\n参数（/之前的参数只能位置传递），均符合Python函数参数定义规则。", "answer": "ABCD", "exam": true}, {"id": 115, "type": "选择题", "question": "98、以下代码中，函数调用正确的有（）\nA、\ndef func(a, b):\nprint(a + b)\nfunc(10, 20)\nB、\ndef func(a, b=5):\nprint(a + b)\nfunc(10)\nC、\ndef func(*args):\nprint(sum(args))\nfunc(1, 2, 3)\nD、\ndef func(**kwargs):\nprint(kwargs['name'])\nfunc(name='Alice')\n解析：选项A是位置参数传递；选项B是默认参数省略；选项C是*args接收多个位置参数；选项D是\n**kwargs接收关键字参数，均正确。", "answer": "ABCD", "exam": true}, {"id": 116, "type": "选择题", "question": "99、以下关于函数返回值的说法，正确的有（）\nA、函数可以没有return语句\nB、return语句可以返回多个值\nC、return语句执行后函数立即结束\nD、没有return语句的函数默认返回None\n解析：函数可以没有return语句（默认返回None）；return可以返回多个值（以元组形式）；return\n语句执行后函数终止；无return时返回None。", "answer": "ABCD", "exam": true}, {"id": 117, "type": "填空题", "question": "100、函数是组织好的、实现单一或相关功能的代码段。\n解析：函数的定义是组织好的、实现特定功能的代码块，可提高代码复用性和可维护性。", "answer": "正确", "exam": true}, {"id": 118, "type": "填空题", "question": "101、函数定义后会自动执行。\n解析：函数定义后不会自动执行，需要通过函数名加括号（如func()）的方式调用才会执行。", "answer": "错误", "exam": true}, {"id": 119, "type": "填空题", "question": "102、关键字参数传递时，实参顺序必须与形参一致。\n解析：关键字参数通过参数名匹配，无需考虑顺序，例如func(b=20, a=10)与func(a=10, b=20)效果\n相同。", "answer": "错误", "exam": true}, {"id": 120, "type": "填空题", "question": "103、*args用于接收任意数量的关键字参数。\n解析：*args用于接收任意数量的位置参数，打包成元组；**kwargs用于接收任意数量的关键字参\n数，打包成字典。", "answer": "错误", "exam": true}, {"id": 121, "type": "填空题", "question": "104、内层函数可以在函数外部直接调用。\n解析：内层函数的作用域仅限于外层函数内部，函数外部无法直接调用内层函数，只能在外层函数内\n部调用。", "answer": "错误", "exam": true}, {"id": 122, "type": "填空题", "question": "105、Python中定义函数使用的关键字是______。\n解析：Python使用def关键字定义函数，语法格式为def 函数名([参数列表]):。", "answer": "def；", "exam": true}, {"id": 123, "type": "填空题", "question": "106、以下代码的输出结果是______。\ndef func(a, b=5):\nreturn a + b\nresult = func(10)\nprint(result)\n15\n；\n解析：函数func()的b参数默认值为5，调用时只传递a=10，b使用默认值5，10+5=15。", "answer": "", "exam": true}, {"id": 124, "type": "填空题", "question": "107、以下代码中，*args接收的参数是______（以元组形式表示）。\ndef func(*args):\nprint(args)\nfunc(1, 2, 3)\n(1, 2, 3)\n；\n解析：*args用于接收任意数量的位置参数，打包成元组，因此输出(1, 2, 3)。", "answer": "", "exam": true}, {"id": 125, "type": "填空题", "question": "108、以下代码中，**kwargs接收的参数是______（以字典形式表示）。\ndef func(**kwargs):\nprint(kwargs)\nfunc(name='Bob', age=20)\n{'name': 'Bob', 'age': 20}\n；\n解析：**kwargs用于接收任意数量的关键字参数，打包成字典，因此输出{'name': 'Bob', 'age':\n20}。", "answer": "", "exam": true}, {"id": 126, "type": "填空题", "question": "109、以下代码的输出结果是______。\ndef outer():\ndef inner():\nprint('内层函数')\ninner()\nouter()\n内层函数\n；\n解析：outer()函数内部定义了inner()函数，并在outer()内部调用inner()，因此执行inner()的\nprint语句，输出'内层函数'。", "answer": "", "exam": true}, {"id": 127, "type": "选择题", "question": "110、以下关于文件标识的描述，正确的是？\nA、文件标识由路径和文件名组成\nB、路径只能是绝对路径\nC、文件名主干和扩展名之间用点号分隔\nD、文件标识不包含扩展名\n解析：文件标识由路径、文件名主干和扩展名3个部分组成，其中扩展名紧跟在文件名主干之后，以\n点号进行分隔。", "answer": "C", "exam": true}, {"id": 128, "type": "选择题", "question": "111、Python中使用open()函数打开文件时，默认的打开模式是？\nA、r\nB、w\nC、a\nD、r+\n解析：open()函数的mode参数默认值为'r'，表示以只读方式打开文本文件。", "answer": "A", "exam": true}, {"id": 129, "type": "选择题", "question": "112、以下关于with语句的描述，错误的是？\nA、with语句可以自动关闭文件\nB、with语句中必须使用as关键字\nC、with语句可以简化文件操作代码\nD、with语句确保在任何情况下都会正确关闭文件\n解析：with语句中as及其后面的变量名都是可选的，不是必须使用的。", "answer": "B", "exam": true}, {"id": 130, "type": "选择题", "question": "113、以下代码中，能够正确读取文件全部内容的是？\nA、file.read(0)\nB、file.read(-1)\nC、file.read(100)\nD、file.readline()\n解析：read()方法的size参数默认值为-1，表示一次性从文件中读取所有数据。", "answer": "B", "exam": true}, {"id": 131, "type": "选择题", "question": "114、以下属于二进制文件的是？\nA、text.txt\nB、image.jpg\nC、data.csv\nD、index.html\n解析：二进制文件包含图像、音频、视频等数据，不能直接使用文字处理程序正常读写。", "answer": "B", "exam": true}, {"id": 132, "type": "选择题", "question": "115、以下关于文件打开模式的描述，正确的有？\nA、'r'模式表示只读方式打开文本文件\nB、'w'模式会清空文件原有内容\nC、'a'模式会在文件末尾追加数据\nD、'r+'模式只能读取文件，不能写入\n解析：'r+'模式表示读写模式，允许在文件中进行读取和写入操作。", "answer": "ABC", "exam": true}, {"id": 133, "type": "选择题", "question": "116、以下关于文本文件和二进制文件的描述，正确的有？\nA、文本文件由字符组成，二进制文件由字节组成\nB、文本文件和二进制文件在物理层面上没有区别\nC、文本文件可以被人类直接读取，二进制文件不能\nD、Python中操作文本文件和二进制文件的方式完全相同\n解析：Python中操作文本文件和二进制文件的方式有所不同，例如打开二进制文件需要使\n用'rb'、'wb'等模式。", "answer": "ABC", "exam": true}, {"id": 134, "type": "选择题", "question": "117、以下属于Python标准文件的有？\nA、stdin\nB、stdout\nC、stderr\nD、stderror\n解析：Python的sys模块中定义了3个标准文件，分别为stdin、stdout和stderr。", "answer": "ABC", "exam": true}, {"id": 135, "type": "选择题", "question": "118、以下关于close()方法的描述，正确的有？\nA、close()方法用于关闭已打开的文件\nB、close()方法需要传入文件路径作为参数\nC、程序执行完毕后，系统会自动关闭打开的文件\nD、打开的文件过多会降低系统性能\n解析：close()方法无需传入任何参数，直接调用即可。", "answer": "ACD", "exam": true}, {"id": 136, "type": "选择题", "question": "119、以下代码中，能够正确打开文件的有？\nA、open('test.txt', 'r')\nB、open('data.bin', 'wb')\nC、open('log.txt', 'a+')\nD、open('image.png', 'w')\n解析：打开二进制文件（如image.png）应该使用'wb'等二进制模式，而不是'w'模式。", "answer": "ABC", "exam": true}, {"id": 137, "type": "填空题", "question": "120、文件标识中的路径只能是绝对路径。\n解析：路径可以分为相对路径或绝对路径，相对路径是相对于当前工作目录或某个特定目录的路径。", "answer": "错误", "exam": true}, {"id": 138, "type": "填空题", "question": "121、使用'w'模式打开文件时，如果文件不存在，会创建一个新的文件。\n解析：'w'模式表示写入模式，以只写的方式打开文本文件，若文件不存在，则会创建一个新的文\n件。", "answer": "正确", "exam": true}, {"id": 139, "type": "填空题", "question": "122、readline()方法会读取文件中的所有行数据。\n解析：readline()方法用于从指定文件中读取一行数据，而readlines()方法用于一次性读取文件中\n的所有行数据。", "answer": "错误", "exam": true}, {"id": 140, "type": "填空题", "question": "123、文本文件和二进制文件在物理层面上有明显区别。\n解析：文本文件和二进制文件在物理层面上并没有区别，它们都是以二进制形式存储的。", "answer": "错误", "exam": true}, {"id": 141, "type": "填空题", "question": "124、with语句中必须使用as关键字来指定变量名。\n解析：with语句中as及其后面的变量名都是可选的，不是必须使用的。", "answer": "错误", "exam": true}, {"id": 142, "type": "填空题", "question": "125、Python中打开文件的内置函数是______。\n解析：Python中的内置函数open()用于打开文件并返回相应的文件对象。", "answer": "open()；", "exam": true}, {"id": 143, "type": "填空题", "question": "126、使用with语句打开文件时，代码块执行完毕后会自动调用______方法关闭文件。\n解析：with语句会在代码块执行完毕后自动调用close()方法关闭已打开的文件。", "answer": "close()；", "exam": true}, {"id": 144, "type": "填空题", "question": "127、文本文件通常使用ASCII码、______或其他字符编码方式来表示其中的字符。\n解析：文本文件中的字符可以使用ASCII码、Unicode或其他字符编码方式来表示。", "answer": "Unicode；", "exam": true}, {"id": 145, "type": "填空题", "question": "128、read()方法的默认参数size的值为______，表示一次性读取所有数据。\n解析：read()方法的size参数默认值为-1，说明一次性从文件中读取所有数据。", "answer": "-1；", "exam": true}, {"id": 146, "type": "填空题", "question": "129、向标准输出文件写入数据时，可以使用sys模块中的______文件对象。\n解析：Python的sys模块中定义了stdout标准输出文件，对应输出设备如显示器。", "answer": "stdout；", "exam": true}, {"id": 147, "type": "选择题", "question": "130、在Python中，定义类的关键字是以下哪一个？\nA、class\nB、def\nC、object\nD、new\n解析：Python中使用class关键字定义类，def用于定义函数，object是所有类的基类，new不是\nPython中的关键字。", "answer": "A", "exam": true}, {"id": 148, "type": "选择题", "question": "131、关于类属性的描述，以下错误的是？\nA、类属性属于整个类，所有对象共享\nB、类属性可以通过类直接访问\nC、类属性可以通过对象修改\nD、类属性在类定义后即存在\n解析：类属性属于类，通过对象修改类属性时，实际上是给对象添加了一个同名实例属性，并不会改\n变类属性本身。", "answer": "C", "exam": true}, {"id": 149, "type": "选择题", "question": "132、实例方法的第一个参数通常是以下哪一个？\nA、self\nB、cls\nC、this\nD、None\n解析：实例方法的第一个参数通常是self，代表调用该方法的对象；cls是类方法的第一个参数；\nthis不是Python中的关键字。", "answer": "A", "exam": true}, {"id": 150, "type": "选择题", "question": "133、以下哪种方法可以通过类直接调用？\nA、实例方法\nB、类方法\nC、静态方法\nD、以上都不可以\n解析：类方法使用@classmethod装饰，第一个参数是cls，可以通过类直接调用；实例方法需要通过\n对象调用；静态方法虽可通过类调用，但本题B选项更准确。", "answer": "B", "exam": true}, {"id": 151, "type": "选择题", "question": "134、创建类的对象时，以下语法正确的是？\nA、对象名 = 类名\nB、对象名 = 类名()\nC、对象名 = new 类名()\nD、对象名 = 类名.new()\n解析：Python中通过类名加括号的方式创建对象，不需要new关键字。", "answer": "B", "exam": true}, {"id": 152, "type": "选择题", "question": "135、面向对象编程的核心思想包括以下哪些？\nA、封装\nB、继承\nC、多态\nD、过程调用\n解析：面向对象编程的三大核心特性是封装、继承和多态，过程调用是面向过程编程的特点。", "answer": "ABC", "exam": true}, {"id": 153, "type": "选择题", "question": "136、以下关于实例属性的描述，正确的有？\nA、实例属性属于对象，每个对象独立\nB、实例属性可以在类外部动态添加\nC、实例属性可以通过类访问\nD、修改一个对象的实例属性不影响其他对象\n解析：实例属性属于对象，只能通过对象访问，每个对象的实例属性相互独立，可以动态添加。", "answer": "ABD", "exam": true}, {"id": 154, "type": "选择题", "question": "137、以下属于类的成员的有？\nA、属性\nB、方法\nC、函数\nD、变量\n解析：类的成员包括属性（类属性和实例属性）和方法（实例方法、类方法、静态方法），函数和变\n量是面向过程编程中的概念。", "answer": "AB", "exam": true}, {"id": 155, "type": "选择题", "question": "138、以下关于实例方法的描述，正确的有？\nA、实例方法的第一个参数是self\nB、实例方法只能通过对象调用\nC、实例方法中可以访问实例属性\nD、实例方法中可以调用其他实例方法\n解析：实例方法的第一个参数是self，代表调用该方法的对象，只能通过对象调用，可以访问实例属\n性和调用其他实例方法。", "answer": "ABCD", "exam": true}, {"id": 156, "type": "选择题", "question": "139、以下关于类和对象的关系，描述正确的有？\nA、类是对象的模板\nB、对象是类的实例\nC、一个类可以创建多个对象\nD、对象可以创建类\n解析：类是对象的抽象模板，对象是类的具体实例，一个类可以创建多个对象，对象不能创建类。", "answer": "ABC", "exam": true}, {"id": 157, "type": "填空题", "question": "140、面向过程编程关注的是解决问题的步骤和流程，而面向对象编程关注的是解决问题的对象。\n解析：面向过程编程强调步骤和函数调用，面向对象编程强调对象的封装、继承和多态。", "answer": "正确", "exam": true}, {"id": 158, "type": "填空题", "question": "141、类属性和实例属性在访问方式上完全相同。\n解析：类属性可以通过类和对象访问，实例属性只能通过对象访问；类属性属于类，实例属性属于对\n象。", "answer": "错误", "exam": true}, {"id": 159, "type": "填空题", "question": "142、实例方法只能访问实例属性，不能访问类属性。\n解析：实例方法可以通过self访问实例属性，也可以通过类名访问类属性，或者通过self.__class__\n访问类属性。", "answer": "错误", "exam": true}, {"id": 160, "type": "填空题", "question": "143、在Python中，所有类都默认继承自object类。\n解析：Python3中所有类都默认继承自object类，这是Python的新特性。", "answer": "正确", "exam": true}, {"id": 161, "type": "填空题", "question": "144、动态添加的实例属性会影响该类的所有对象。\n解析：动态添加的实例属性只属于添加该属性的对象，其他对象不会拥有该属性。", "answer": "错误", "exam": true}, {"id": 162, "type": "填空题", "question": "145、在Python中，创建类的对象时使用的语法是______。\n解析：通过类名加括号的方式创建对象，例如car = Car()。", "answer": "对象名 = 类名()；", "exam": true}, {"id": 163, "type": "填空题", "question": "146、类属性是定义在______的属性。\n解析：类属性定义在类的内部，所有方法的外部，属于整个类。", "answer": "类内部、方法外部；", "exam": true}, {"id": 164, "type": "填空题", "question": "147、实例方法的第一个参数是______，代表______。\n解析：实例方法的第一个参数是self，它会自动接收调用该方法的对象。", "answer": "self；调用该方法的对象；", "exam": true}, {"id": 165, "type": "填空题", "question": "148、通过对象访问属性时，若对象没有该实例属性，则会访问______。\n解析：当对象访问属性时，先查找实例属性，若不存在则查找类属性。", "answer": "类属性；", "exam": true}, {"id": 166, "type": "填空题", "question": "149、Python中支持动态添加实例属性，这体现了Python的______特性。\n解析：Python是动态语言，允许在运行时动态修改对象的属性和方法。", "answer": "动态性；", "exam": true}, {"id": 167, "type": "选择题", "question": "150、以下关于Python异常类的描述，错误的是？\nA、Exception类是所有内置非系统退出异常的基类\nB、BaseException是所有异常类型的基类\nC、KeyboardInterrupt属于系统退出异常\nD、NameError会在使用未定义变量时触发\n解析：KeyboardInterrupt是用户中断执行时产生的异常，属于非系统退出异常，而SystemExit才是\n系统退出异常。", "answer": "C", "exam": true}, {"id": 168, "type": "选择题", "question": "151、以下代码执行后输出结果是？ ```python try: print(10 / 0) except ZeroDivisionError\nas e: print(f\"Error: {e}\") else: print(\"No error\") finally: print(\"Finally block\") ```\nA、Error: division by zero Finally block\nB、No error Finally block\nC、Error: division by zero No error Finally block\nD、Finally block\n解析：代码中触发ZeroDivisionError，执行except块输出错误信息，finally块无论是否异常都会执\n行。else块仅在无异常时执行，因此不输出。", "answer": "A", "exam": true}, {"id": 169, "type": "选择题", "question": "152、以下哪种方式可以在一个except子句中捕获多个异常？\nA、except (Error1, Error2):\nB、except Error1 | Error2:\nC、except Error1 and Error2:\nD、except Error1, Error2:\n解析：在Python中，捕获多个异常需将异常类放在元组中，如except (Error1, Error2):。", "answer": "A", "exam": true}, {"id": 170, "type": "选择题", "question": "153、执行以下代码会触发什么异常？ ```python my_list = [1, 2, 3] print(my_list[5]) ```\nA、NameError\nB、IndexError\nC、AttributeError\nD、FileNotFoundError\n解析：访问列表中超出范围的索引会触发IndexError异常。", "answer": "B", "exam": true}, {"id": 171, "type": "选择题", "question": "154、关于try-except-else语句，以下描述正确的是？\nA、else块在异常发生时执行\nB、else块在无异常时执行\nC、else块无论是否异常都会执行\nD、else块必须和finally块一起使用\n解析：try-except-else语句中，else块仅在try子句无异常时执行。", "answer": "B", "exam": true}, {"id": 172, "type": "选择题", "question": "155、以下哪些异常属于Python的内置异常？\nA、NameError\nB、IndexError\nC、AttributeError\nD、CustomError\n解析：NameError、IndexError、AttributeError均为Python内置异常，CustomError是自定义异常，\n不属于内置异常。", "answer": "ABC", "exam": true}, {"id": 173, "type": "选择题", "question": "156、finally子句的特点包括？\nA、无论是否发生异常都会执行\nB、通常用于资源清理\nC、可以省略except子句单独使用\nD、执行顺序在except之后\n解析：finally子句无论异常是否发生都会执行，常用于资源清理（如关闭文件），执行顺序在\nexcept之后。但finally不能单独使用，必须配合try子句。", "answer": "ABD", "exam": true}, {"id": 174, "type": "选择题", "question": "157、以下哪些方式可以捕获所有异常？\nA、except Exception:\nB、except:\nC、except BaseException:\nD、except ZeroDivisionError:\n解析：except Exception:、except:（裸except）、except BaseException:均可捕获所有异常。\nexcept ZeroDivisionError:仅捕获特定异常。", "answer": "ABC", "exam": true}, {"id": 175, "type": "选择题", "question": "158、异常信息通常包含哪些内容？\nA、异常代码所在行号\nB、异常类型\nC、异常描述信息\nD、程序运行时间\n解析：异常信息包含行号、异常类型和描述信息，程序运行时间不属于异常信息内容。", "answer": "ABC", "exam": true}, {"id": 176, "type": "选择题", "question": "159、以下哪些情况会触发NameError？\nA、使用未定义的变量\nB、调用未定义的函数\nC、访问列表中不存在的索引\nD、使用未导入的模块\n解析：使用未定义变量、未定义函数、未导入模块会触发NameError。访问列表不存在索引会触发\nIndexError。", "answer": "ABD", "exam": true}, {"id": 177, "type": "填空题", "question": "160、Exception类是所有异常类型的基类。\n解析：BaseException才是所有异常类型的基类，Exception是其派生的子类。", "answer": "错误", "exam": true}, {"id": 178, "type": "填空题", "question": "161、try-except-else语句中，else块在异常发生时执行。\n解析：else块仅在try子句无异常时执行。", "answer": "错误", "exam": true}, {"id": 179, "type": "填空题", "question": "162、打开不存在的文件会触发FileNotFoundError。\n解析：当尝试打开不存在的文件时，Python会触发FileNotFoundError异常。", "answer": "正确", "exam": true}, {"id": 180, "type": "填空题", "question": "163、使用except子句捕获异常时，必须指定异常类型。\n解析：可以使用裸except（不指定异常类型）捕获所有异常，但不推荐，因为可能隐藏未知错误。", "answer": "错误", "exam": true}, {"id": 181, "type": "填空题", "question": "164、未处理的异常会导致程序终止并输出异常信息。\n解析：如果程序发生异常且未被捕获处理，Python解释器会终止程序并打印异常信息。", "answer": "正确", "exam": true}, {"id": 182, "type": "填空题", "question": "165、Python中，使用______语句可以捕获并处理异常。\n解析：try-except语句是Python中用于捕获和处理异常的基本结构。", "answer": "try-except；", "exam": true}, {"id": 183, "type": "填空题", "question": "166、BaseException派生的四个子类分别是Exception、KeyboardInterrupt、GeneratorExit和\n______。\n解析：BaseException的四个直接子类为Exception、KeyboardInterrupt、GeneratorExit和\nSystemExit。", "answer": "SystemExit；", "exam": true}, {"id": 184, "type": "填空题", "question": "167、finally子句常用于______操作，如关闭文件。\n解析：finally子句无论异常是否发生都会执行，因此常用于资源清理操作。", "answer": "资源清理；", "exam": true}, {"id": 185, "type": "填空题", "question": "168、访问对象不存在的属性会触发______异常。\n解析：当尝试访问对象不存在的属性或方法时，会触发AttributeError异常。", "answer": "AttributeError；", "exam": true}, {"id": 186, "type": "填空题", "question": "169、使用except子句捕获异常时，可以通过______关键字获取异常的具体信息。\n解析：在except子句中使用as关键字可以将异常对象赋值给变量，从而获取异常信息。", "answer": "as；", "exam": true}, {"id": 187, "type": "选择题", "question": "170、以下哪个Python库常用于处理需要JavaScript渲染的动态网页内容？\nA、Requests\nB、Selenium\nC、Beautiful Soup\nD、re\n解析：Selenium库用于处理需要JavaScript渲染或动态内容的网页，通过模拟真实的浏览器环境加载\n执行JavaScript代码，从而爬取动态生成的内容。Requests主要用于发送HTTP请求，Beautiful Soup\n用于解析HTML/XML文档，re用于正则表达式匹配，均不直接处理JavaScript渲染的动态内容。", "answer": "B", "exam": true}, {"id": 188, "type": "选择题", "question": "171、以下哪个库是基于NumPy开发，专注于数据处理、分析和可视化的？\nA、SciPy\nB、pandas\nC、Matplotlib\nD、Scikit-learn\n解析：pandas是基于NumPy开发的库，专注于数据处理、数据分析和数据可视化，提供灵活的数据结\n构和丰富的函数。SciPy用于科学计算，Matplotlib用于绘图，Scikit-learn用于机器学习，均不符\n合题干描述。", "answer": "B", "exam": true}, {"id": 189, "type": "选择题", "question": "172、以下哪个库基于Echarts JavaScript库，可生成交互式数据可视化图表？\nA、Matplotlib\nB、Seaborn\nC、Pyecharts\nD、Plotly\n解析：Pyecharts基于Echarts JavaScript库，提供丰富的图表类型和灵活的样式定制，用于生成交\n互式数据可视化图表。Matplotlib和Seaborn是静态绘图库，Plotly虽支持交互但并非基于Echarts。", "answer": "C", "exam": true}, {"id": 190, "type": "选择题", "question": "173、以下哪个深度学习框架具有动态计算图的特点，便于模型开发和调试？\nA、Scikit-learn\nB、TensorFlow\nC、PyTorch\nD、Keras\n解析：PyTorch具有动态计算图的特点，模型开发和调试更加直观灵活。TensorFlow采用静态计算图\n（2.x版本支持动态但非原生），Scikit-learn是传统机器学习库，Keras是高级API（可基于\nTensorFlow/PyTorch），均不符合题干描述。", "answer": "C", "exam": true}, {"id": 191, "type": "选择题", "question": "174、以下属于Python网络爬虫常用库的有哪些？\nA、Requests\nB、Beautiful Soup\nC、Scrapy\nD、NumPy\n解析：Requests用于发送HTTP请求，Beautiful Soup用于解析HTML/XML，Scrapy是网络爬虫框架，均\n为网络爬虫常用库。NumPy是科学计算库，用于数组处理，不属于网络爬虫领域。", "answer": "ABC", "exam": true}, {"id": 192, "type": "选择题", "question": "175、以下属于Python数据分析常用库的有哪些？\nA、NumPy\nB、pandas\nC、SciPy\nD、Scikit-learn\n解析：NumPy提供数组和科学计算功能，pandas专注于数据处理分析，SciPy用于科学计算（如插值、\n积分），均为数据分析常用库。Scikit-learn是机器学习库，不属于数据分析基础库。", "answer": "ABC", "exam": true}, {"id": 193, "type": "选择题", "question": "176、以下属于深度学习框架的有哪些？\nA、TensorFlow\nB、PyTorch\nC、Scikit-learn\nD、Keras\n解析：TensorFlow和PyTorch是主流深度学习框架，Keras是高级深度学习API（可基于TensorFlow\n/PyTorch），均属于深度学习范畴。Scikit-learn是传统机器学习库，不支持深度学习。", "answer": "ABD", "exam": true}, {"id": 194, "type": "选择题", "question": "177、Python计算生态可应用于以下哪些领域？\nA、网络爬虫\nB、数据可视化\nC、游戏开发\nD、机器学习\n解析：Python计算生态覆盖网络爬虫、数据分析、数据可视化、机器学习、游戏开发等多个领域，题\n干中所有选项均属于其应用领域。", "answer": "ABCD", "exam": true}, {"id": 195, "type": "填空题", "question": "178、Requests库支持会话管理和文件上传下载功能。\n解析：Requests库提供简洁强大的API，支持会话管理、文件上传下载、SSL验证、重定向处理等功\n能，题干描述正确。", "answer": "正确", "exam": true}, {"id": 196, "type": "填空题", "question": "179、Scikit-learn是深度学习框架，支持神经网络模型训练。\n解析：Scikit-learn是传统机器学习库，基于NumPy、SciPy和Matplotlib，提供分类、回归等算法，\n但不支持深度学习（如神经网络）。深度学习框架如TensorFlow、PyTorch才支持神经网络训练，题\n干描述错误。", "answer": "错误", "exam": true}, {"id": 197, "type": "填空题", "question": "180、Seaborn是基于Matplotlib的高级封装库，可简化图表绘制。\n解析：Seaborn基于Matplotlib进行高级封装，提供更简单的API和更美观的默认样式，可轻松绘制各\n类统计图表，题干描述正确。", "answer": "正确", "exam": true}, {"id": 198, "type": "填空题", "question": "181、jieba库仅支持中文分词，不支持词性标注功能。\n解析：jieba库不仅支持中文分词，还支持词性标注、关键词提取、文本分类等功能，题干描述错\n误。", "answer": "错误", "exam": true}, {"id": 199, "type": "填空题", "question": "182、Python计算生态仅包含Python语言本身，不包括第三方库和框架。\n解析：Python计算生态是由Python语言及其周边的工具、框架、库和应用构成的生态系统，题干描述\n错误。", "answer": "错误", "exam": true}, {"id": 200, "type": "填空题", "question": "183、Python中用于发送HTTP请求的流行库是______。\n解析：Requests库是Python中用于发送HTTP请求的常用库，提供简洁高效的API处理各类HTTP请求。", "answer": "Requests；", "exam": true}, {"id": 201, "type": "填空题", "question": "184、NumPy中表示N维数组的对象是______。\n解析：NumPy提供ndarray对象用于存储和处理大型矩阵，支持高效的科学计算。", "answer": "ndarray；", "exam": true}, {"id": 202, "type": "填空题", "question": "185、用于处理PDF文档的Python库是______。\n解析：PyPDF2库支持PDF文件的信息提取、页面拆分合并、加密解密等操作。", "answer": "PyPDF2；", "exam": true}, {"id": 203, "type": "填空题", "question": "186、谷歌开发的开源深度学习框架是______。\n解析：TensorFlow是谷歌开发的开源深度学习框架，支持模型构建、训练和部署。", "answer": "TensorFlow；", "exam": true}, {"id": 204, "type": "填空题", "question": "187、基于Echarts的Python可视化库是______。\n解析：Pyecharts使用Echarts作为底层引擎，可生成交互式数据可视化图表。", "answer": "Pyecharts；", "exam": true}, {"id": 205, "type": "选择题", "question": "188、Python中用于输出内容的内置函数是？\nA、print()\nB、input()\nC、output()\nD、write()\n解析：Python中print()函数用于输出内容，input()用于获取用户输入，output()不是内置函数，\nwrite()是文件对象的方法。", "answer": "A", "exam": true}, {"id": 206, "type": "选择题", "question": "189、以下哪个是Python中的注释符号？\nA、//\nB、#\nC、/* */\nD、--\n解析：Python中单行注释使用#，//是Python中的整除运算符，/* */是C语言风格的注释，--不是\nPython的注释符号。", "answer": "B", "exam": true}, {"id": 207, "type": "选择题", "question": "190、以下哪个不是Python的关键字？\nA、if\nB、else\nC、elif\nD、endif\n解析：Python中条件判断使用if、else、elif，没有endif关键字。", "answer": "D", "exam": true}, {"id": 208, "type": "选择题", "question": "191、Python中定义函数的关键字是？\nA、def\nB、function\nC、func\nD、define\n解析：Python中使用def关键字定义函数，其他选项不是Python的函数定义关键字。", "answer": "A", "exam": true}, {"id": 209, "type": "选择题", "question": "192、以下哪个数据类型是Python中的不可变类型？\nA、列表(list)\nB、字典(dict)\nC、元组(tuple)\nD、集合(set)\n解析：Python中不可变类型包括整数、字符串、元组等，列表、字典、集合是可变类型。", "answer": "C", "exam": true}, {"id": 210, "type": "选择题", "question": "193、Python中用于获取用户输入的函数是？\nA、get()\nB、input()\nC、read()\nD、scan()\n解析：Python中input()函数用于获取用户输入，get()是字典的方法，read()是文件对象的方法，\nscan()不是内置函数。", "answer": "B", "exam": true}, {"id": 211, "type": "选择题", "question": "194、以下哪个运算符是Python中的幂运算？\nA、*\nB、**\nC、^\nD、%\n解析：Python中**表示幂运算，*是乘法，^是按位异或，%是取模运算。", "answer": "B", "exam": true}, {"id": 212, "type": "选择题", "question": "195、Python中以下哪个语句可以正确创建一个空列表？\nA、list = []\nB、list = {}\nC、list = ()\nD、list = <>\n解析：Python中[]创建空列表，{}创建空字典，()创建空元组，<>不是合法的语法。", "answer": "A", "exam": true}, {"id": 213, "type": "选择题", "question": "196、以下哪个不是Python的内置数据类型？\nA、int\nB、float\nC、string\nD、array\n解析：Python的内置数据类型包括int、float、str（字符串）等，array不是内置数据类型，需要导\n入array模块使用。", "answer": "D", "exam": true}, {"id": 214, "type": "选择题", "question": "197、Python中以下哪个表达式的结果为True？\nA、3 > 5\nB、10 == '10'\nC、not False\nD、5 < 3\n解析：not False的结果是True，3>5和5<3为False，10是整数，'10'是字符串，两者不相等。", "answer": "C", "exam": true}, {"id": 215, "type": "选择题", "question": "198、在Python中，以下哪个不属于基本数据类型？\nA、int\nB、list\nC、str\nD、float\n解析：Python的基本数据类型包括数值类型（int、float、complex）、字符串（str）、布尔值\n（bool）等，list属于复合数据类型中的序列类型。", "answer": "B", "exam": true}, {"id": 216, "type": "选择题", "question": "199、执行语句`print(type(3.14))`的输出结果是？\nA、<class 'int'>\nB、<class 'float'>\nC、<class 'str'>\nD、<class 'bool'>\n解析：3.14是浮点数，使用type()函数查询其类型会返回<class 'float'>。", "answer": "B", "exam": true}, {"id": 217, "type": "选择题", "question": "200、以下哪个是Python中的布尔值？\nA、True\nB、true\nC、TRUE\nD、t\n解析：Python中的布尔值只有True和False两种，且首字母必须大写。", "answer": "A", "exam": true}, {"id": 218, "type": "选择题", "question": "201、在Python中，字符串需要用什么符号包裹？\nA、单引号或双引号\nB、只能用单引号\nC、只能用双引号\nD、不需要包裹\n解析：Python中的字符串可以用单引号（'）或双引号（\"）包裹，两者功能相同，当字符串中包含其\n中一种引号时，可以使用另一种引号包裹以避免转义。", "answer": "A", "exam": true}, {"id": 219, "type": "选择题", "question": "202、执行语句`print(10 + 3.5)`的结果是？\nA、13\nB、13.5\nC、13.0\nD、报错\n解析：int类型和float类型可以直接进行运算，结果会自动转换为float类型，10 + 3.5 = 13.5。", "answer": "B", "exam": true}, {"id": 220, "type": "选择题", "question": "203、以下哪个是复数类型的正确表示？\nA、3+4j\nB、3+4J\nC、3+4\nD、3*4j\n解析：Python中的复数由实部和虚部组成，虚部用小写字母j表示，正确格式为实部+虚部j，如\n3+4j。", "answer": "A", "exam": true}, {"id": 221, "type": "选择题", "question": "204、执行`type('5')`的结果是？\nA、int\nB、float\nC、str\nD、bool\n解析：'5'被单引号包裹，属于字符串类型，因此type()函数返回str。", "answer": "C", "exam": true}, {"id": 222, "type": "选择题", "question": "205、以下哪个操作可以将字符串'123'转换为整数？\nA、int('123')\nB、float('123')\nC、str('123')\nD、bool('123')\n解析：int()函数可以将符合整数格式的字符串转换为整数类型，float()转换为浮点数，str()是转\n换为字符串，bool()转换为布尔值。", "answer": "A", "exam": true}, {"id": 223, "type": "选择题", "question": "206、Python中，以下哪个数据类型是不可变的？\nA、list\nB、str\nC、dict\nD、set\n解析：字符串（str）是不可变数据类型，即创建后不能修改其内容；list、dict、set是可变数据类\n型。", "answer": "B", "exam": true}, {"id": 224, "type": "选择题", "question": "207、执行`print(3 == 3.0)`的结果是？\nA、True\nB、False\nC、1\nD、0\n解析：在Python中，整数3和浮点数3.0的值相等，使用==比较时会返回True，尽管它们的类型不同。", "answer": "A", "exam": true}, {"id": 225, "type": "选择题", "question": "208、在Python中，以下哪个关键字用于表示条件判断语句的开始？\nA、if\nB、for\nC、while\nD、break\n解析：Python中条件判断语句以if关键字开头，用于根据条件执行不同代码块。for和while是循环关\n键字，break用于终止循环。", "answer": "A", "exam": true}, {"id": 226, "type": "选择题", "question": "209、执行以下代码，输出结果是什么？ x = 5 if x > 10: print(\"A\") elif x > 3: print(\"B\")\nelse: print(\"C\")\nA、A\nB、B\nC、C\nD、无输出\n解析：x=5满足elif x>3的条件，因此执行print(\"B\")语句。", "answer": "B", "exam": true}, {"id": 227, "type": "选择题", "question": "210、Python中while循环的特点是？\nA、先判断条件，条件为真时执行循环体\nB、先执行循环体，再判断条件\nC、循环次数固定\nD、只能用于遍历序列\n解析：while循环先判断条件表达式，若为True则执行循环体，否则退出循环。do-while结构（先执\n行后判断）在Python中需通过其他方式模拟。", "answer": "A", "exam": true}, {"id": 228, "type": "选择题", "question": "211、以下哪个语句可以立即终止当前循环？\nA、continue\nB、break\nC、pass\nD、exit\n解析：break语句用于终止当前所在的循环或switch语句；continue用于跳过本次循环剩余语句，进\n入下一次循环；pass是空语句，不执行任何操作；exit()是退出程序的函数。", "answer": "B", "exam": true}, {"id": 229, "type": "选择题", "question": "212、执行以下代码，输出结果是？ for i in range(3): if i == 1: continue print(i, end=\"\n\")\nA、0 1 2\nB、0 2\nC、1 2\nD、0\n解析：当i=1时执行continue语句，跳过print(i)，因此输出0和2。", "answer": "B", "exam": true}, {"id": 230, "type": "选择题", "question": "213、以下关于for循环的说法，正确的是？\nA、只能遍历列表类型数据\nB、可以遍历所有可迭代对象\nC、循环变量的值不可修改\nD、循环体至少执行一次\n解析：Python的for循环可以遍历任何可迭代对象（如列表、元组、字符串、字典等），只要对象实\n现了__iter__方法。", "answer": "B", "exam": true}, {"id": 231, "type": "选择题", "question": "214、以下代码的输出结果是？ count = 0 while count < 3: print(count) count += 1 else:\nprint(\"End\")\nA、0\\n1\\n2\\nEnd\nB、0\\n1\\n2\nC、End\nD、0\\nEnd\n解析：while循环正常结束后会执行else块，count从0到2依次输出，循环结束后执行print(\"End\")。", "answer": "A", "exam": true}, {"id": 232, "type": "选择题", "question": "215、以下代码中，break语句会终止哪个循环？ for i in range(2): for j in range(3): if j\n== 1: break print(j, end=\" \")\nA、外层for循环\nB、内层for循环\nC、两个循环都终止\nD、不终止任何循环\n解析：break语句仅终止当前所在的内层for循环，外层循环继续执行。", "answer": "B", "exam": true}, {"id": 233, "type": "选择题", "question": "216、以下哪个关键字用于跳过当前循环的剩余语句，直接开始下一次循环？\nA、break\nB、continue\nC、pass\nD、return\n解析：continue语句用于跳过当前循环的剩余语句，直接进入下一次循环判断；break终止循环；\npass是空语句；return用于函数返回。", "answer": "B", "exam": true}, {"id": 234, "type": "选择题", "question": "217、执行以下代码，输出结果是什么？ num = 3 if num % 2 == 0: print(\"偶数\") else: print\n(\"奇数\")\nA、偶数\nB、奇数\nC、无输出\nD、报错\n解析：num=3对2取余结果为1，不满足if条件，执行else块的print(\"奇数\")语句。", "answer": "B", "exam": true}, {"id": 235, "type": "选择题", "question": "218、在Python中，执行以下代码后，变量s的值是？ ```python s = 'hello' s[0] = 'H' ```\nA、'Hello'\nB、'hello'\nC、引发TypeError错误\nD、引发IndexError错误\n解析：Python中的字符串是不可变对象，无法通过索引直接修改单个字符。尝试执行`s[0] = 'H'`会\n引发TypeError错误，提示字符串不支持项目赋值。", "answer": "C", "exam": true}, {"id": 236, "type": "选择题", "question": "219、以下代码的输出结果是？ ```python print('He said, \\\"I\\'m fine.\\\"') ```\nA、He said, \"I'm fine.\"\nB、He said, \\\"I\\'m fine.\\\"\nC、He said, \"I\\'m fine.\"\nD、He said, I'm fine.\n解析：Python中使用反斜杠（\\）作为转义字符。\\'用于表示单引号，\\\"用于表示双引号。因此代码\n中的字符串会被解析为`He said, \"I'm fine.\"`。", "answer": "A", "exam": true}, {"id": 237, "type": "选择题", "question": "220、执行以下代码后，变量result的值是？ ```python a = '5' b = '3' result = a + b ```\nA、8\nB、'8'\nC、'53'\nD、53\n解析：在Python中，`+`运算符用于字符串时表示拼接操作，而非数值相加。变量a和b都是字符串类\n型，因此`a + b`会将两个字符串连接为'53'。", "answer": "C", "exam": true}, {"id": 238, "type": "选择题", "question": "221、以下代码的输出结果是？ ```python name = 'Alice' age = 25 print(f'My name is {name.\nupper()}, and I am {age + 5} years old.') ```\nA、My name is ALICE, and I am 30 years old.\nB、My name is {name.upper()}, and I am {age + 5} years old.\nC、My name is Alice, and I am 30 years old.\nD、My name is ALICE, and I am 25 years old.\n解析：f-string（格式化字符串字面值）中可以直接嵌入表达式。`name.upper()`会将'Alice'转换\n为'ALICE'，`age + 5`会计算25+5=30。因此输出结果为指定选项。", "answer": "A", "exam": true}, {"id": 239, "type": "选择题", "question": "222、执行以下代码后，变量sub的结果是？ ```python s = 'abcdefg' sub = s[2:5] ```\nA、'cde'\nB、'bcd'\nC、'def'\nD、'cdef'\n解析：字符串切片`s[start:end]`会返回从索引start开始（包含）到索引end结束（不包含）的子字\n符串。s[2:5]对应索引2、3、4的字符，即'c'、'd'、'e'，结果为'cde'。", "answer": "A", "exam": true}, {"id": 240, "type": "选择题", "question": "223、以下哪个方法可以将字符串中的所有小写字母转换为大写字母？\nA、upper()\nB、lower()\nC、capitalize()\nD、title()\n解析：upper()方法将字符串中的所有小写字母转换为大写；lower()方法相反；capitalize()方法仅\n将字符串的第一个字符转换为大写；title()方法将每个单词的首字母转换为大写。", "answer": "A", "exam": true}, {"id": 241, "type": "选择题", "question": "224、执行以下代码后，变量res的值是？ ```python s1 = 'apple' s2 = 'App' res = s1 > s2\n```\nA、True\nB、False\nC、None\nD、引发错误\n解析：Python字符串比较基于字符的Unicode编码值。大写字母的编码值小于小写字母（如'A'的编码\n是65，'a'是97）。比较's1 > s2'时，首先比较第一个字符：'a'（97） > 'A'（65），因此结果为\nTrue。", "answer": "A", "exam": true}, {"id": 242, "type": "选择题", "question": "225、执行以下代码后，变量count的值是？ ```python s = 'Hello, hello, HELLO' count = s.\ncount('hello') ```\nA、1\nB、2\nC、3\nD、0\n解析：count()方法用于统计子字符串在原字符串中出现的次数，且区分大小写。原字符串中只有一\n个'hello'（小写），因此count的值为1。", "answer": "A", "exam": true}, {"id": 243, "type": "选择题", "question": "226、执行以下代码后，变量s的值是？ ```python s = 'test' s += 'ing' ```\nA、'testing'\nB、'test'\nC、引发TypeError错误\nD、引发AttributeError错误\n解析：虽然字符串是不可变对象，但`+=`运算符会创建一个新的字符串对象，并将变量s指向新对\n象。因此执行`s += 'ing'`后，s的值变为'testing'。", "answer": "A", "exam": true}, {"id": 244, "type": "选择题", "question": "227、在Python中，关于字符串的描述，以下说法正确的是？\nA、字符串是可变对象，可以直接通过索引修改单个字符\nB、使用单引号或双引号定义的字符串完全等价，没有任何区别\nC、`str.replace()`方法会修改原字符串\nD、使用三引号可以定义跨多行的字符串\n解析：选项A错误，字符串是不可变对象，不能直接通过索引修改单个字符；选项B错误，单引号和双\n引号定义的字符串基本等价，但如果字符串中包含单引号，则使用双引号更方便，反之亦然；选项C\n错误，`str.replace()`方法不会修改原字符串，而是返回一个新的字符串；选项D正确，使用三引号\n（'''或\"\"\"）可以定义跨多行的字符串。", "answer": "D", "exam": true}, {"id": 245, "type": "选择题", "question": "228、以下哪个Python数据结构是有序且可变的？\nA、元组(tuple)\nB、列表(list)\nC、集合(set)\nD、字典(dict)\n解析：列表(list)是Python中有序且可变的数据结构，支持元素的添加、删除和修改；元组(tuple)\n有序但不可变；集合(set)无序且不重复；字典(dict)无序（Python3.7+开始有序）且以键值对形式\n存储。", "answer": "B", "exam": true}, {"id": 246, "type": "选择题", "question": "229、Python字典中的键必须是以下哪种类型？\nA、可变类型\nB、不可变类型\nC、数字类型\nD、字符串类型\n解析：Python字典的键必须是不可变类型（如整数、字符串、元组），因为字典通过哈希表实现，可\n变类型无法被哈希；值可以是任意类型。", "answer": "B", "exam": true}, {"id": 247, "type": "选择题", "question": "230、以下哪种操作可以用于Python集合去重？\nA、使用append()方法\nB、将列表转换为集合\nC、使用extend()方法\nD、使用insert()方法\n解析：集合(set)的特点是元素不重复，因此将包含重复元素的列表转换为集合可以自动去重；\nappend()、extend()、insert()是列表的方法，用于添加元素，不能去重。", "answer": "B", "exam": true}, {"id": 248, "type": "选择题", "question": "231、以下哪个不是Python的序列类型？\nA、列表(list)\nB、元组(tuple)\nC、字符串(str)\nD、集合(set)\n解析：Python的序列类型包括列表、元组、字符串，它们都支持索引和切片操作；集合(set)是无序\n的，不属于序列类型。", "answer": "D", "exam": true}, {"id": 249, "type": "选择题", "question": "232、以下关于Python元组的描述正确的是？\nA、元组中的元素可以修改\nB、元组使用方括号[]定义\nC、元组是不可变的\nD、元组不支持索引操作\n解析：元组(tuple)是Python中不可变的有序数据结构，使用圆括号()定义，支持索引和切片操作，\n但不能修改元素；列表使用方括号[]定义且可变。", "answer": "C", "exam": true}, {"id": 250, "type": "选择题", "question": "233、Python列表中用于在末尾添加元素的方法是？\nA、insert()\nB、append()\nC、extend()\nD、remove()\n解析：append()方法用于在列表末尾添加单个元素；insert()用于在指定位置插入元素；extend()用\n于将另一个可迭代对象的元素添加到列表末尾；remove()用于删除指定元素。", "answer": "B", "exam": true}, {"id": 251, "type": "选择题", "question": "234、以下哪个方法可以获取Python字典中所有的值？\nA、keys()\nB、values()\nC、items()\nD、get()\n解析：values()方法返回字典中所有值的视图对象；keys()返回所有键；items()返回所有键值对；\nget()用于获取指定键的值，不存在时返回默认值。", "answer": "B", "exam": true}, {"id": 252, "type": "选择题", "question": "235、Python列表的索引从以下哪个数字开始？\nA、-1\nB、0\nC、1\nD、任意数字\n解析：Python中序列类型（如列表、字符串、元组）的索引从0开始，支持正向索引（从0递增）和反\n向索引（从-1递减）。", "answer": "B", "exam": true}, {"id": 253, "type": "选择题", "question": "236、以下代码的输出结果是？ ```python d = {'a': [1, 2, 3], 'b': (4, 5, 6)} print(d['a']\n[1]) ```\nA、1\nB、2\nC、4\nD、5\n解析：字典`d`中键`'a'`对应的值是列表`[1,2,3]`，列表索引从0开始，`d['a'][1]`表示获取列表\n中的第二个元素，即2。", "answer": "B", "exam": true}, {"id": 254, "type": "选择题", "question": "237、以下哪种数据结构可以存储不同类型的元素？\nA、仅列表\nB、仅元组\nC、列表和元组\nD、仅集合\n解析：Python中的列表和元组都支持存储不同类型的元素（如整数、字符串、列表等）；集合中的元\n素必须是不可变类型，但可以包含不同类型的不可变元素；字典的值可以是任意类型，但键必须是不\n可变类型。", "answer": "C", "exam": true}, {"id": 255, "type": "选择题", "question": "238、以下Python函数定义中，语法正确的是？\nA、def func(a = 1, b): return a + b\nB、def func(a, *args, b): return a + sum(args) + b\nC、def func(a, b = 2, **kwargs): return a + b + sum(kwargs.values())\nD、def func(a, b = 3, *args): return a + b + sum(args)\n解析：Python函数参数定义顺序应为：位置参数→默认参数→可变位置参数(*args)→关键字参数→\n可变关键字参数(**kwargs)。选项A中默认参数在位置参数前，错误；选项B中可变位置参数后不能直\n接跟位置参数b，错误；选项D中默认参数后不能直接跟可变位置参数，错误；选项C符合参数定义规\n则，正确。", "answer": "C", "exam": true}, {"id": 256, "type": "选择题", "question": "239、以下关于Python函数返回值的描述，错误的是？\nA、函数可以通过return语句返回多个值，实际返回的是一个元组\nB、没有return语句的函数，默认返回None\nC、函数的return语句可以出现在函数体的任意位置，但只能执行一次\nD、函数返回的多个值可以通过解包赋值给多个变量\n解析：函数的return语句确实可以出现在函数体的任意位置，但函数中可以有多个return语句，只是\n只会执行第一个遇到的return语句，而不是只能有一个return语句。例如：def func(x): if x>0:\nreturn 1 else: return -1，这里有两个return语句，但只会执行其中一个。", "answer": "C", "exam": true}, {"id": 257, "type": "选择题", "question": "240、以下关于递归函数的描述，正确的是？\nA、递归函数必须有返回值\nB、递归函数的执行效率通常比非递归函数高\nC、递归函数必须有明确的终止条件\nD、递归函数调用时，每次调用的参数必须相同\n解析：递归函数的核心是函数调用自身，为避免无限递归，必须有明确的终止条件（基线条件）。选\n项A错误，递归函数可以没有返回值；选项B错误，递归函数因调用栈开销，执行效率通常低于非递归\n函数；选项D错误，递归调用时参数需逐步逼近终止条件，不能固定不变。", "answer": "C", "exam": true}, {"id": 258, "type": "选择题", "question": "241、以下关于lambda表达式的描述，错误的是？\nA、lambda表达式可以作为函数的参数\nB、lambda表达式可以有多个参数，但只能有一个表达式\nC、lambda表达式可以包含循环语句\nD、lambda表达式的返回值是表达式的计算结果\n解析：lambda表达式是匿名函数，语法为lambda 参数: 表达式，其中表达式必须是单个表达式，不\n能包含循环、条件语句块等复杂结构。选项A正确，如sorted函数的key参数可以是lambda表达式；选\n项B正确，如lambda x,y: x+y；选项D正确，lambda表达式的返回值就是表达式的计算结果。", "answer": "C", "exam": true}, {"id": 259, "type": "选择题", "question": "242、执行以下代码后，变量x的值是？ def func(): global x x = 5 x += 3 x = 10 func()\nA、10\nB、5\nC、8\nD、13\n解析：函数func中使用global关键字声明x为全局变量，因此在函数内部对x的修改会影响全局变量\nx。初始全局x=10，调用func()后，x被重新赋值为5，再执行x +=3得到8，因此最终全局x的值为8。", "answer": "C", "exam": true}, {"id": 260, "type": "选择题", "question": "243、以下关于Python可变参数的描述，正确的是？\nA、可变位置参数(*args)接收的参数会被打包成字典\nB、可变关键字参数(**kwargs)接收的参数会被打包成元组\nC、函数定义中，可变位置参数(*args)必须在可变关键字参数(**kwargs)之前\nD、函数调用时，可变位置参数(*args)必须以关键字参数形式传入\n解析：Python函数参数定义顺序为：位置参数→默认参数→可变位置参数(*args)→关键字参数→可\n变关键字参数(**kwargs)。选项A错误，可变位置参数(*args)打包成元组；选项B错误，可变关键字\n参数(**kwargs)打包成字典；选项D错误，可变位置参数(*args)接收的是位置参数，而非关键字参\n数。", "answer": "C", "exam": true}, {"id": 261, "type": "选择题", "question": "244、以下函数中，不属于Python内置高阶函数的是？\nA、map\nB、filter\nC、reduce\nD、sorted\n解析：高阶函数是指可以接收函数作为参数或返回函数的函数。map、filter、sorted都是Python内\n置高阶函数；reduce在Python3中已从全局命名空间移至functools模块，不属于内置高阶函数（需\nimport functools后使用）。", "answer": "C", "exam": true}, {"id": 262, "type": "选择题", "question": "245、执行以下代码后，输出结果是？ x = 10 def outer(): x = 20 def inner(): nonlocal x x\n+= 5 return x return inner result = outer()() print(result)\nA、15\nB、25\nC、10\nD、20\n解析：函数outer内部定义了变量x=20，inner函数使用nonlocal关键字声明x为非局部变量（即外层\n函数outer的局部变量），因此inner函数中x +=5会修改outer函数中的x值（20+5=25）。outer()()\n表示调用outer函数返回inner函数后立即调用inner函数，最终返回25。", "answer": "B", "exam": true}, {"id": 263, "type": "选择题", "question": "246、以下关于Python函数参数传递的描述，正确的是？\nA、Python中所有参数传递都是值传递\nB、Python中所有参数传递都是引用传递\nC、Python中不可变对象（如int、str、tuple）采用值传递，可变对象（如list、dict）采用引用\n传递\nD、Python中函数参数传递方式与对象类型无关\n解析：Python中参数传递方式取决于对象类型：不可变对象（如int、str、tuple）传递的是值的拷\n贝，函数内部修改不会影响外部变量；可变对象（如list、dict）传递的是引用，函数内部修改会影\n响外部变量。选项A、B错误，传递方式与对象类型相关；选项D错误，传递方式与对象类型密切相\n关。", "answer": "C", "exam": true}, {"id": 264, "type": "选择题", "question": "247、以下关于Python函数装饰器的描述，错误的是？\nA、装饰器本质是一个函数，用于修改其他函数的功能\nB、装饰器可以嵌套使用\nC、装饰器必须接收一个函数作为参数\nD、装饰器可以通过@语法糖使用\n解析：装饰器本质是一个函数或类，用于修改其他函数的功能。装饰器可以是无参装饰器（接收一个\n函数作为参数），也可以是有参装饰器（先接收参数，返回一个装饰器函数）。例如：def\ndecorator_with_arg(arg): def decorator(func): def wrapper(): print(arg) func() return\nwrapper return decorator，这里decorator_with_arg是有参装饰器，不直接接收函数参数，而是接\n收自定义参数后返回装饰器函数。", "answer": "C", "exam": true}, {"id": 265, "type": "选择题", "question": "248、在Python中，若要以二进制只读模式打开文件`data.bin`，以下哪个选项的代码是正确的？\nA、open('data.bin', 'r')\nB、open('data.bin', 'rb')\nC、open('data.bin', 'w')\nD、open('data.bin', 'wb')\n解析：Python中文件打开模式`rb`表示二进制只读模式，`r`是文本只读，`w`是文本写入，`wb`是二\n进制写入。", "answer": "B", "exam": true}, {"id": 266, "type": "选择题", "question": "249、使用`json`模块将Python字典写入文件时，以下哪个方法可以实现格式化输出（带缩进）？\nA、json.dump(data, f, indent=4)\nB、json.dumps(data, f, indent=4)\nC、json.load(f, indent=4)\nD、json.loads(f, indent=4)\n解析：`json.dump()`用于将数据写入文件对象，`indent`参数控制缩进；`dumps()`返回字符串，\n`load`/`loads`用于读取。", "answer": "A", "exam": true}, {"id": 267, "type": "选择题", "question": "250、以下哪种方式可以确保文件操作后自动关闭文件？\nA、使用`try-finally`块手动调用`close()`\nB、使用`with`语句\nC、直接打开文件后不处理\nD、使用`os.close()`函数\n解析：`with`语句会自动管理文件资源，即使发生异常也能确保文件关闭，是推荐的文件操作方式。", "answer": "B", "exam": true}, {"id": 268, "type": "选择题", "question": "251、在Python中，要获取当前脚本所在目录的绝对路径，以下哪个模块的方法最适合？\nA、os.getcwd()\nB、os.path.abspath(__file__)\nC、os.path.dirname(os.path.abspath(__file__))\nD、sys.path[0]\n解析：`__file__`是当前脚本路径，`os.path.abspath`获取绝对路径，`os.path.dirname`取目录部\n分，组合后得到脚本所在目录。", "answer": "C", "exam": true}, {"id": 269, "type": "选择题", "question": "252、使用`csv`模块读取CSV文件时，若要跳过表头行，以下哪种方法正确？\nA、reader = csv.reader(f); next(reader)\nB、reader = csv.reader(f, skip_header=True)\nC、csv.reader(f).skip(1)\nD、csv.reader(f, header=False)\n解析：`csv.reader`返回的迭代器可通过`next()`方法跳过一行，`csv`模块无`skip_header`参数，\n`header=False`是`csv.DictReader`的参数。", "answer": "A", "exam": true}, {"id": 270, "type": "选择题", "question": "253、以下哪种异常会在尝试打开不存在的文件时抛出？\nA、FileNotFoundError\nB、IOError\nC、OSError\nD、ValueError\n解析：Python 3中打开不存在的文件会抛出`FileNotFoundError`，它是`OSError`的子类，\n`IOError`在Python 3中已被合并到`OSError`。", "answer": "A", "exam": true}, {"id": 271, "type": "选择题", "question": "254、使用`pickle`模块序列化对象时，以下哪个方法用于将对象写入文件？\nA、pickle.load()\nB、pickle.dump()\nC、pickle.dumps()\nD、pickle.loads()\n解析：`pickle.dump(obj, file)`将对象序列化到文件，`dumps`返回字节串，`load`/`loads`用于\n反序列化。", "answer": "B", "exam": true}, {"id": 272, "type": "选择题", "question": "255、以下哪个函数可以拼接多个路径组件？\nA、os.path.join()\nB、os.path.split()\nC、os.path.abspath()\nD、os.path.dirname()\n解析：`os.path.join()`会根据操作系统自动处理路径分隔符，拼接多个路径组件，是跨平台路径处\n理的推荐方式。", "answer": "A", "exam": true}, {"id": 273, "type": "选择题", "question": "256、以下哪种文件打开模式可以在文件末尾追加内容且不覆盖原有内容？\nA、r+\nB、w+\nC、a\nD、x\n解析：模式`a`表示追加模式，写入内容会添加到文件末尾；`r+`是读写，`w+`是读写并覆盖，`x`是\n创建新文件。", "answer": "C", "exam": true}, {"id": 274, "type": "选择题", "question": "257、以下哪个模块可以用于处理XML文件？\nA、json\nB、csv\nC、xml.etree.ElementTree\nD、pickle\n解析：`xml.etree.ElementTree`是Python标准库中处理XML的模块，`json`处理JSON，`csv`处理\nCSV，`pickle`处理对象序列化。", "answer": "C", "exam": true}, {"id": 275, "type": "选择题", "question": "258、以下关于Python中类和对象的描述,正确的是()\nA、类是对象的实例,对象是类的模板\nB、对象是类的实例,类是对象的模板\nC、类和对象是完全相同的概念\nD、一个类只能创建一个对象\n解析：类是创建对象的模板,定义了对象的属性和方法;对象是类的实例,每个对象具有类定义的属性\n和方法。一个类可以创建多个对象,因此选项B正确。", "answer": "B", "exam": true}, {"id": 276, "type": "选择题", "question": "259、在Python中,以下哪种写法可以实现类的封装特性()\nA、使用`public`关键字修饰属性\nB、使用单下划线`_`修饰属性,表示私有属性\nC、使用双下划线`__`修饰属性,实现名称重整\nD、所有属性默认都是私有的\n解析：Python中没有`public`等访问修饰符,单下划线`_`是约定俗成的保护属性,双下划线`__`会触\n发名称重整,将属性名变为`_类名__属性`,从而实现封装效果,因此选项C正确。", "answer": "C", "exam": true}, {"id": 277, "type": "选择题", "question": "260、在Python中,子类继承父类时,以下哪种写法正确()\nA、class SubClass(ParentClass):\nB、class SubClass extends ParentClass:\nC、class SubClass = ParentClass:\nD、class SubClass -> ParentClass:\n解析：Python中类的继承语法是在子类名后的括号中指定父类,如`class SubClass(ParentClass):\n`。选项B是Java的继承语法,选项C和D语法错误,因此选项A正确。", "answer": "A", "exam": true}, {"id": 278, "type": "选择题", "question": "261、以下关于Python多继承的描述,正确的是()\nA、Python不支持多继承\nB、Python支持多继承,子类可以继承多个父类\nC、多继承时,子类只能继承第一个父类的属性\nD、多继承时,子类会自动合并所有父类的同名方法\n解析：Python支持多继承,子类可以同时继承多个父类(如`class SubClass(Parent1, Parent2):`)。\n当多个父类有同名方法时,Python会按照MRO(方法解析顺序)决定调用哪个父类的方法,因此选项B正\n确。", "answer": "B", "exam": true}, {"id": 279, "type": "选择题", "question": "262、Python中,以下哪个特殊方法用于定义对象的字符串表示()\nA、__init__()\nB、__str__()\nC、__repr__()\nD、__call__()\n解析：`__init__()`是构造方法,用于初始化对象;`__str__()`用于定义对象的字符串表示,适合用户\n阅读;`__repr__()`用于定义对象的官方字符串表示,适合开发者调试;`__call__()`使对象可以像函\n数一样被调用。因此选项B正确。", "answer": "B", "exam": true}, {"id": 280, "type": "选择题", "question": "263、在Python中,子类重写父类方法时,若想调用父类的同名方法,可以使用()\nA、self.方法名()\nB、super().方法名()\nC、parent.方法名()\nD、直接调用方法名()\n解析：子类重写父类方法后,使用`super().方法名()`可以调用父类的同名方法,`super()`函数返回\n父类对象的代理。选项A会递归调用子类的方法,选项C和D语法错误,因此选项B正确。", "answer": "B", "exam": true}, {"id": 281, "type": "选择题", "question": "264、Python中,以下哪个特殊方法用于实现对象的比较操作()\nA、__add__()\nB、__eq__()\nC、__len__()\nD、__iter__()\n解析：`__add__()`用于加法操作,`__eq__()`用于判断两个对象是否相等(==),`__len__()`用于获取\n对象长度,`__iter__()`用于创建迭代器。因此选项B正确。", "answer": "B", "exam": true}, {"id": 282, "type": "选择题", "question": "265、以下关于Python类属性和实例属性的描述,正确的是()\nA、类属性属于类,所有实例共享;实例属性属于对象,每个实例独有\nB、类属性和实例属性没有区别\nC、实例属性属于类,所有实例共享\nD、类属性属于对象,每个实例独有\n解析：类属性是在类中直接定义的属性(如`class A: x = 1`),所有实例共享该属性;实例属性是在\n`__init__`方法中通过`self`定义的属性(如`self.y = 2`),每个实例独有。因此选项A正确。", "answer": "A", "exam": true}, {"id": 283, "type": "选择题", "question": "266、在面向对象编程中，当子类继承父类且子类重写了`__init__`方法，并且在子类的`__init__`\n方法中使用`super()`调用父类的`__init__`方法，创建子类对象时，会调用哪个`__init__`方法\n（）\nA、只调用父类的`__init__`\nB、只调用子类的`__init__`\nC、先调用子类的`__init__`，再调用父类的`__init__`\nD、先调用父类的`__init__`，再调用子类的`__init__`\n解析：子类重写`__init__`方法并使用`super()`调用父类的`__init__`方法，创建子类对象时，会\n先执行子类的`__init__`方法，然后通过`super()`调用父类的`__init__`方法，因此选项C正确。", "answer": "C", "exam": true}, {"id": 284, "type": "选择题", "question": "267、以下关于Python面向对象编程特性的描述，错误的是（ ）\nA、封装通过将属性和方法结合在类中，并通过访问控制实现数据隐藏，例如使用双下划线开头的属\n性名实现私有属性\nB、继承允许子类复用父类的属性和方法，子类可以通过super()函数调用父类的构造方法__init__\nC、特殊方法如__str__用于自定义对象的字符串表示，当使用print()函数输出对象时会自动调用\nD、对象是类的实例，类是对象的抽象，一个类只能创建一个对象实例\n解析：选项A正确，Python中双下划线开头的属性是私有属性，外部无法直接访问，体现封装特性；\n选项B正确，super()函数用于在子类中调用父类的方法，包括构造方法；选项C正确，__str__方法用\n于定义对象的字符串输出格式，print()会自动调用；选项D错误，一个类可以创建多个对象实例，例\n如`class A: pass`，可以通过`a1 = A()`、`a2 = A()`创建多个实例。因此答案为D。", "answer": "D", "exam": true}, {"id": 285, "type": "选择题", "question": "268、在Python中，以下关于try-except语句的描述，错误的是（ ）\nA、一个try块可以对应多个except块，分别捕获不同类型的异常\nB、except块可以捕获所有类型的异常（不指定异常类型）\nC、finally块中的代码无论是否发生异常都会执行\nD、如果try块中没有发生异常，except块中的代码会被执行一次\n解析：try-except语句中，只有当try块发生指定类型的异常时，对应的except块才会执行。如果try\n块中没有异常，except块不会执行。", "answer": "D", "exam": true}, {"id": 286, "type": "选择题", "question": "269、在Python中，尝试访问列表中不存在的索引会引发什么异常？（ ）\nA、IndexError\nB、KeyError\nC、ValueError\nD、TypeError\n解析：访问列表中不存在的索引会引发IndexError；KeyError通常在访问字典中不存在的键时引发；\nValueError用于值类型正确但值不合法的情况；TypeError用于类型不匹配的情况。", "answer": "A", "exam": true}, {"id": 287, "type": "选择题", "question": "270、在Python中，以下哪个语句用于主动抛出异常？（ ）\nA、raise\nB、throw\nC、try\nD、except\n解析：Python中使用raise语句主动抛出异常；throw不是Python的关键字；try和except用于异常捕\n获。", "answer": "A", "exam": true}, {"id": 288, "type": "选择题", "question": "271、以下Python代码执行后，输出结果是？（ ）<br>try:<br> x = 10 / 0<br>except\nZeroDivisionError:<br> print(\"除数不能为零\")<br>except Exception as e:<br> print(f\"其他\n异常: {e}\")<br>finally:<br> print(\"执行finally块\")\nA、除数不能为零<br>执行finally块\nB、其他异常: division by zero<br>执行finally块\nC、执行finally块\nD、除数不能为零\n解析：代码中10/0会引发ZeroDivisionError，因此第一个except块会执行，输出\"除数不能为零\"；\nfinally块无论是否发生异常都会执行，输出\"执行finally块\"。", "answer": "A", "exam": true}, {"id": 289, "type": "选择题", "question": "272、在Python中，以下代码用于抛出一个自定义异常，横线处应填入？（ ）<br>class MyError\n(Exception):<br> pass<br><br>def func():<br> ____ MyError(\"自定义异常\")<br><br>func()\nA、raise\nB、throw\nC、try\nD、except\n解析：抛出异常需要使用raise语句，此处应填入raise来抛出自定义的MyError异常。", "answer": "A", "exam": true}, {"id": 290, "type": "选择题", "question": "273、以下Python代码中，try块会引发什么异常？（ ）<br>try:<br> s = \"hello\"<br> i = int(s)\n<br>except ValueError as e:<br> print(e)<br>except TypeError as e:<br> print(e)\nA、ValueError\nB、TypeError\nC、NameError\nD、没有异常\n解析：将字符串\"hello\"转换为整数会引发ValueError，因为该字符串无法转换为有效的整数。", "answer": "A", "exam": true}, {"id": 291, "type": "选择题", "question": "274、在Python中，以下关于try-except-finally语句的执行顺序，正确的是？（ ）\nA、try块 → except块（如果有异常） → finally块 → 后续代码\nB、try块 → finally块 → except块（如果有异常） → 后续代码\nC、try块 → 后续代码 → except块（如果有异常） → finally块\nD、try块 → except块（如果有异常） → 后续代码 → finally块\n解析：try-except-finally的执行顺序为：先执行try块；如果发生异常则执行对应的except块；无\n论是否发生异常，都会执行finally块；最后执行后续代码（如果有的话）。", "answer": "A", "exam": true}, {"id": 292, "type": "选择题", "question": "275、以下Python代码执行后，输出结果是？（ ）<br>def func(x):<br> if x < 0:<br> raise\nValueError(\"x不能为负数\")<br> return x<br><br>try:<br> print(func(-5))<br>except\nValueError as e:<br> print(f\"捕获异常: {e}\")<br>except TypeError as e:<br> print(f\"类型\n错误: {e}\")\nA、捕获异常: x不能为负数\nB、类型错误: unsupported operand type(s) for <: 'NoneType' and 'int'\nC、-5\nD、没有输出\n解析：func(-5)中x=-5<0，会抛出ValueError异常；在try-except中，该异常被捕获，输出\"捕获异\n常: x不能为负数\"。", "answer": "A", "exam": true}, {"id": 293, "type": "选择题", "question": "276、在Python中，尝试将字符串转换为整数时，如果字符串不是有效的整数形式，会引发什么异\n常？（ ）\nA、ValueError\nB、TypeError\nC、IndexError\nD、KeyError\n解析：将无效字符串转换为整数会引发ValueError，例如int(\"abc\")会抛出ValueError: invalid\nliteral for int() with base 10: 'abc'。", "answer": "A", "exam": true}, {"id": 294, "type": "选择题", "question": "277、以下Python代码执行后，变量x的值是？（ ）<br>x = 0<br>try:<br> x = 1 / 0<br>except\nZeroDivisionError:<br> x = 2<br>finally:<br> x = 3<br><br>print(x)\nA、3\nB、2\nC、0\nD、抛出异常，无输出\n解析：代码中1/0引发ZeroDivisionError，except块将x赋值为2；finally块无论是否发生异常都会\n执行，将x赋值为3；因此最终x的值为3。", "answer": "A", "exam": true}, {"id": 295, "type": "选择题", "question": "278、以下哪个Python内置库用于处理日期和时间？\nA、datetime\nB、numpy\nC、pandas\nD、matplotlib\n解析：datetime是Python的内置库，用于处理日期和时间；numpy、pandas、matplotlib属于第三方\n库，不属于内置库。", "answer": "A", "exam": true}, {"id": 296, "type": "选择题", "question": "279、使用pip安装Python库时，默认从哪个源获取包？\nA、PyPI\nB、GitHub\nC、Anaconda Cloud\nD、GitLab\n解析：pip是Python的包管理工具，默认从Python Package Index（PyPI）获取包；GitHub、GitLab\n是代码托管平台，Anaconda Cloud是Anaconda的包管理平台。", "answer": "A", "exam": true}, {"id": 297, "type": "选择题", "question": "280、以下哪个内置库用于处理正则表达式？\nA、re\nB、os\nC、sys\nD、json\n解析：re库是Python用于处理正则表达式的内置库；os库用于操作系统交互，sys库用于Python解释\n器交互，json库用于JSON数据处理。", "answer": "A", "exam": true}, {"id": 298, "type": "选择题", "question": "281、构建Python库时，用于描述包信息的文件是？\nA、setup.py\nB、main.py\nC、requirements.txt\nD、README.md\n解析：setup.py是Python库构建的核心文件，用于描述包的名称、版本、依赖等信息；main.py通常\n是程序入口文件，requirements.txt列出依赖包，README.md是说明文档。", "answer": "A", "exam": true}, {"id": 299, "type": "选择题", "question": "282、以下哪个内置库用于生成随机数？\nA、random\nB、math\nC、statistics\nD、itertools\n解析：random库用于生成随机数；math库提供数学运算函数，statistics库用于统计计算，\nitertools库用于迭代器操作。", "answer": "A", "exam": true}, {"id": 300, "type": "选择题", "question": "283、将Python库发布到PyPI时，通常使用哪个工具？\nA、twine\nB、pip\nC、conda\nD、virtualenv\n解析：twine是用于安全上传Python包到PyPI的工具；pip用于安装包，conda是包和环境管理工具，\nvirtualenv用于创建虚拟环境。", "answer": "A", "exam": true}, {"id": 301, "type": "选择题", "question": "284、以下哪个内置库用于处理文件和目录？\nA、os\nB、shutil\nC、pathlib\nD、glob\n解析：os库是Python内置的用于文件和目录操作的核心库；shutil、pathlib、glob虽然也用于文件\n操作，但shutil是高级文件操作库，pathlib是面向对象的路径库，glob用于文件查找，它们都依赖\nos库或属于扩展库。", "answer": "A", "exam": true}, {"id": 302, "type": "选择题", "question": "285、Python库的版本号通常遵循什么规范？\nA、语义化版本（SemVer）\nB、Git版本号\nC、时间戳版本号\nD、随机版本号\n解析：Python库的版本号通常遵循语义化版本规范（SemVer），格式为MAJOR.MINOR.PATCH；其他选\n项不是Python库版本号的标准规范。", "answer": "A", "exam": true}, {"id": 303, "type": "选择题", "question xcept用于捕获并处理异常，finally用于无论是否发生\n异常都会执行的代码块，raise用于主动抛出异常。因此正确答案是B。", "answer": "B", "exam": true}, {"id": 914, "type": "选择题", "question": "857、以下哪个关键字用于主动抛出异常？\nA、assert\nB、try\nC、raise\nD、catch\n解析：raise关键字用于主动抛出异常，assert用于断言判断，try用于包裹可能异常的代码，Python\n中没有catch关键字。因此正确答案是C。", "answer": "C", "exam": true}, {"id": 915, "type": "选择题", "question": "858、当代码执行到finally块时，以下哪种情况会执行finally块中的代码？\nA、只有发生异常时\nB、只有未发生异常时\nC、无论是否发生异常都会执行\nD、只有try块中没有return语句时\n解析：finally块中的代码无论try块是否发生异常，也无论except块是否处理异常，都会被执行。因\n此正确答案是C。", "answer": "C", "exam": true}, {"id": 916, "type": "填空题", "question": "859、在Python中，一个try块可以对应多个except块。\n解析：Python允许一个try块后面跟随多个except块，分别处理不同类型的异常，因此该说法正确。", "answer": "正确", "exam": true}, {"id": 917, "type": "填空题", "question": "860、finally块中的代码在发生异常且没有被except捕获时不会执行。\n解析：finally块中的代码无论异常是否被捕获都会执行，因此该说法错误。", "answer": "错误", "exam": true}, {"id": 918, "type": "填空题", "question": "861、在Python异常处理结构中，______块用于包裹可能发生异常的代码。\n解析：try关键字用于定义可能抛出异常的代码块，因此此处应填try。", "answer": "try；", "exam": true}, {"id": 919, "type": "填空题", "question": "862、使用assert语句抛出的异常可以被except捕获。\n解析：assert语句抛出的AssertionError异常属于Exception的子类，可以被except捕获，因此该说\n法正确。", "answer": "正确", "exam": true}, {"id": 920, "type": "选择题", "question": "863、以下哪个代码结构是正确的异常处理结构？\nA、try: pass except: pass finally: pass\nB、try: pass finally: pass except: pass\nC、except: pass try: pass finally: pass\nD、finally: pass try: pass except: pass\n解析：正确的异常处理结构顺序是try块在前，然后是except块，最后是finally块。B、C、D的顺序\n错误，因此正确答案是A。", "answer": "A", "exam": true}, {"id": 921, "type": "填空题", "question": "864、以下代码执行后，输出结果是______。 ```python try: print(1/0) except\nZeroDivisionError: print(\"除数不能为零\") finally: print(\"执行结束\") ```\n解析：代码中1/0会抛出ZeroDivisionError异常，被except捕获后输出\"除数不能为零\"，然后\nfinally块输出\"执行结束\"，因此输出结果是两行内容的组合。", "answer": "除数不能为零\\n执行结束；", "exam": true}, {"id": 922, "type": "填空题", "question": "865、使用______关键字可以在except块中获取异常的详细信息。\n解析：通过except Exception as e:的形式，可以将异常对象赋值给变量e，从而获取异常的详细信\n息，因此此处应填as。", "answer": "as；", "exam": true}, {"id": 923, "type": "填空题", "question": "866、Python中的所有异常都继承自BaseException类。\n解析：Python中的异常体系中，BaseException是所有异常类的基类，因此该说法正确。", "answer": "正确", "exam": true}, {"id": 924, "type": "填空题", "question": "867、当需要捕获所有类型的异常时，可以使用except ______:语句。\n解析：Exception是所有非系统退出类异常的基类，使用except Exception:可以捕获所有这类异常，\n因此此处应填Exception。", "answer": "Exception；", "exam": true}, {"id": 926, "type": "填空题", "question": "1、学生能够熟练掌握Python基本数据类型(数字类型、字符串类型、布尔类型)的运算规则和类型转换技巧，灵活\n运用数字类型进行各类计算，深入理解字符串的操作方法和格式化技巧，提高字符串处理能力。学会使用布尔类型\n进行复杂的逻辑判断，熟练运用逻辑运算符构建逻辑表达式，准确控制程序流程。能够将多种基本数据类型综合应\n用于实际编程场景，如模拟学生成绩管理系统，解决实际问题，提高编程实践能力", "answer": "", "exam": true}, {"id": 928, "type": "填空题", "question": "869、在Python中，类的构造方法名称是______。\n解析：Python中类的构造方法用于初始化对象，固定名称为__init__，第一个参数通常为self，代表\n实例本身。", "answer": "__init__；", "exam": true}, {"id": 929, "type": "填空题", "question": "870、当子类继承父类后，若要调用父类的方法，可以使用______函数。\n解析：super()函数可以返回父类对象的代理，用于调用父类的方法，尤其是在子类重写父类方法时\n需要保留父类功能的场景。", "answer": "super；", "exam": true}, {"id": 930, "type": "填空题", "question": "871、Python中定义私有属性时，通常在属性名前加______个下划线。\n解析：Python通过在属性名前加两个下划线实现名称修饰，使其变为私有属性，只能在类内部访问，\n外部无法直接访问。", "answer": "两；", "exam": true}, {"id": 931, "type": "选择题", "question": "872、以下关于Python类的描述，错误的是？\nA、类是对象的模板\nB、一个类只能创建一个对象\nC、类中的方法第一个参数通常是self\nD、类可以继承其他类\n解析：一个类可以创建多个对象，每个对象都是类的实例，拥有独立的属性和方法，B选项描述错\n误。", "answer": "B", "exam": true}, {"id": 932, "type": "选择题", "question": "873、下列代码中，能正确创建类实例的是？ class Person: def __init__(self, name): self.\nname = name\nA、p = Person\nB、p = Person()\nC、p = Person('Alice')\nD、p = Person(name='Alice')\n解析：创建类实例时需要调用类名并传入构造方法所需的参数，Person类的__init__方法需要name参\n数，因此C选项正确，D选项参数传递方式也正确，但题目中C选项更直接符合常规写法。", "answer": "C", "exam": true}, {"id": 933, "type": "选择题", "question": "874、Python中，类的静态方法使用哪个装饰器定义？\nA、@staticmethod\nB、@classmethod\nC、@property\nD、@abstractmethod\n解析：@staticmethod装饰器用于定义静态方法，静态方法不需要self或cls参数，可以直接通过类名\n调用；@classmethod用于类方法，第一个参数是cls；@property用于属性装饰器；@abstractmethod\n用于抽象方法。", "answer": "A", "exam": true}, {"id": 934, "type": "选择题", "question": "875、以下关于Python继承的说法，正确的是？\nA、子类不能重写父类的方法\nB、Python支持多继承\nC、父类不能调用子类的方法\nD、继承只能单层级\n解析：Python支持多继承，即一个子类可以继承多个父类；子类可以重写父类方法；父类在特定情况\n下（如通过实例）可以调用子类方法；继承可以是多层级的（如子类继承父类，父类继承祖父类）。", "answer": "B", "exam": true}, {"id": 935, "type": "选择题", "question": "876、下列代码中，执行后输出结果是？ class A: def show(self): print('A') class B(A): def\nshow(self): print('B') obj = B() obj.show()\nA、A\nB、B\nC、AB\nD、BA\n解析：子类B重写了父类A的show方法，当创建B的实例并调用show方法时，会执行子类的show方法，\n输出'B'。", "answer": "B", "exam": true}, {"id": 936, "type": "选择题", "question": "877、Python中，类的属性可以分为实例属性和类属性，以下关于类属性的描述，正确的是？\nA、类属性属于类的实例\nB、类属性在所有实例间共享\nC、类属性只能在实例方法中访问\nD、类属性不能被修改\n解析：类属性是定义在类中、方法外的属性，属于类本身，所有实例共享该属性；类属性可以通过类\n名或实例访问；类属性可以被修改（通过类名修改会影响所有实例，通过实例修改只会创建实例属\n性，不影响类属性）。", "answer": "B", "exam": true}, {"id": 937, "type": "选择题", "question": "878、以下代码中，属于多态体现的是？\nA、同一类的不同实例调用相同方法\nB、不同类的实例调用相同方法名的方法，产生不同结果\nC、子类继承父类的方法\nD、类的静态方法调用\n解析：多态是指不同类的对象对同一方法名做出不同的响应，即调用相同方法名时，不同对象执行不\n同的逻辑，B选项符合多态的定义。", "answer": "B", "exam": true}, {"id": 938, "type": "填空题", "question": "879、Python中，所有类都默认继承object类。\n解析：在Python 3中，所有类都默认继承自object类，这是Python的新风格类特性。", "answer": "正确", "exam": true}, {"id": 939, "type": "填空题", "question": "880、类的实例方法必须包含self参数，且self参数可以省略。\n解析：类的实例方法第一个参数必须是self（代表实例本身），不能省略，否则调用时会报错。", "answer": "错误", "exam": true}, {"id": 940, "type": "填空题", "question": "881、Python中的私有属性无法被外部访问，也无法被子类继承。\n解析：Python通过名称修饰（双下划线开头）实现私有属性，外部无法直接访问，子类也无法继承私\n有属性。", "answer": "正确", "exam": true}, {"id": 941, "type": "填空题", "question": "882、使用@property装饰器可以将类的方法转换为属性，实现属性的只读访问。\n解析：@property装饰器可以将方法转换为属性，默认是只读的，若要实现可写，需要配合@属性名.\nsetter装饰器。", "answer": "正确", "exam": true}, {"id": 942, "type": "填空题", "question": "883、在Python中，多继承时若多个父类有同名方法，会按照广度优先的顺序查找方法。\n解析：Python 3中多继承的方法解析顺序（MRO）采用C3线性化算法，遵循广度优先原则，即先查找\n子类，再按父类顺序查找。", "answer": "正确", "exam": true}, {"id": 943, "type": "选择题", "question": "884、以下哪个不属于Python计算生态的范畴？\nA、Python官方标准库\nB、第三方开源库（如numpy、pandas）\nC、操作系统自带的C语言编译器\nD、Python解释器本身\n解析：Python计算生态包括官方标准库、第三方库及解释器等与Python直接相关的工具和资源，C语\n言编译器属于操作系统或其他语言的工具，不属于Python计算生态。", "answer": "C", "exam": true}, {"id": 944, "type": "选择题", "question": "885、Python计算生态中的\"PyPI\"指的是？\nA、Python Package Index\nB、Python Programming Interface\nC、Python Performance Improvement\nD、Python Platform Integration\n解析：PyPI的全称是Python Package Index，是Python官方的第三方库仓库，用户可以从中下载和管\n理各种Python库。", "answer": "A", "exam": true}, {"id": 945, "type": "选择题", "question": "886、以下哪个库常用于Python中的数据可视化？\nA、requests\nB、matplotlib\nC、scikit-learn\nD、flask\n解析：matplotlib是Python中常用的数据可视化库，requests用于网络请求，scikit-learn用于机器\n学习，flask用于Web开发。", "answer": "B", "exam": true}, {"id": 946, "type": "选择题", "question": "887、Python计算生态的特点不包括以下哪项？\nA、开源性\nB、跨平台性\nC、单一性（仅支持特定领域）\nD、社区驱动\n解析：Python计算生态覆盖多个领域（如科学计算、Web开发、人工智能等），具有开源、跨平台和\n社区驱动的特点，单一性不符合其特点。", "answer": "C", "exam": true}, {"id": 947, "type": "选择题", "question": "888、在Python中，用于管理虚拟环境的工具是？\nA、pip\nB、venv\nC、conda\nD、setup.py\n解析：venv是Python标准库中用于创建和管理虚拟环境的工具，pip用于包管理，conda是另一个环境\n和包管理工具，setup.py用于包的安装配置。", "answer": "B", "exam": true}, {"id": 948, "type": "填空题", "question": "889、Python的计算生态仅包含官方提供的库，不包括第三方库。\n解析：Python计算生态不仅包括官方标准库，还包含大量由社区开发的第三方开源库，这些第三方库\n极大丰富了Python的功能。", "answer": "错误", "exam": true}, {"id": 949, "type": "填空题", "question": "890、PyPI是Python官方的第三方库仓库，用户可以通过pip从PyPI安装库。\n解析：PyPI（Python Package Index）是官方的第三方库仓库，pip是Python的包管理工具，支持从\nPyPI下载和安装库。", "answer": "正确", "exam": true}, {"id": 950, "type": "填空题", "question": "891、NumPy库是Python计算生态中用于科学计算的核心库之一。\n解析：NumPy提供了高性能的数组对象和数学函数，是Python科学计算生态的基础库之一。", "answer": "正确", "exam": true}, {"id": 951, "type": "填空题", "question": "892、Python的计算生态不支持跨平台运行，只能在Windows系统中使用。\n解析：Python本身及大部分库都支持跨平台，可在Windows、macOS、Linux等多种操作系统中运行。", "answer": "错误", "exam": true}, {"id": 952, "type": "填空题", "question": "893、使用虚拟环境可以避免不同项目之间的依赖冲突。\n解析：虚拟环境可以为每个项目创建独立的Python环境，安装各自所需的包版本，从而避免依赖冲\n突。", "answer": "正确", "exam": true}, {"id": 953, "type": "填空题", "question": "894、运算符、基础数据类型和流程控制综合应用", "answer": "", "exam": true}, {"id": 954, "type": "填空题", "
